# cargo-mutants configuration, read by `cargo xtask mutants` and by a bare
# `cargo mutants` run alike.

test_tool = "nextest"
all_features = true
additional_cargo_args = ["--locked"]
additional_cargo_test_args = ["--profile", "mutants"]
# xtask's tests read this repository's history, so the scratch copy needs it.
copy_vcs = true
# The scratch copy leaves out what git ignores: build output, node_modules and
# worktrees kept under the root.
gitignore = true
# `cargo xtask mutants` reads the report from here.
output = "target/mutants"
# `testing`-feature test doubles that no shipped path reaches.
exclude_globs = [
    "crates/spate-clickhouse/src/testing.rs",
    "crates/spate-s3/src/bench_seams.rs",
    "crates/spate-s3/src/fuzz_seams.rs",
]
