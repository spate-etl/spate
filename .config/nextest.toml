# cargo-nextest configuration. Doctests are not part of it; `cargo test --doc`
# is a separate gate.

# nextest only *warns* on configuration keys it does not recognise, then runs
# with its own defaults. An older binary silently ignores `fail-fast = false`
# below and stops at the first failure.
[nextest-version]
required = "0.9.89"
recommended = "0.9.140"

[profile.default]
fail-fast = false

# The docker-backed suites are `#[ignore]`d and run under `--profile docker`,
# which lifts this.
slow-timeout = { period = "30s", terminate-after = 4 }

# Docker/testcontainers runs:
#   cargo nextest run --profile docker --run-ignored all
#
# These boot real containers (SeaweedFS, NATS, Redpanda, ClickHouse). Warn late
# and do not terminate: a cold image pull exceeds any period worth setting, and
# a SIGKILL reports TIMEOUT, indistinguishable from a genuine hang, leaving the
# container orphaned.
[profile.docker]
# The example container tier is opt-in. `scheduled.yml` selects it back with an
# explicit `-E 'binary(e2e_examples)' --ignore-default-filter`.
default-filter = 'not binary(e2e_examples)'
slow-timeout = { period = "120s" }
# One retry, for container-start latency that belongs to the docker daemon
# rather than to the code under test. A retried test surfaces as a flaky
# annotation through the JUnit report below, so a repeat is visible rather than
# silently green. Delete this line once a retry arrives with a cause attached.
retries = 1

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 4 }
# One retry keeps a scheduler stall from blocking an unrelated pull request.
# Retried tests are reported as flaky in the summary and in the JUnit report,
# which CI uploads as a check annotation; without that upload a retry goes green
# leaving only scrolled-past log text.
retries = 1
failure-output = "immediate-final"
status-level = "retry"

[profile.ci.junit]
path = "junit.xml"

[profile.docker.junit]
path = "junit.xml"
