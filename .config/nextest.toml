# cargo-nextest configuration. Doctests are not part of it; `cargo test --doc`
# is a separate gate.

# nextest only *warns* on configuration keys it does not recognize, then runs
# with its own defaults. An older binary silently ignores `fail-fast = false`
# below and stops at the first failure.
[nextest-version]
required = "0.9.89"
recommended = "0.9.140"

[profile.default]
fail-fast = false

# The docker-backed suites are `#[ignore]`d and run under `--profile docker`,
# which lifts this.
slow-timeout = { period = "30s", terminate-after = 4 }

# Docker/testcontainers runs:
#   cargo nextest run --profile docker --run-ignored all --all-features
#
# These boot real containers (RustFS, ElasticMQ, Kafka, ClickHouse). Warn
# late and do not terminate: a cold image pull exceeds any period worth setting,
# and a SIGKILL reports TIMEOUT, indistinguishable from a genuine hang, leaving
# the container orphaned.
[profile.docker]
# The example container tier is opt-in. `nightly.yml` selects it back with an
# explicit `-E 'binary(e2e_examples)' --ignore-default-filter`.
default-filter = 'not binary(e2e_examples)'
slow-timeout = { period = "120s" }
# A passing container test's captured output, such as the nested build's disk
# figures, reaches the job log only when passing output is kept.
success-output = "final"

# What cargo-mutants runs, through `.cargo/mutants.toml`. A mutant is decided
# by its first failing test, so the rest of the suite is not run.
[profile.mutants]
fail-fast = true

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"
status-level = "fail"

[profile.ci.junit]
path = "junit.xml"

[profile.docker.junit]
path = "junit.xml"
