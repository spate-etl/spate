name: Something else does the wrong thing
description: A crash, a wrong result, a configuration that will not load, a metric that reads wrong.
title: "[bug] "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        For anything touching delivery guarantees — records lost, duplicated, or
        a watermark advancing past unacknowledged data — please use the
        **delivery-correctness** form instead. It asks the questions that class
        of bug needs.

  - type: dropdown
    id: components
    attributes:
      label: Where
      options:
        - Engine (spate-core)
        - Kafka source (spate-kafka)
        - Kafka sink (spate-kafka)
        - ClickHouse sink (spate-clickhouse)
        - S3 source (spate-s3)
        - JSON deserializer (spate-json)
        - Avro deserializer (spate-avro)
        - Coordination (spate-coordination)
        - Test doubles (spate-test)
        - Metrics or the admin endpoint (spate-core)
        - Configuration loading (spate-core)
        - Documentation
        - Build, CI, or the examples
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `spate` version, or the commit if building from source.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: features
    attributes:
      label: Cargo features
      description: >-
        Which features are enabled. This matters more than it looks — most of
        the crate is behind one.
      placeholder: 'kafka, clickhouse, avro'
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Rust version and platform
      description: >-
        `rustc --version` and your OS/architecture. The MSRV is 1.94.
      placeholder: "rustc 1.97.0, macOS aarch64"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what it did.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >-
        The smallest thing that shows it. `spate-test`'s in-memory source and
        capture sink will reproduce most engine behaviour with no
        infrastructure at all, and a test written against them is the most
        useful reproduction there is.
      render: rust

  - type: textarea
    id: data
    attributes:
      label: A sample record
      description: >-
        If the bug involves records at all, one in the shape the pipeline was
        carrying, with anything sensitive replaced.
      placeholder: '{"id": 1, "ts": "2026-07-31T09:00:00Z", "payload": "..."}'

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >-
        Relevant YAML. **Remove credentials, hostnames and anything else you
        would not publish** — this is a public issue.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: >-
        Errors, panics, or relevant log lines. Long output is fine. **Check it
        for credentials before pasting.**
      render: shell
