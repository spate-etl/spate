name: Throughput or latency below expectation
description: The pipeline is slower than it should be, or slower than it was.
title: "[perf] "
type: Bug
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        The most common cause is not the framework. Sink egress concurrency,
        partition count, and the chunk-sealing cadence each bound throughput
        independently, and a pipeline can sit at a fraction of one core while
        none of them is the framework's doing. The connector tuning pages walk
        through which is which.

        **Numbers are re-measured before they are acted on**, on reference
        hardware under the published protocol. A number from a busy laptop is
        not comparable to one from a quiet host, and run-to-run spread on
        throughput is wide. The methodology lives in the
        [benchmark repository](https://github.com/spate-etl/benchmark).

  - type: dropdown
    id: kind
    attributes:
      label: What kind
      options:
        - Throughput lower than expected
        - Latency higher than expected
        - A regression — it was faster on an earlier version
        - CPU or memory higher than expected
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        For a regression, both the version that was fast and the version that
        is not.
      placeholder: "0.1.0 (was fine on 0.1.0-rc)"
    validations:
      required: true

  - type: dropdown
    id: components
    attributes:
      label: Which components
      description: >-
        Most of what looks like framework overhead is one of these bounding
        the pipeline on its own. Saying which are in the path is what makes
        the numbers readable.
      multiple: true
      options:
        - Engine (spate-core)
        - Kafka source (spate-kafka)
        - Kafka sink (spate-kafka)
        - ClickHouse sink (spate-clickhouse)
        - S3 source (spate-s3)
        - JSON deserializer (spate-json)
        - Avro deserializer (spate-avro)
        - Coordination (spate-coordination)
        - Synthetic data source (spate-datagen)
        - A connector I wrote
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Rust version and platform
      description: >-
        `rustc --version` and your OS/architecture. A throughput number is not
        comparable across architectures, and the reference hardware is named
        in the methodology.
      placeholder: "rustc 1.97.0, Linux x86_64"
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: The numbers
      description: >-
        What you measured, and what you expected. Rows or records per second,
        or a latency percentile. Please say which.
    validations:
      required: true

  - type: textarea
    id: envelope
    attributes:
      label: The envelope
      description: >-
        CPU cores and memory available to the process, and whether it is
        containerized with a limit. Also the shape of the work: partition
        count, sink shard count, in-flight budget, batch sizes.
      placeholder: |
        4 CPU / 4 GiB container
        8 partitions, 1 sink shard, inflight 2, max_rows 262144
    validations:
      required: true

  - type: textarea
    id: saturation
    attributes:
      label: What is saturated
      description: >-
        Optional. Is the process CPU-bound? Is it throttled? Are the sink
        queues full or empty? `spate_queue_*`, `spate_backpressure_*` and
        `spate_sink_*` answer this directly.

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >-
        Your YAML. **Remove credentials, hostnames and anything else you would
        not publish.** This is a public issue.
      render: yaml
