blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/spate-etl/spate/security/advisories/new
    about: >-
      Privately, through GitHub's advisory flow. Anything that could let a
      pipeline lose or leak data belongs here rather than in a public issue.
  - name: Read the documentation
    url: https://spate.kainth.dev/
    about: >-
      The user guide, the design rationale, and every metric with its labels.
      The delivery-semantics page is the one to read before reporting data loss.
  - name: Benchmarks and methodology
    url: https://spate.kainth.dev/benchmarks
    about: >-
      Published performance comparisons and the measurement protocol, with the
      harness that produces them in the benchmark repository. Throughput claims
      are settled there.
