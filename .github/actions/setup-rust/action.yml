name: Set up Rust
description: >
  Toolchain, prebuilt cargo tools and a shared build cache, the preamble every
  Rust job in this repo needs. Callers must run actions/checkout first.

# Composite rather than a reusable workflow: a reusable workflow is a separate
# job, and it renames every status check to "caller / job", breaking branch
# protection.

inputs:
  toolchain:
    description: Rust toolchain to install (stable, nightly, or a version like "1.94").
    required: false
    default: stable
  components:
    description: Comma-separated rustup components, e.g. "rustfmt, clippy".
    required: false
    default: ""
  tools:
    description: >
      Comma-separated tools for taiki-e/install-action, e.g. "nextest,cargo-hack".
      Pass a version where the tool's *behavior* is what a gate rests on.
    required: false
    default: ""
  shared-key:
    description: >
      Swatinem/rust-cache shared-key. Jobs that build substantially the same
      dependency graph should pass the same value so they share one cache entry
      instead of writing one each. Leave empty to skip caching entirely.
    required: false
    default: ""
  cache-save:
    description: >
      Whether this job may write its cache entry. "auto" (the default) writes
      from `main` only. "never" makes the job a pure consumer, for an entry a
      single dedicated job is meant to own. Several jobs sharing one key race
      to write it the first time it is missing, and the fastest job wins,
      having built the least.
    required: false
    default: auto

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - if: inputs.tools != ''
      uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
      with:
        tool: ${{ inputs.tools }}

    # `save-if` restricted to main holds one warm baseline against the 10 GB
    # per-repo cache ceiling. Left at its default, every job on every pull
    # request writes its own entry, and the LRU budget evicts that baseline. A
    # run may read its own branch, the default branch, and its pull request
    # base.
    - if: inputs.shared-key != ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.cache-save != 'never' && github.ref == 'refs/heads/main' }}
