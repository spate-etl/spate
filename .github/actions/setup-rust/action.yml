name: Set up Rust
description: >
  Toolchain, prebuilt cargo tools and a shared build cache, the preamble every
  Rust job in this repo needs. Callers must run actions/checkout first.

# Composite rather than a reusable workflow: a reusable workflow is a separate
# job, and it renames every status check to "caller / job", breaking branch
# protection.

inputs:
  toolchain:
    description: Rust toolchain to install (stable, nightly, or a version like "1.94").
    required: false
    default: stable
  toolchain-file:
    description: >
      Path to a file holding a `channel = "..."` line to install instead of
      `toolchain`. Takes precedence where both are given.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components, e.g. "rustfmt, clippy".
    required: false
    default: ""
  tools:
    description: >
      Comma-separated tools for taiki-e/install-action, e.g. "nextest,cargo-hack".
      Pass a version where the tool's *behavior* is what a gate rests on.
    required: false
    default: ""
  shared-key:
    description: >
      Swatinem/rust-cache shared-key. Jobs that build substantially the same
      dependency graph should pass the same value so they share one cache entry
      instead of writing one each. Leave empty to skip caching entirely.
    required: false
    default: ""
  cache-save:
    description: >
      Whether this job may write its cache entry. "auto" (the default) writes
      from `main` only. "never" makes the job a pure consumer, for an entry a
      single dedicated job is meant to own. Several jobs sharing one key race
      to write it the first time it is missing, and the fastest job wins,
      having built the least.
    required: false
    default: auto

outputs:
  toolchain:
    description: >
      The toolchain that was installed and made default. `cargo +<toolchain>`
      needs it, since a bare `+nightly` names a different toolchain and
      resolves the floating channel.
    value: ${{ steps.resolve.outputs.toolchain }}
  rustc:
    description: The installed compiler's one-line version, as `rustc --version` prints it.
    value: ${{ steps.record.outputs.rustc }}

runs:
  using: composite
  steps:
    # The path goes through `env:`. Interpolating it into the `run:` block
    # splices the caller's text into generated shell.
    - id: resolve
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
      run: |
        set -euo pipefail
        if [[ -n "$TOOLCHAIN_FILE" ]]; then
          TOOLCHAIN=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$TOOLCHAIN_FILE")
          if [[ -z "$TOOLCHAIN" ]]; then
            echo "::error::$TOOLCHAIN_FILE declares no channel"
            exit 1
          fi
        fi
        echo "toolchain=$TOOLCHAIN" >>"$GITHUB_OUTPUT"
      shell: bash

    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}

    # Which compiler produced this job's result, on the job's own page. The
    # short form already carries the commit hash and date.
    - id: record
      run: |
        set -euo pipefail
        rustc=$(rustc --version)
        echo "rustc=$rustc" >>"$GITHUB_OUTPUT"
        echo "$rustc" >>"$GITHUB_STEP_SUMMARY"
      shell: bash

    - if: inputs.tools != ''
      uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
      with:
        tool: ${{ inputs.tools }}

    # `save-if` restricted to main holds one warm baseline against the 10 GB
    # per-repo cache ceiling. Left at its default, every job on every pull
    # request writes its own entry, and the LRU budget evicts that baseline. A
    # run may read its own branch, the default branch, and its pull request
    # base.
    - if: inputs.shared-key != ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.cache-save != 'never' && github.ref == 'refs/heads/main' }}
