# Dependency update automation. Nothing auto-merges.
#
# Every label named below must exist in `.github/labels.yml`.
version: 2

updates:
  # ---------------------------------------------------------------- Rust ----
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    labels: ["dependencies", "area: workspace"]
    commit-message:
      prefix: "chore(workspace)"

    cooldown:
      default-days: 7
      # Cooldown classifies a bump positionally, calling it major only when the
      # leading integer moves. It is not Cargo-aware, so for a 0.x crate the
      # breaking release is a minor and semver-minor-days is what reaches it.
      semver-minor-days: 14
      semver-major-days: 14

    # async-nats requires base64 ^0.22, and object_store, hyper-util, reqwest,
    # tonic and rustls-native-certs all reach 0.22 as well, so base64 0.23 adds
    # a second copy of the crate rather than replacing the first. The consts
    # this workspace uses stay on the scalar engine either way, so the bump
    # buys a duplicate and a THIRD-PARTY.md row and nothing else.
    #
    # Both update-types are named because the positional classification above
    # applies here too: for a 0.x crate the breaking release moves the minor,
    # so `semver-minor` is what reaches 0.22 -> 0.23, and `semver-major` covers
    # a later 1.0. Patches on the 0.22 line still come through.
    #
    # Delete this when async-nats moves to ^0.23. Tracked in #379.
    ignore:
      - dependency-name: "base64"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

    # Under Cargo's default `increase-if-necessary`, a manifest edit in a bump
    # signals a dependency moved outside its declared requirement.
    groups:
      # One pull request for everything semver-compatible. Majors stay out of
      # the group so each arrives on its own.
      #
      # Grouping is Cargo-aware. For a 0.x crate 0.39 -> 0.40 classifies as
      # major and arrives as its own pull request, so the "minor" entry here
      # only matches dependencies at 1.0 or above.
      cargo-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ----------------------------------------------- Cargo (fuzz harness) ----
  - package-ecosystem: cargo
    # `fuzz/` is its own workspace root and sits outside the root member list,
    # so the `/` entry above never reaches its lockfile. Left out, the harness
    # fuzzes the workspace's current sources against pinned third-party crates
    # that drift further behind every week.
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies", "area: workspace"]
    commit-message:
      prefix: "chore(workspace)"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 14
    groups:
      fuzz-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ------------------------------------------------------- GitHub Actions ----
  - package-ecosystem: github-actions
    # `/` reaches `.github/workflows/` and nothing else. A composite action's
    # own `uses:` pins sit in its own directory and need it named; the glob
    # takes in any action added later.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "chore(ci)"
    # `default-days` only. The semver-*-days keys are unsupported for this
    # ecosystem and for docker.
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # -------------------------------------------- npm (documentation site) ----
  # The benchmark data the site renders under /benchmarks. A bump reaches the
  # deployed site at the next nightly docs build or a manual `tier: docs`
  # dispatch; nothing deploys on push to main.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    labels: ["dependencies", "area: website"]
    commit-message:
      prefix: "chore(docs)"
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: website"]
    commit-message:
      prefix: "chore(docs)"
    cooldown:
      default-days: 7
      # 0.x packages here too, so semver-minor-days reaches them as above.
      semver-minor-days: 14
      semver-major-days: 14
    # TypeScript 7 removed `baseUrl`, which `@docusaurus/tsconfig` sets and
    # `website/tsconfig.json` inherits, so the major lands as a typecheck
    # failure. Delete this when Docusaurus supports the newer line, and take
    # the major on its own.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Docusaurus core, the preset, the theme and any registered plugin move
      # together; updating one without the others breaks the build. Majors
      # included.
      #
      # @easyops-cn/docusaurus-search-local is a Docusaurus plugin, and its
      # peer range names @docusaurus/theme-common. Left out of this group, a
      # Docusaurus major moves @docusaurus/* alone and fails `npm ci` with
      # ERESOLVE.
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@easyops-cn/*"
      npm-compatible:
        patterns: ["*"]
        exclude-patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@easyops-cn/*"
        update-types: ["minor", "patch"]

  # ---------------------------------------------- Docker (example image) ----
  - package-ecosystem: docker
    directory: "/examples/docker"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: examples"]
    commit-message:
      prefix: "chore(examples)"
    # `default-days` only, as for github-actions above.
    cooldown:
      default-days: 7
    # rustc 1.98.0 miscompiles generated vtables (rust-lang/rust#161441), and
    # every `rust:1.98.0-*` image carries it. Delete this entry once a 1.98.1
    # image exists, and take that instead.
    #
    # Both spellings are listed because the docker updater's matching against a
    # suffixed tag is undocumented: whichever of the two it compares against,
    # one of these matches and the other is inert.
    #
    # Tracked in #378.
    ignore:
      - dependency-name: "rust"
        versions: ["1.98.0", "1.98.0-bookworm"]
