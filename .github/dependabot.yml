# Dependency update automation. Nothing auto-merges.
#
# Every label named below must exist in `.github/labels.yml`.
version: 2

updates:
  # ---------------------------------------------------------------- Rust ----
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # A cargo bump leaves THIRD-PARTY.md stale, and Dependabot does not
    # regenerate it. The inventory is checked nightly and regenerated at
    # release, so a bump merges without it.
    open-pull-requests-limit: 4
    labels: ["dependencies", "area: workspace"]
    commit-message:
      prefix: "chore(workspace)"

    cooldown:
      default-days: 7
      # Cooldown classifies a bump positionally, calling it major only when the
      # leading integer moves. It is not Cargo-aware, so for a 0.x crate the
      # breaking release is a minor and semver-minor-days is what reaches it.
      semver-minor-days: 14
      semver-major-days: 14

    # No `versioning-strategy`, so this takes Cargo's default of
    # `increase-if-necessary`. Cargo.toml is edited only when the new version
    # falls outside the existing requirement, so a manifest edit in a bump is
    # the signal that a dependency moved outside its declared range.
    groups:
      # One pull request for everything semver-compatible. Majors stay out of
      # the group so each arrives on its own.
      #
      # Grouping is Cargo-aware. For a 0.x crate 0.39 -> 0.40 classifies as
      # major and arrives as its own pull request, so the "minor" entry here
      # only matches dependencies at 1.0 or above.
      cargo-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ------------------------------------------------------- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "chore(ci)"
    # `default-days` only. The semver-*-days keys are unsupported for this
    # ecosystem and for docker.
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # -------------------------------------------- npm (documentation site) ----
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: website"]
    commit-message:
      prefix: "chore(docs)"
    cooldown:
      default-days: 7
      # 0.x packages here too, so semver-minor-days reaches them as above.
      semver-minor-days: 14
      semver-major-days: 14
    # TypeScript 7 removed `baseUrl`, which `@docusaurus/tsconfig` sets and
    # `website/tsconfig.json` inherits, so the major lands as a typecheck
    # failure. Delete this when Docusaurus supports the newer line, and take
    # the major on its own.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Docusaurus core, the preset, the theme and any registered plugin move
      # together; updating one without the others breaks the build. Majors
      # included.
      #
      # @easyops-cn/docusaurus-search-local is a Docusaurus plugin, and its
      # peer range names @docusaurus/theme-common. Left out of this group, a
      # Docusaurus major moves @docusaurus/* alone and fails `npm ci` with
      # ERESOLVE.
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@easyops-cn/*"
      npm-compatible:
        patterns: ["*"]
        exclude-patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@easyops-cn/*"
        update-types: ["minor", "patch"]

  # ---------------------------------------------- Docker (example image) ----
  - package-ecosystem: docker
    directory: "/examples/docker"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: examples"]
    commit-message:
      prefix: "chore(examples)"
    # `default-days` only, as for github-actions above.
    cooldown:
      default-days: 7
