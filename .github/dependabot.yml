# Dependency update automation. Nothing auto-merges.
#
# Every label named below must exist in `.github/labels.yml`.
version: 2

updates:
  # ---------------------------------------------------------------- Rust ----
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    labels: ["dependencies", "area: workspace"]
    commit-message:
      prefix: "workspace"

    cooldown:
      default-days: 7
      # Cooldown classifies a bump positionally, calling it major only when the
      # leading integer moves. It is not Cargo-aware, so for a 0.x crate the
      # breaking release is a minor and semver-minor-days is what reaches it.
      semver-minor-days: 14
      semver-major-days: 14

    ignore:
      # spate-s3 decodes listing pages with the quick-xml decoder object_store
      # runs, so the two must resolve to one copy. object_store requires
      # quick-xml ^0.41, and a quick-xml bump on its own leaves spate-s3 on a
      # different decoder with no gate to notice.
      #
      # Delete this when object_store moves off ^0.41, and move quick-xml in
      # that same pull request. Tracked in #1193.
      - dependency-name: "quick-xml"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

    # Under Cargo's default `increase-if-necessary`, a manifest edit in a bump
    # signals a dependency moved outside its declared requirement.
    groups:
      # syn, quote and proc-macro2 release in lockstep.
      #
      # Grouping is Cargo-aware. For a 0.x crate 0.39 -> 0.40 classifies as
      # major and arrives as its own pull request, so the "minor" entry here
      # only matches these three at 1.0 or above.
      proc-macro-trio:
        patterns: ["syn", "quote", "proc-macro2"]
        update-types: ["minor", "patch"]
      # smithy-rs releases the SDK crates together, and a client built with
      # one release and a config loader from another can disagree. aws-lc-rs
      # and aws-lc-sys release on their own schedule, so the patterns name the
      # SDK crates alone.
      aws-sdk:
        patterns: ["aws-config", "aws-sdk-*", "aws-smithy-*", "aws-credential-types"]
        update-types: ["minor", "patch"]

  # --------------------------------------------------- Rust (the nightly) ----
  # The dated nightly every job needing one installs. Nothing else moves it:
  # no workflow here pushes to git.
  #
  # No cooldown. This ecosystem's releases carry no date, so the check has
  # nothing to compare and never holds a bump back. The weekly schedule is the
  # whole pacing.
  - package-ecosystem: rust-toolchain
    directory: "/.github/toolchains/nightly"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"

  # ----------------------------------------- Rust (the snapshot stable) ----
  # The exact stable the allocation snapshots run on. A release that moves a
  # count then fails only on its own pull request, where the rewritten files
  # are committed.
  - package-ecosystem: rust-toolchain
    directory: "/.github/toolchains/stable"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"

  # ------------------------------------------------------- GitHub Actions ----
  - package-ecosystem: github-actions
    # `/` reaches `.github/workflows/` and nothing else. A composite action's
    # own `uses:` pins sit in its own directory and need it named; the glob
    # takes in any action added later.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    # `default-days` only. The semver-*-days keys are unsupported for this
    # ecosystem and for docker.
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # -------------------------------------------- gitsubmodule (benchmark) ----
  # The benchmark data the site renders under /benchmarks. A bump reaches the
  # deployed site at the next nightly docs build or a manual `tier: docs`
  # dispatch of `nightly.yml`; nothing deploys on push to main.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    labels: ["dependencies", "area: website"]
    commit-message:
      prefix: "website"
    cooldown:
      default-days: 3

  # ------------------------------------------------------- npm (website) ----
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: website"]
    commit-message:
      prefix: "website"
    cooldown:
      default-days: 7
      # 0.x packages here too, so semver-minor-days reaches them as above.
      semver-minor-days: 14
      semver-major-days: 14
    # TypeScript 7 removed `baseUrl`, which `@docusaurus/tsconfig` sets and
    # `website/tsconfig.json` inherits, so the major lands as a typecheck
    # failure. Delete this when Docusaurus supports the newer line, and take
    # the major on its own.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Docusaurus core, the preset, the theme and any registered plugin move
      # together; updating one without the others breaks the build. Majors
      # included.
      #
      # @easyops-cn/docusaurus-search-local is a Docusaurus plugin, and its
      # peer range names @docusaurus/theme-common. Left out of this group, a
      # Docusaurus major moves @docusaurus/* alone and fails `npm ci` with
      # ERESOLVE.
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@easyops-cn/*"
      npm-compatible:
        patterns: ["*"]
        exclude-patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@easyops-cn/*"
        update-types: ["minor", "patch"]

  # ------------------------------------------------ Docker (Rust images) ----
  # `examples/docker` and `ci/rust/stable` pin the same `rust` image, as the
  # example's builder and as the image `spate-kafka`'s `tls_system_ca` builds
  # and runs its system OpenSSL client in. The group moves both in one pull
  # request. Dependabot keeps the `-bookworm` suffix, so a move off Debian 12 is
  # a maintainer edit.
  - package-ecosystem: docker
    directories:
      - "/examples/docker"
      - "/ci/rust/stable"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: examples", "area: ci"]
    commit-message:
      prefix: "workspace"
    # `default-days` only, as for github-actions above.
    cooldown:
      default-days: 7
    groups:
      rust-image:
        patterns: ["rust"]

  # ------------------------------------- Docker (ClickHouse test matrix) ----
  # `ci/clickhouse/<lane>/Dockerfile` pins the server each lane of the version
  # matrix runs. Nothing builds them; a Dockerfile is what the docker ecosystem
  # reads, and it moves the tag and the digest together.
  #
  # Both entries pin an exact four-component tag, for the reason #376 gives: a
  # bump diff has to say which patch version it moved to.
  #
  # The two LTS lanes, held on their lines. `ignore` matches the first two
  # segments, so `26.3.33.24` excludes everything from 26.4 up and admits
  # `26.3.34.x`. Moving a line to the next LTS is a maintainer edit.
  - package-ecosystem: docker
    directories:
      - "/ci/clickhouse/lts-previous"
      - "/ci/clickhouse/lts"
    # Monthly: 26.3 published six patch releases in ten days, and a
    # test-fixture pin gains nothing from chasing each one.
    schedule:
      interval: monthly
      day: friday
    open-pull-requests-limit: 2
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    # One pull request for both lanes: the same image under two policies.
    groups:
      clickhouse-lts:
        patterns: ["clickhouse/clickhouse-server"]
    ignore:
      - dependency-name: "clickhouse/clickhouse-server"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # The newest release, whatever it is. No `ignore`, so this is the lane a
  # server change reaches first, and weekly so it reaches it within a week.
  #
  # When a release breaks the suite, this pull request goes red and stays open.
  # DEVELOPING.md carries what to do next.
  - package-ecosystem: docker
    directory: "/ci/clickhouse/stable"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # ------------------------------------------ Docker (Kafka test broker) ----
  # `ci/kafka/stable/Dockerfile` pins the broker the Kafka container suites
  # boot. No `ignore`, so it follows every Apache Kafka release.
  - package-ecosystem: docker
    directory: "/ci/kafka/stable"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # ----------------------------------------------- Docker (RustFS store) ----
  # `ci/rustfs/stable/Dockerfile` pins the S3 store the spate-s3 container
  # suites, spate-kafka's notification suite and spate-test-support's smoke
  # test boot. No `ignore`, so it follows every release.
  - package-ecosystem: docker
    directory: "/ci/rustfs/stable"
    schedule:
      interval: monthly
      day: friday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # -------------------------------------------- Docker (ElasticMQ queue) ----
  # `ci/elasticmq/stable/Dockerfile` pins the SQS-compatible queue the
  # container suites boot. No `ignore`, so it follows every release.
  - package-ecosystem: docker
    directory: "/ci/elasticmq/stable"
    schedule:
      interval: monthly
      day: friday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # ------------------------------------- Docker (Kafka TLS client image) ----
  # `ci/debian/trixie/Dockerfile` pins the image `spate-kafka`'s `tls_system_ca`
  # runs its clients in. Held on Debian 13: a new release moves glibc, which
  # bounds the hosts that can run the test, so that move is a maintainer edit.
  - package-ecosystem: docker
    directory: "/ci/debian/trixie"
    schedule:
      interval: monthly
      day: friday
    open-pull-requests-limit: 1
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "debian"
        update-types: ["version-update:semver-major"]
