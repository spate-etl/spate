# Path rules for the `crate:` and `area:` labels on a pull request.
#
# Every label named here must exist in `.github/labels.yml`. GitHub creates a
# missing one on the fly, with a default color and no description, so a name
# that does not match the taxonomy lands as a stray label rather than an error.

"crate: spate":
  - changed-files:
      - any-glob-to-any-file: crates/spate/**

"crate: spate-core":
  - changed-files:
      - any-glob-to-any-file: crates/spate-core/**

"crate: spate-kafka":
  - changed-files:
      - any-glob-to-any-file: crates/spate-kafka/**

"crate: spate-clickhouse":
  - changed-files:
      - any-glob-to-any-file: crates/spate-clickhouse/**

"crate: spate-s3":
  - changed-files:
      - any-glob-to-any-file: crates/spate-s3/**

"crate: spate-json":
  - changed-files:
      - any-glob-to-any-file: crates/spate-json/**

"crate: spate-avro":
  - changed-files:
      - any-glob-to-any-file: crates/spate-avro/**

"crate: spate-coordination":
  - changed-files:
      - any-glob-to-any-file: crates/spate-coordination/**

"crate: spate-datagen":
  - changed-files:
      - any-glob-to-any-file: crates/spate-datagen/**

"crate: spate-test":
  - changed-files:
      - any-glob-to-any-file: crates/spate-test/**

# The two match keys are ORed. `actions/labeler` wraps a bare `changed-files`
# in `any`, and `checkAnyChangedFiles` returns on the first key that matches, so
# an exclusion has to sit inside the key it applies to.
#
# CHANGELOG.md is assembled from changelog.d/ at release; THIRD-PARTY.md is
# generated and carries the supply-chain label below. `all-globs-to-any-file`
# requires one changed file to match every pattern in its list, so the two
# negations exclude those files and leave any other root markdown counting as
# documentation.
"area: docs":
  - changed-files:
      - any-glob-to-any-file: docs/**
      - all-globs-to-any-file:
          - "*.md"
          - "!CHANGELOG.md"
          - "!THIRD-PARTY.md"

"area: website":
  - changed-files:
      - any-glob-to-any-file: website/**

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/**
          - Makefile
          - codecov.yml
          - .config/nextest.toml

"area: examples":
  - changed-files:
      - any-glob-to-any-file: examples/**

# Both benchmark tiers: the unpublished harness in `bench/`, and the targets
# inside each crate. A `benches/` change also carries its crate's label.
"area: bench":
  - changed-files:
      - any-glob-to-any-file:
          - bench/**
          - crates/*/benches/**

# The license and advisory surface, all of it CODEOWNED.
"area: supply-chain":
  - changed-files:
      - any-glob-to-any-file:
          - deny.toml
          - about.toml
          - about/**
          - THIRD-PARTY.md

# The root manifest and lockfile, cross-crate plumbing belonging to no single
# crate.
"area: workspace":
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.toml
          - Cargo.lock
