# The label taxonomy.
#
# Applied by `.github/workflows/labels.yml` on push to main. That workflow does
# not prune: labels absent from this file are left alone.
#
# ---------------------------------------------------------------------------
#
# The namespaces:
#
#   crate:     which crate, by package name.
#   area:      the non-crate surfaces.
#   platform:  where it happens, when that is the point.
#   needs:     what is blocking the issue, not what it is about.
#   priority:  how soon an issue with no milestone is taken.
#
# GitHub's native issue types carry the type axis and the forms set them, so a
# bug arrives typed rather than labeled. `delivery-correctness` and
# `performance` are classes of bug with their own triage priority, so they stay
# as labels below.
#
# A milestone commits an issue to a release, and `release blocker` marks one
# that release cannot ship without. An issue with no milestone carries a
# `priority:` label in its place.
#

- name: "crate: spate"
  color: "0052cc"
  description: "The facade crate and its feature flags"

- name: "crate: spate-core"
  color: "0052cc"
  description: "The engine, its operators, checkpointing, backpressure and runtime"

- name: "crate: spate-kafka"
  color: "0052cc"
  description: "The Kafka source, sink and feed"

- name: "crate: spate-clickhouse"
  color: "0052cc"
  description: "The ClickHouse sink"

- name: "crate: spate-clickhouse-derive"
  color: "0052cc"
  description: "The #[derive(ClickHouseRow)] proc-macro"

- name: "crate: spate-s3"
  color: "0052cc"
  description: "The S3 source"

- name: "crate: spate-sqs"
  color: "0052cc"
  description: "The SQS feed backend"

- name: "crate: spate-json"
  color: "0052cc"
  description: "The JSON deserializer"

- name: "crate: spate-avro"
  color: "0052cc"
  description: "The Avro deserializer and schema registry"

- name: "crate: spate-coordination"
  color: "0052cc"
  description: "Leader election, work assignment, and the store backends"

- name: "crate: spate-datagen"
  color: "0052cc"
  description: "The synthetic storefront-event source"

- name: "crate: spate-csv"
  color: "0052cc"
  description: "The CSV and TSV format: framer, deserializer and encoder"

- name: "crate: spate-lookup"
  color: "0052cc"
  description: "In-memory lookup tables and their loaders"

- name: "crate: spate-test"
  color: "0052cc"
  description: "The test doubles framework users build against"

# ------------------------------------------------------------------- area ----
#
# Everything that is not a crate.

- name: "area: docs"
  color: "5319e7"
  description: "The prose under docs/"

- name: "area: website"
  color: "5319e7"
  description: "The Docusaurus site under website/"

- name: "area: ci"
  color: "5319e7"
  description: "Workflows, actions, and the scripts they run"

- name: "area: bench"
  color: "5319e7"
  description: "The benchmark harness, its targets, and how a change is measured"

- name: "area: examples"
  color: "5319e7"
  description: "The runnable examples and the flagship image"

- name: "area: supply-chain"
  color: "5319e7"
  description: "Licenses, advisories, and the third-party inventory"

- name: "area: workspace"
  color: "5319e7"
  description: "The root manifest, the lockfile, and cross-crate plumbing"

# --------------------------------------------------------------- platform ----
#
# Only worth applying when the platform is the point rather than incidental,
# such as a measurement question that appears on one host architecture only.

- name: "platform: macos"
  color: "006b75"
  description: "Specific to macOS"

- name: "platform: linux"
  color: "006b75"
  description: "Specific to Linux"

- name: "platform: windows"
  color: "006b75"
  description: "Specific to Windows"

- name: "platform: aarch64"
  color: "006b75"
  description: "Specific to 64-bit ARM"

- name: "platform: x86_64"
  color: "006b75"
  description: "Specific to 64-bit x86"

- name: "platform: docker"
  color: "006b75"
  description: "Specific to running in a container"

- name: "platform: kubernetes"
  color: "006b75"
  description: "Specific to running under Kubernetes"

# ------------------------------------------------------------------ needs ----
#
# What the issue is waiting on, not what it is about. An issue keeps its
# `crate:` label for life and sheds a `needs:` one once it is answered.

- name: "needs: repro"
  color: "e99695"
  description: "Waiting on a reproduction"

- name: "needs: decision"
  color: "e99695"
  description: "Waiting on a design call before anything can be built"

- name: "needs: more-info"
  color: "e99695"
  description: "Waiting on the reporter"

# --------------------------------------------------------------- priority ----
#
# Only on an issue with no milestone, one at a time. A milestone replaces the
# label.

- name: "priority: high"
  color: "d93f0b"
  description: "Unmilestoned work to take first"

- name: "priority: medium"
  color: "fbca04"
  description: "Unmilestoned work to take when a release has room"

- name: "priority: low"
  color: "c2e0c6"
  description: "Unmilestoned work with no pressure behind it"

# ------------------------------------------------------------ unnamespaced ----
#
# `delivery-correctness` and `performance` carry the native issue type Bug.
#
# `dependencies` is the one label `dependabot.yml` requires.
#
# `release blocker` goes only on an issue with a milestone.
#
# `affects-performance` is machine-managed: `perf-label.yml` adds it when a
# pull request's counter deltas cross the advisory thresholds and removes it
# when they stop. Applying it by hand lasts until the next benched push, and
# triagers reach for `performance`.

- name: "delivery-correctness"
  color: "b60205"
  description: "Records lost, duplicated, or a watermark committed early"

- name: "performance"
  color: "0e8a16"
  description: "Throughput or latency below expectation"

- name: "affects-performance"
  color: "d93f0b"
  description: "CI measured instruction-count or heap movement past the advisory thresholds"

- name: "dependencies"
  color: "0366d6"
  description: "A dependency version bump"

- name: "release"
  color: "1d76db"
  description: "Automated release pull request"

- name: "release blocker"
  color: "b60205"
  description: "The milestone it sits in cannot release until this is fixed"
