name: CI

# No `paths:` filter: a workflow skipped by one never reports its checks, and a
# required check that never reports blocks the pull request.
on:
  push:
    branches: [main]
  # `edited` re-runs the title and changelog gates: they read the pull request
  # title and body, and a retitle after a green run would land unchecked.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

# Runs on `main` are not cancelled: they alone write the build cache every pull
# request restores from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What changed. Every unit takes these outputs as inputs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      site: ${{ steps.classify.outputs.site }}
      fuzz: ${{ steps.classify.outputs.fuzz }}
      containers: ${{ steps.classify.outputs.containers }}
      container-args: ${{ steps.classify.outputs.container-args }}
      semver: ${{ steps.classify.outputs.semver }}
      semver-pkgs: ${{ steps.classify.outputs.semver-pkgs }}
      bench: ${{ steps.classify.outputs.bench }}
      manifests: ${{ steps.classify.outputs.manifests }}
      advisories: ${{ steps.classify.outputs.advisories }}
      release-tooling: ${{ steps.classify.outputs.release-tooling }}
      macos: ${{ steps.classify.outputs.macos }}
      # A JSON array of `{package, arm, cargo_features, arch, runner}` objects, one per shard.
      bench-shards: ${{ steps.classify.outputs.bench-shards }}
      # A JSON array of `{lane}` objects: the ClickHouse lanes needing a job
      # beyond the `lts` one `containers` runs, which are those pinning a
      # different image from `lts`.
      clickhouse-lanes: ${{ steps.classify.outputs.clickhouse-lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both diff endpoints must be present as objects.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: xtask
      - id: classify
        # Event fields go through `env:`, never interpolated into a `run:` block:
        # interpolation splices attacker-controlled text into generated shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The pull request's author, not `github.actor`: the latter is whoever
          # last triggered the run and changes on a manual re-run.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # For the `manifests` and `advisories` outputs on push, where no
          # pull-request diff exists. Empty or unresolvable fails both closed.
          EVENT_BEFORE: ${{ github.event.before }}
          # The queue branch: this entry on top of the ones ahead of it. Absent
          # outside a merge group, where the arm reading them never runs.
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: cargo run -q -p spate-xtask --locked -- ci-changes

  # Tier 1: cheap, unconditional, gates the expensive tier. No `if:` on this
  # caller: a skipped job skips everything that `needs:` it. The steps carry it.
  checks:
    name: Checks
    needs: changes
    uses: ./.github/workflows/checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust }}

  # Its own unit: every tier-2 caller needs `checks`, so a missing release note
  # there would skip the whole test tier. Only `CI gate` waits on this one.
  policy:
    name: Policy
    needs: changes
    uses: ./.github/workflows/policy.yml
    with:
      advisories: ${{ needs.changes.outputs.advisories }}

  # Tier 2: gated on tier 1, scoped to what changed. The jobs inside each unit
  # carry their own `if:`.
  tests:
    name: Tests
    needs: [changes, checks]
    # `checks: write` for the JUnit publish steps. A unit can only narrow what
    # its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/tests.yml
    with:
      rust: ${{ needs.changes.outputs.rust }}
      macos: ${{ needs.changes.outputs.macos }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  containers:
    name: Containers
    needs: [changes, checks]
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/containers.yml
    with:
      containers: ${{ needs.changes.outputs.containers }}
      container-args: ${{ needs.changes.outputs.container-args }}
      clickhouse-lanes: ${{ needs.changes.outputs.clickhouse-lanes }}

  perf:
    name: Perf
    needs: [changes, checks]
    uses: ./.github/workflows/perf.yml
    with:
      bench: ${{ needs.changes.outputs.bench }}
      bench-shards: ${{ needs.changes.outputs.bench-shards }}

  release-checks:
    name: Release checks
    needs: [changes, checks]
    # `pull-requests: read` for the release rehearsal.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust }}
      semver: ${{ needs.changes.outputs.semver }}
      semver-pkgs: ${{ needs.changes.outputs.semver-pkgs }}
      manifests: ${{ needs.changes.outputs.manifests }}
      release-tooling: ${{ needs.changes.outputs.release-tooling }}

  fuzz:
    name: Fuzz
    needs: [changes, checks]
    uses: ./.github/workflows/fuzz.yml
    with:
      fuzz: ${{ needs.changes.outputs.fuzz }}

  site:
    name: Site
    needs: [changes, checks]
    uses: ./.github/workflows/site.yml
    with:
      site: ${{ needs.changes.outputs.site }}

  # The gate. This is the ONLY job that should ever be a required status check.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `!cancelled()` still runs this job when a dependency fails outright: a
    # skipped check reports as *success* to branch protection, and a genuine
    # failure must report through this gate. It skips only when the run itself
    # was cancelled, so a run superseded by a newer one for the same commit
    # leaves no lingering `failure` for branch protection to keep blocking on.
    if: ${{ !cancelled() }}
    needs: [changes, checks, policy, tests, containers, perf, release-checks, fuzz, site]
    steps:
      - name: Evaluate dependency results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # `skipped` is accepted; `cancelled` is not, since a job that exceeds
          # its own `timeout-minutes` completes `cancelled`, and every job in
          # the units these callers run carries one.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | .[].key')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs succeeded or were legitimately skipped."
