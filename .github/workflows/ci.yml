name: CI

# The trigger list is deliberately unfiltered. A workflow skipped by `on: paths:`
# never reports its checks, and a required check that never reports blocks the
# pull request forever.
on:
  push:
    branches: [main]
  # `labeled` and `edited` are in addition to the three defaults, which have to
  # be named once any `types:` is given.
  #
  # `labeled` is what makes `ci: docker`, `ci: loom` and `ci: bench` take effect
  # when applied
  # — without it a label only reaches the classifier on the next push, which is
  # too late to be useful. `unlabeled` is deliberately absent: removing a label
  # cannot switch a suite off, so re-running for it would only spend minutes to
  # reach the same verdict.
  #
  # `edited` is for the changelog gate, which reads the pull request *title*:
  # this repository squashes with the title as the commit subject, so the title
  # is the authoritative input and it can change after a green run. Retitling
  # `chore(spate-core):` to `fix(spate-core):` would otherwise land a
  # crate-scoped fix on `main` with no release note and nothing re-evaluated.
  # It costs a rerun on a description edit as well as a retitle, since the event
  # does not distinguish them; `cancel-in-progress` bounds that to one run.
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  # A merge queue entry is a separate event with its own ref; without this line
  # nothing would report and every queued merge would fail on a missing check.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  # Debug info, not code, is what fills a hosted runner's disk here: the
  # workspace links ~44 test binaries, and the `spate` end-to-end ones each pull
  # rdkafka (with vendored OpenSSL), ClickHouse and Avro into a single
  # statically linked artifact. A full-DWARF build of that set exhausted the
  # runner outright — `rustc-LLVM ERROR: IO failure on output stream: No space
  # left on device`, reproducibly (#83's PR).
  #
  # `line-tables-only` keeps exactly what CI needs — `file:line` in a
  # backtrace, which is the whole story when a failure reproduces only here —
  # and drops the type and variable records nothing in a headless run can use.
  # Measured on the spate-test slice alone: 27% off the target directory, 63%
  # off the emitted debug info. Local builds are untouched, so interactive
  # debugging keeps full DWARF; setting this in `[profile.dev]` instead would
  # degrade every contributor's machine to fix a problem only CI has.
  #
  # Both keys are needed. `cargo test` builds the test *target* under `test`
  # but its dependencies under `dev`, and the dependencies are nearly all of
  # the bytes — `test` alone measured a 6% saving. Verified not to disturb
  # coverage: `cargo llvm-cov` reports identical region and line numbers with
  # and without it, since instrumentation-based coverage reads its own
  # coverage map rather than DWARF.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Pushing again to an open PR cancels the previous run rather than letting two
# full matrices race to tell you about the same branch. Keyed per ref, and never
# cancelling on main: those runs are the only ones that write the build cache
# every PR restores from, so cancelling them would leave every PR building cold.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repo's default workflow token is read-only, so anything that writes back
# to GitHub has to ask for it explicitly. Restrictive here, widened per job.
# (Codecov's PR comment comes from its own GitHub App, not this token, so the
# coverage jobs need nothing beyond `contents: read`.)
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # What changed. Every `if:` below reads from here.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      site: ${{ steps.classify.outputs.site }}
      containers: ${{ steps.classify.outputs.containers }}
      container-args: ${{ steps.classify.outputs.container-args }}
      loom: ${{ steps.classify.outputs.loom }}
      bench: ${{ steps.classify.outputs.bench }}
      # The counter tier's matrix: a JSON array of `{package, arm,
      # cargo_features}` objects, one per shard, handed to
      # `strategy.matrix.include` through `fromJSON`. Which crates to measure,
      # not merely whether — every shard costs two builds and two valgrind
      # runs, so a change is measured against what it can move rather than
      # against everything — and under which compiled feature arms, because an
      # instruction count describes a build and a feature that swaps an
      # implementation produces a different one.
      bench-shards: ${{ steps.classify.outputs.bench-shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both diff endpoints must be present as objects. The repo is small
          # enough that full history costs nothing.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        # The SHAs go through `env:` rather than being interpolated into the
        # script. Interpolating `github.event.*` directly into a `run:` block
        # splices attacker-controlled text into generated shell — the standard
        # template-injection vector, and the reason zizmor audits for it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The pull request's author, not `github.actor` — the latter is
          # whoever last triggered the run and changes on a manual re-run.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Comma-joined, and through `env:` for the same injection reason as
          # the SHAs above — a label name is free text somebody else typed.
          # The classifier only reads `ci: docker`, `ci: loom` and `ci: bench`
          # from this, and can only ever add work on the strength of them.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/ci-changes.sh

  # ---------------------------------------------------------------------------
  # Tier 1 — cheap, always runs, gates the expensive tier.
  #
  # These jobs never carry a job-level `if:`. A job skipped by its own condition
  # also skips everything that `needs:` it, so making tier 1 conditional would
  # silently skip tier 2 as well. Where a *step* here is expensive, the step
  # carries the condition instead and the job itself always reports.
  # ---------------------------------------------------------------------------
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          shared-key: dev-allfeatures
      # Cheap and unconditional: it resolves nothing and reads only .rs files.
      - run: make fmt-check
      # `--all-targets` is doing the work of three steps: it compiles every
      # lib, bin, test, bench and example in the workspace. The two steps that
      # used to follow it — `cargo check -p spate --examples` and
      # `cargo bench --no-run --workspace` — were subsets of it, verified by
      # planting a type error in `benchmarks/src/bin/loadgen.rs` and in
      # `crates/spate/examples/`, both of which this line catches.
      #
      # `cargo bench --no-run` also built the whole dependency tree a second
      # time in the bench (release) profile, which made this the slowest job
      # in CI. It moved to the scheduled bench job, where a release build
      # already exists and the marginal cost is nil. What that loses on a PR is
      # release-only breakage — a link error, or a `cfg(not(debug_assertions))`
      # path — which is worth a night's latency, not ~6 minutes per PR.
      - if: needs.changes.outputs.rust == 'true'
        run: make clippy

  workflows:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Static analysis of these workflow files themselves. It exists to stop the
    # hardening in this repo from rotting: every action pinned to a SHA,
    # `persist-credentials: false` on every checkout, and an explicit
    # `permissions:` block per workflow. Each of those is a one-line omission
    # away from being silently undone by the next workflow edit, and none of
    # them fails any other job when it regresses.
    #
    # Never given a path filter, and never allowed to become conditional. What
    # it guards against is a pull request that edits `.github/**` — so gating it
    # on `.github/**` having changed is circular, and gating it on anything else
    # is simply wrong.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          # Version-pinned, not just action-pinned. What this job actually
          # guarantees rests on zizmor's *default* audit policy — `unpinned-uses`
          # rejecting anything that is not a hash is a default, not something we
          # configure. A future release relaxing that would quietly weaken the
          # gate with nothing here to signal it.
          #
          # shellcheck covers what zizmor does not: zizmor reads workflow
          # semantics, not the shell inside a `run:` block, and the changed-path
          # classifier is a real script with real quoting to get wrong.
          tool: zizmor@1.28.0,shellcheck@0.11.0
      # `--persona=regular` is the default; naming it makes the escalation
      # explicit if someone later wants `--persona=pedantic`. Findings are
      # errors, not advisories — a red job is the whole point.
      #
      # GH_TOKEN is load-bearing, not decoration. Without a token zizmor runs
      # offline and *silently skips* the audits that need the API — including
      # `known-vulnerable-actions`, which is the one that matters most here:
      # pinning to a SHA is precisely what stops us picking up an upstream
      # security fix automatically, so the compensating control is a check that
      # the pinned versions are not themselves known-bad. Offline it reports
      # "No findings" and exits 0 even against a known-compromised action.
      #
      # Scanning all of `.github/`, not just `workflows/`: zizmor also audits
      # the Dependabot config and the composite action.
      - run: make zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make shellcheck

      # The repository's own metadata has to stay self-consistent, and both of
      # these check a class of drift nothing else would notice: a label
      # referenced by an issue form or by Dependabot that does not exist (GitHub
      # drops it silently), and the invariant lists in AGENTS.md, CONTRIBUTING.md
      # and the pull request template falling out of step with docs/DESIGN.md.
      # Both are pure file reads — no network, no toolchain.
      - run: make check-labels
      - run: make check-invariants

      # The report script and perf-label.yml share a one-file contract that
      # no pull request can execute end to end — the label workflow runs the
      # default branch's definition — so the write side runs here: the flag
      # file must be the bare boolean the label workflow's parse accepts.
      - run: make check-perf-report

      # Without this the manifest check only ever runs on a developer machine,
      # and the mistake it exists to catch — a bench with no `harness = false`
      # stanza — reaches CI as a confusing runtime error about arguments in the
      # perf job, which is exactly what the script's own comment says it
      # prevents. `ci-lint` aggregates these for local use; CI runs them one by
      # one, so a new check has to be added in both places.
      - run: make check-gungraun-benches

      # The degenerate-region guard's own rule only executes where valgrind
      # does, which is one job of one tier on some pull requests. Its fixtures
      # are real profiles and need neither, so they run here on every pull
      # request — otherwise the guard could stop recognising either shape and
      # nothing would say so until the next benched change.
      - run: make check-collected-region

      # The bar on publishing a record measured somewhere it should not be
      # quoted from. It has to run here or it is not a bar at all: a pull
      # request adding a record from a hosted runner would otherwise merge
      # green, and the rule would hold only for whoever remembered to run
      # `make gates` first — which is the state this check exists to replace.
      - run: make check-results

      # The A/B comparator's fixtures. Its worst failure is a well-formed table
      # off a comparison that paired the wrong records — an answer that looks
      # right and is not — so what holds it to its word is a self-test asserting
      # each wrong answer, and that has to run somewhere a change cannot skip.
      - run: make check-bench-compare

      # The A/B driver's fixture. `ci-lint` aggregates these for local use but
      # CI runs each as its own step, so a check added to that list and not to
      # this one is not a gate at all.
      - run: make check-bench-drive

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never path-filtered, and never moved to the scheduled tier. Its inputs are
    # the lockfile, deny.toml *and the RustSec advisory database*, which changes
    # with no file in this repo changing — so any filter keyed on paths is
    # wrong by construction. A pull request that pulls in a crate with an
    # existing advisory has to be stopped before it merges, not reported the
    # next morning. The scheduled `check advisories` run exists *in addition*
    # to this, for the case where the world moves under a static tree.
    steps:
      # cargo-deny *gates* (fails on a licence we will not accept). cargo-about
      # *attributes* (reproduces what we ship, for our users' own compliance),
      # and it runs in the nightly tier and at release rather than here — see
      # the note on that job in scheduled.yml. THIRD-PARTY.md is derived from
      # the same lockfile this job already checks, so a diff gate over it adds
      # nothing to the licence verdict and fails on every dependency bump,
      # which is precisely where its diff is a column of version numbers.
      #
      # Not cargo-deny-action. That action builds its container on the runner
      # from a Dockerfile that pipes an unverified release tarball straight into
      # /usr/bin — a substituted asset would get root in the job that reports
      # our security verdict. install-action resolves the version from a
      # manifest baked into the pinned action SHA and enforces a SHA-256.
      #
      # cargo-deny is version-pinned for the same reason zizmor is: this is the
      # job that reports the security verdict, and a release that changed a
      # default would move the gate with nothing here to signal it.
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny@0.20.2
          # No cache: this job compiles nothing, so an entry here would only
          # consume the repo's 10 GB budget and evict one that earns its place.

      # `--locked` matters as much here as anywhere: the action's default
      # arguments omit it, so the gate used to resolve its own graph and could
      # pass or fail on dependencies we do not ship — a different tree from the
      # one every other job just built, and from the one THIRD-PARTY.md below
      # is generated against.
      - run: make deny

      # The container-suite selection in ci-changes.sh is a reverse-dependency
      # closure written by hand. This asserts it still matches the real graph,
      # so a new crate or a new edge cannot silently narrow what CI runs.
      # `--no-deps` reads manifests only; it resolves nothing.
      - run: make self-test

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job of its own, and nothing `needs:` it.
    #
    # It could have been a step in `workflows`, which is where the other
    # repository-metadata checks live — but every tier-2 job `needs:` that one,
    # so a missing release note would skip the whole test matrix, and somebody
    # who forgot one sentence would learn nothing else about their branch. The
    # least important gate here would become the most blocking one. On its own
    # it blocks the *merge*, through ci-gate, without blocking the *feedback*.
    #
    # No job-level `if:`, per the tier-1 rule above. The script decides what it
    # can prove from the event it was handed: on `push` and `merge_group` there
    # is no pull request title and `main` cannot be rewritten anyway, so it
    # checks the directory's structure, says so, and passes. It always reports,
    # which is what keeps ci-gate seeing a real result rather than a skip.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The second full-history checkout in this workflow, and the reason
          # this is a job rather than a step somewhere cheaper: both ends of the
          # diff have to be present as objects, and no other checkout here has
          # them.
          fetch-depth: 0
          persist-credentials: false

      - env:
          # Through `env:`, never interpolated into the `run:` block. A pull
          # request title and body are the most attacker-controlled strings in
          # this workflow — free text somebody else typed, straight off the
          # event — and splicing them into generated shell is the
          # template-injection vector zizmor audits for.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make check-changelog

  # ---------------------------------------------------------------------------
  # Tier 2 — gated on tier 1, and scoped to what changed.
  #
  # `needs` is [changes, lint, workflows] and deliberately not `deny`: a
  # formatting or lint error should stop the expensive fan-out, but the licence
  # and attribution gate is independent of whether the code compiles, and
  # putting its ~2 minutes on the critical path would tax every green PR.
  # ---------------------------------------------------------------------------
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # `checks: write` is what lets the JUnit step publish its check run. Without
    # it the step fails outright — the repo default is read-only.
    permissions:
      contents: read
      checks: write
    env:
      # Coverage builds a second full target tree (`target/llvm-cov-target`)
      # alongside the cached one, and at the default `debuginfo=2` that filled
      # the runner's disk — the linker died with SIGBUS mid-link, which reads
      # as a compile failure but is the filesystem running out from under it.
      # llvm-cov maps regions from the `__llvm_covmap` section, not DWARF, so
      # line tables are all it needs.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The `secrets` context is not available in a step-level `if:`, so the
      # presence of the token has to be lifted into the environment here. See
      # the upload step for why that matters.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      # Reclaims ~25GB of preinstalled SDKs. Cheap next to re-running a build
      # that dies at link time.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          tools: nextest@0.9.140,cargo-llvm-cov@0.8.7
          # Its own key: cargo-llvm-cov builds into `target/llvm-cov-target`,
          # a different tree from the plain `target/debug` that lint, features
          # and doctests share. Pointing both at one entry would have them
          # overwrite each other's cache on every run.
          shared-key: coverage

      # One instrumented run, not two runs of the same suite. This job used to
      # be two — `test` under plain nextest and `coverage` under llvm-cov —
      # executing an identical `--profile ci --workspace --all-features` suite
      # twice per pull request. That is one full compile and one full execution
      # saved; the doctest job alongside is a genuinely separate compile and is
      # not something merging these two removed.
      # `cargo llvm-cov nextest` still writes target/nextest/ci/junit.xml, so
      # the check annotation below survives the merge.
      #
      # Docker-free, deliberately. The worry was that leaving the container
      # suites out would make the connector crates under-report and push
      # contributors toward shallow unit tests to clear the patch target. It
      # was measured instead of assumed, and it does not hold: docker-free the
      # workspace is at 87.6% line coverage, with spate-s3 at 92.2% and
      # spate-kafka at 91.5% — their mock-cluster and in-memory-store tests
      # already carry it.
      #
      # Test scaffolding is excluded from the denominator so the number
      # reflects shipped code. Note `--all-features` turns on
      # spate-coordination's `testing` feature, so `TestClock` is counted as
      # library code; it is exercised hard by the suites that drive it, so it
      # inflates the number slightly rather than hiding anything.
      - name: Test and coverage
        run: >
          cargo llvm-cov nextest --profile ci --workspace --all-features --locked
          --lcov --output-path lcov.info
          --ignore-filename-regex '(/tests/|/benchmarks/)'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        # Skipped whenever the token is absent rather than whenever the pull
        # request is from a fork. Those are not the same condition, and the
        # difference is not theoretical: **Dependabot** runs resolve `secrets.*`
        # from a separate Dependabot store, so `CODECOV_TOKEN` is empty on a bot
        # pull request whose branch is in-repo — a fork check waves it through
        # and `fail_ci_if_error` then sinks the job. That mattered less when
        # coverage was its own job; now this job also carries the test signal,
        # so a failed upload would bury a green suite.
        #
        # Skipping is the only safe fix. Moving the upload to
        # `pull_request_target` or a `workflow_run` would hand a secret to a job
        # that has already executed the pull request's code.
        if: env.HAS_CODECOV_TOKEN == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Two different questions, deliberately answered differently:
          # *did the data arrive* is loud, because a silently failed upload
          # leaves the coverage check permanently absent and nobody notices
          # — the same dead-artifact failure this job used to have. *Is the
          # number good enough* is informational for now, and that lives in
          # codecov.yml's `informational: true`.
          fail_ci_if_error: true
          flags: unit

      # The `ci` profile retries once, so a flake passes on the retry and the
      # run goes green. Publishing the JUnit report is what keeps that flake
      # visible — it lands as a check annotation instead of living only in
      # scrolled-past log text. `always()` so a failing run still reports.
      - name: Publish test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          # The job's own exit code already failed the build; this step
          # exists to annotate, not to re-decide.
          fail_on_failure: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-nextest
          path: target/nextest/ci/junit.xml

  doctests:
    name: Doc tests
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # A separate job, not a second step in `test`, and this is not a style
    # choice. nextest does not run doctests, so they stay on the built-in
    # harness — but `cargo llvm-cov` builds into `target/llvm-cov-target` while
    # `cargo test --doc` builds into `target/debug`. They are two different
    # target directories, so the doctest run compiles the workspace from
    # scratch no matter how carefully the flags are matched. (An earlier comment
    # here claimed the pairing was free provided the flags agreed. Measured on a
    # clean target directory: 148 units for the instrumented run, then 148 units
    # again for the doctests.)
    #
    # Running them in the same job would put two full compiles and a full suite
    # in series under one timeout. As a separate job they run concurrently, and
    # this one restores the same `dev-allfeatures` cache that lint and features
    # populate, so it starts from warm dependencies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev-allfeatures
      - run: make doctest

  features:
    name: Feature matrix (each feature)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    # Linear, not the powerset. The `spate` facade declares 18 feature keys, so a
    # full powerset is 2^18 combinations and several of them build librdkafka
    # or compile OpenSSL from source — it ran ~48 minutes, on every PR, which
    # is not what that signal is worth.
    #
    # `--each-feature` is n+2 checks instead of 2^n and still catches the
    # common break: a feature that does not compile on its own, or a crate
    # that only builds because something else in the graph enabled a
    # dependency for it. The exhaustive powerset moved to the weekly run, where
    # 48 minutes is free.
    #
    # `full` is excluded because it is a superset alias — `--all-features` in
    # the lint and test jobs already covers that shape.
    #
    # This is the one dependency-resolving cargo call in the workflow that
    # deliberately omits `--locked`. `--no-dev-deps` rewrites each Cargo.toml
    # while cargo-hack runs, which makes the lockfile need an update, and
    # `--locked` then fails the run outright ("cannot update the lock file ...
    # because --locked was passed"). Verified, not assumed. Nothing is lost:
    # `lint`, `test`, `deny` and `msrv` all run `--locked` against the same
    # commit, so lockfile drift is already caught — this job only answers
    # "does each feature compile alone".
    #
    # (`cargo fmt` is the other bare call, and it resolves nothing.)
    #
    # `make check-features` also runs two feature-*off* checks that this job did
    # not, and that no other job can: with `--all-features` on, a crate that
    # fails to compile *without* one of them still passes everywhere else.
    # `spate-coordination` without its default features, and the `spate` facade
    # with `s3` but no coordination backend — the second is what proves the
    # facade never links async-nats when nothing asked for it. Two cargo checks
    # against an already-warm cache; the gap they close was a documented one.
    timeout-minutes: 30
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-hack@0.6.45
          shared-key: dev-allfeatures
      - run: make check-features

  alloc-assertions:
    name: Allocation assertions (spate-core)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # `chain_alloc` is a hard assertion, not a measurement: a counting global
    # allocator with absolute per-iteration bounds, so a per-record allocation
    # on the chain hot path fails it outright. That makes it a gate, and a gate
    # belongs on the path that stops a change entering `main` rather than on a
    # timer that reports the morning after the merge.
    #
    # The constraint it carries is a release build — the bounds are calibrated
    # against optimised code, and a debug build allocates differently enough
    # that they say nothing. `shared-key: release` is what makes that
    # affordable: the same cache entry the scheduled release-profile jobs
    # populate from `main` and that `perf-counters` below shares for its
    # bench profile, so this restores warm instead of compiling the
    # dependency graph into a tree of its own.
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release
      - run: cargo test -p spate-core --release --test chain_alloc --locked

  # ---------------------------------------------------------------------------
  # The instruction-count tier: a warming job, a shard per (package, feature
  # arm), and one job that renders the shards' output as a single report.
  #
  # The split into shards is forced by where gungraun writes. Its runner puts a
  # summary at
  #
  #   target/gungraun/<CARGO_PKG_NAME>/<bench-stem>/<group>/<fn>/<case>/summary.json
  #
  # and there is no feature component anywhere in that path — `GUNGRAUN_SAVE_BASELINE`
  # changes filenames *within* the directory, not the directory. So two feature
  # builds of one bench in one workspace overwrite each other's summary and each
  # other's saved baseline, with nothing to signal it: a wrong number, silently.
  # A job per arm is what gives each arm its own runner and its own target tree,
  # and it is the only reason the axis is safe to have at all.
  # ---------------------------------------------------------------------------
  perf-warm:
    name: Warm the counter-tier build cache
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # `main` only, because `main` is the only ref rust-cache is allowed to
    # write from (see setup-rust) — on a pull request this job would compile
    # for nothing and hand nothing on.
    #
    # What it buys, and why it is load-bearing rather than a nicety: the shards
    # below each build the merge base and the head from whatever the shared
    # cache holds. A matrix multiplies a cold dependency compile by the shard
    # count instead of dividing it, so without a warm entry this shape is
    # slower than the serial job it replaces. The `bench` entry exists so that
    # one job on `main` pays that compile once, for every arm, and every shard
    # afterwards restores it.
    if: github.event_name == 'push' && needs.changes.outputs.bench == 'true'
    timeout-minutes: 45
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Its own entry, not the `release` one `alloc-assertions` uses. The
          # bench profile inherits release, but the graph does not: these
          # builds pull each benched crate's dev-dependencies and the gungraun
          # harness, which no other release-profile job compiles. Sharing a key
          # with a narrower job means whichever finishes first defines the
          # entry, and the narrow one always finishes first — which left the
          # shards compiling the bench graph from scratch anyway.
          shared-key: bench
      - name: Build every bench arm
        env:
          # Through `env:` rather than interpolated into the script body — an
          # expression spliced into generated shell is a template-injection
          # finding even when its value is classifier-derived.
          BENCH_SHARDS: ${{ needs.changes.outputs.bench-shards }}
        # `--check` builds without running, which is all a cache needs and
        # skips valgrind entirely. One invocation per arm, filtered to the one
        # package that arm belongs to: handing `--features simd` to a package
        # with no such feature is a hard cargo error, not a no-op.
        run: |
          set -euo pipefail
          # Materialised and counted rather than streamed straight into the
          # loop. A `while read` fed by a process substitution whose producer
          # died iterates zero times and reports success, so a broken shard
          # list would leave this job green having warmed nothing — the exact
          # silent no-op the tier cannot afford, since nothing downstream can
          # tell a warmed cache from a cold one.
          jq -r '.[] | [.package, .cargo_features] | @tsv' <<<"$BENCH_SHARDS" >arms.tsv
          arms=$(grep -c '' arms.tsv)
          if [[ "$arms" -eq 0 ]]; then
            echo "::error::the bench matrix is empty; there is nothing to warm"
            exit 1
          fi
          echo "warming $arms arm(s)"
          built=0
          while IFS=$'\t' read -r package cargo_features; do
            [[ -n "$package" ]] || continue
            ./scripts/gungraun-benches.sh --features "$cargo_features" --check "$package"
            built=$((built + 1))
          done <arms.tsv
          if [[ "$built" -ne "$arms" ]]; then
            echo "::error::warmed $built of $arms arm(s)"
            exit 1
          fi

  perf-counters:
    name: Instruction counts (${{ matrix.package }} / ${{ matrix.arm }})
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # The second clause is the documented shape of a dynamic matrix, not
    # belt-and-braces on the first: a matrix that expands to zero jobs is a
    # workflow-level error rather than a skipped job, and a false `if:` is what
    # stops the expansion being attempted. The classifier keeps the two answers
    # consistent, so this can only ever agree with `bench` — which is the point.
    if: needs.changes.outputs.bench == 'true' && needs.changes.outputs.bench-shards != '[]'
    timeout-minutes: 45
    strategy:
      # One shard's bench dying must not cancel its siblings. `ci-gate` counts
      # `cancelled` as failure, so fail-fast would turn one real failure into
      # several, all but one of them unattributable — and it would throw away
      # the measurements of every arm that was fine.
      fail-fast: false
      matrix:
        # `include:` on its own runs one job per object. The classifier
        # guarantees a non-empty array whenever `bench` is true; an empty one
        # is a workflow-level error rather than a skipped job, which is why the
        # two outputs are kept consistent there rather than here.
        include: ${{ fromJSON(needs.changes.outputs.bench-shards) }}
    # Counters, not clocks. A hosted runner is contended and virtualised, so a
    # wall-clock number measured here describes the machine at least as much as
    # the change — which is why no wall-clock figure gates anything in this
    # repository. An instruction count under callgrind is deterministic: the
    # same commit on the same toolchain yields the same number on any host, so
    # it is a performance signal a pull request can actually carry.
    #
    # The comparison is a paired measurement inside one shard: the merge base
    # is measured first and saved as a named baseline, then the head run
    # compares against it. The comparator is therefore always the merge base
    # rather than whatever a cache last held — at the cost of building and
    # running the benches twice, a few minutes on an advisory job.
    #
    # Advisory in what it reports, blocking in whether it ran. The rendering
    # step in `perf-report` below carries `continue-on-error: true`, so a count
    # that moved does not block a merge; this job stays in `ci-gate`'s
    # `needs:`, so a bench that no longer builds or dies under valgrind does.
    # Keeping the job out of the gate entirely would have hidden the second
    # case along with the first.
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read. Full history, because the merge base has
      # to be resolvable and checked out for the baseline measurement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: bench
          # A pure consumer of the entry `perf-warm` owns. Several shards
          # sharing a key would race to write it the first time it is missing,
          # and the winner would be whichever arm compiled the least.
          cache-save: never

      # callgrind is the instrument; gungraun only drives it and reads its
      # output. Without valgrind on the runner the harness fails at the first
      # bench with no measurement taken.
      #
      # Its version is recorded because it is part of the measurement: valgrind
      # emulates CPUID, so which SIMD width a bench executes is decided by the
      # runner image rather than by the code. A runner-image bump can therefore
      # move a count with nothing in this repository changing, and the log line
      # is what makes that explicable after the fact.
      - name: Install valgrind
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      # The runner version must match the `gungraun` dependency exactly — the
      # harness refuses to run against a mismatched runner — so it is read from
      # the locked workspace resolution rather than hardcoded: `--locked`
      # reports what Cargo.lock pins and refuses to re-resolve, a dependency
      # bump carries the runner with it, and there is no second copy of the
      # version to drift. It is read in a step of its own because it is also
      # the cache key below, which therefore moves only when a reviewed bump
      # moves it.
      - name: Resolve the gungraun-runner version
        id: runner-version
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "gungraun") | .version')
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Building the runner from source costs about a minute of every job that
      # needs it, and it is the same binary every time for a given version —
      # `install-action` carries no manifest entry for it, so there is no
      # checksummed prebuilt to fetch instead. Cached under its own root
      # rather than `~/.cargo/bin` so the key covers exactly this binary and
      # nothing else the toolchain cache already handles. The key names no
      # shard, so the matrix shares one entry rather than one each.
      - name: Cache gungraun-runner
        id: runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gungraun/bin
          key: gungraun-runner-${{ runner.os }}-${{ steps.runner-version.outputs.version }}

      # A mismatched runner is a hard error rather than a wrong measurement,
      # so the version is pinned on both the install and the cache key: a
      # restored binary can only ever be the one this lockfile asks for.
      - name: Install gungraun-runner
        if: steps.runner-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.runner-version.outputs.version }}
        run: |
          set -euo pipefail
          cargo install gungraun-runner --version "$VERSION" --locked --root ~/.gungraun

      - name: Put gungraun-runner on PATH
        run: echo "$HOME/.gungraun/bin" >>"$GITHUB_PATH"

      # The baseline: check out the merge base, measure it, come back. The
      # benches are discovered from the merge-base tree itself, by the
      # merge base's own copy of `scripts/gungraun-benches.sh` — the same
      # script `make bench-gungraun` and the head leg below run, so the two
      # sides of the comparison cannot disagree about what to measure. The
      # discovery also handles the merge base that predates a bench: it
      # simply contributes no baseline for it.
      #
      # Running the merge base's own copy is what makes the feature arm a
      # question rather than an assumption. That copy may predate the axis
      # entirely, in which case it ignores `--features` and measures the
      # default arm — so a `simd` head would be compared against a
      # `serde_json` base and the difference rendered as a delta. Measured on a
      # throwaway probe, that mismatch reads as +11.78%, over the advisory
      # threshold, and would have set the regression flag and pushed the
      # performance label on nothing but arm mismatch.
      #
      # Hence the probe. `--features X --run <no such package>` matches no
      # package, so a copy that understands the axis answers with the
      # empty-selection exit 2 without invoking cargo, while one that does not
      # falls through to its `unknown argument` arm and answers 1. An arm whose
      # merge base cannot build that same arm has no baseline, by
      # construction — the shard reports one rather than comparing across arms.
      #
      # The default arm skips the probe, and that is the point of the rule
      # rather than an exception to it: it asks the merge base for no feature
      # flag at all, which is what every copy of the script has always done, so
      # the two legs build the same thing whatever the merge base knows. Probing
      # it would discard a perfectly good baseline for every pull request whose
      # merge base predates the axis.
      #
      # A merge base predating the script itself reports no baseline rather
      # than failing, which is the same degradation as a merge base that no
      # longer builds, and it self-heals once the script is on `main`.
      #
      # `continue-on-error`, and bench failures are caught inside the script,
      # because this leg builds historical code with today's toolchain: its
      # failure says nothing about the change under review, and the head run
      # below still reports absolute counts. A partial measurement is wiped
      # rather than kept, so the comparison is all-or-nothing.
      #
      # Only a pull request has a merge base to compare against; a push or
      # merge-group run reports absolute counts instead.
      - name: Measure the merge base
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # Through `env:` rather than `${{ }}` inside `run:` — an expression
          # interpolated into the script body is a template-injection finding
          # even when its value is classifier-derived.
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base HEAD^1 HEAD^2)
          git checkout --quiet --detach "$merge_base"
          # Never inherit counter output the shared cargo cache may have
          # restored: stale data here would silently become the comparison.
          rm -rf target/gungraun
          measured=false
          if [[ ! -x scripts/gungraun-benches.sh ]]; then
            # Says which cause, because they are otherwise indistinguishable:
            # a merge base predating the script, a lost exec bit, a bench that
            # failed, and a tree with no benches all end as `measured=false`,
            # and a commit that dropped `+x` would disable every baseline
            # permanently while CI stayed green.
            echo "no baseline: scripts/gungraun-benches.sh is absent or not executable at the merge base"
          else
            # The default arm asks the merge base for no feature flag at all,
            # which is precisely what every copy of the script has always done
            # — so it is comparable against a merge base that predates the
            # feature axis, and probing it would throw away a baseline that is
            # perfectly good. Only a *non-default* arm needs the capability
            # question, because only it can be answered with the wrong build.
            args=()
            probe=2
            if [[ -n "$CARGO_FEATURES" ]]; then
              args=(--features "$CARGO_FEATURES")
              set +e
              ./scripts/gungraun-benches.sh "${args[@]}" \
                --run __no_such_package__ >/dev/null 2>&1
              probe=$?
              set -e
            fi
            if [[ "$probe" -ne 2 ]]; then
              echo "no baseline: the merge base's scripts/gungraun-benches.sh does not take --features (probe exit $probe)."
              echo "It would build the default arm while this shard builds '$ARM', and two arms are not comparable."
            else
              # Exit 0 means every discovered bench ran and succeeded; 1 means
              # one failed; 2 means this tree has no benches yet. Only the
              # first is a usable baseline, and a partial measurement is wiped
              # rather than kept, so the comparison is all-or-nothing.
              set +e
              GUNGRAUN_SAVE_BASELINE=base ./scripts/gungraun-benches.sh \
                ${args[@]+"${args[@]}"} --run "$PACKAGE"
              rc=$?
              set -e
              case "$rc" in
                0) measured=true ;;
                2) echo "no baseline: the merge base has no bench for $PACKAGE" ;;
                *) echo "no baseline: a bench failed on the merge base (exit $rc)" ;;
              esac
              [[ "$measured" == "true" ]] || rm -rf target/gungraun
            fi
          fi
          git checkout --quiet --detach "$head_sha"
          {
            echo "measured=$measured"
            echo "merge-base=$merge_base"
          } >>"$GITHUB_OUTPUT"

      # This step is allowed to fail the job, and that is the whole
      # distinction: the numbers are advisory, a broken bench is not.
      #
      # `GUNGRAUN_BASELINE` makes the run compare against the merge-base
      # measurement saved above; `GUNGRAUN_SAVE_SUMMARY` writes one
      # machine-readable summary per bench under `target/gungraun`, which is
      # what the stamping step collects — the human-readable output stays in
      # this step's log.
      - name: Instruction counts
        env:
          GUNGRAUN_SAVE_SUMMARY: json
          GUNGRAUN_BASELINE: ${{ steps.base.outputs.measured == 'true' && 'base' || '' }}
          PACKAGE: ${{ matrix.package }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          if [[ -z "$GUNGRAUN_BASELINE" ]]; then
            unset GUNGRAUN_BASELINE
            # Absolute means absolute: without a named baseline, gungraun
            # would still compare against whatever output a restored cache or
            # an aborted base leg left behind here.
            rm -rf target/gungraun
          fi
          # The same package and the same arm the base leg measured. `make
          # bench-gungraun` runs every bench in the tree and stays the local
          # convenience; CI measures only what the change can move.
          ./scripts/gungraun-benches.sh --features "$CARGO_FEATURES" --run "$PACKAGE"

      # A bench can report a plausible number while measuring nothing: the
      # collected region is bounded by a callgrind toggle, and work the
      # optimiser leaves in an unstable shape can fall outside it, leaving
      # glibc's free path counted in its place. Every other signal stays green
      # through that — the bench builds, runs, exits 0, and renders a row.
      #
      # This step gates, and it belongs on the same side of the line as a
      # bench that no longer builds rather than with the numbers. A count that
      # moved is advisory because the reader can judge it; a region that
      # measured the allocator is not a moved number, it is a broken bench,
      # and its number would become a baseline every later comparison
      # inherits. So no `continue-on-error` here, deliberately.
      #
      # The head leg only. The merge-base leg is scaffolding — it already
      # carries `continue-on-error` and reports no baseline rather than
      # failing — and a degenerate bench in code the author did not write is
      # not theirs to fix.
      - name: Reject a degenerate collected region
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
        run: ./scripts/gungraun-collected-region.sh --shard "$PACKAGE ($ARM)"

      # Row identity is stamped, not derived. A gungraun summary describes a
      # bench, not the build that produced it: the package survives only as a
      # directory path on the machine that measured it, and the schema has no
      # notion of cargo features at all. So when one run is split over a matrix,
      # the identity that tells two of its rows apart does not exist in the data
      # and has to be put there. `scripts/gungraun-report.sh` documents the
      # `spate_shard` object it reads; this is the other half of that contract.
      #
      # `baseline` is the empty string when this shard measured none — the
      # signal the report renders as *no baseline* rather than as *new*. One
      # shard's merge-base leg can fail while another's succeeds, and a
      # genuinely new bench must not read like a leg that died.
      #
      # Not `continue-on-error`: a shard that ran its benches and produced no
      # summary has measured nothing, and a report silently missing an arm is
      # the failure this whole arrangement exists to prevent.
      - name: Stamp this shard's summaries
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
          BASE_MEASURED: ${{ steps.base.outputs.measured }}
          MERGE_BASE: ${{ steps.base.outputs.merge-base }}
        run: |
          set -euo pipefail
          if [[ ! -d target/gungraun ]]; then
            echo "::error::$PACKAGE ($ARM) ran its benches but wrote no target/gungraun"
            exit 1
          fi
          find target/gungraun -name summary.json -exec cat {} + >raw.jsonl
          if [[ ! -s raw.jsonl ]]; then
            echo "::error::$PACKAGE ($ARM) wrote no summary.json; GUNGRAUN_SAVE_SUMMARY may no longer be honoured"
            exit 1
          fi
          if [[ "$BASE_MEASURED" == "true" ]]; then
            baseline="main @ ${MERGE_BASE:0:12}"
          else
            baseline=""
          fi
          mkdir -p shard
          jq -c --arg p "$PACKAGE" --arg a "$ARM" --arg b "$baseline" \
            '. + {spate_shard: {package: $p, features: $a, baseline: $b}}' \
            raw.jsonl >"shard/$PACKAGE.$ARM.jsonl"

      # One artifact per shard, concatenated by `perf-report` below. Named for
      # the shard, because two artifacts cannot share a name within a run —
      # the arm labels are constrained to `[A-Za-z0-9_.,-]` by the
      # classifier's self-test, which is what keeps a label out of the set of
      # characters GitHub refuses here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-summaries-${{ matrix.package }}-${{ matrix.arm }}
          path: shard/
          if-no-files-found: error

  perf-report:
    name: Instruction count report
    runs-on: ubuntu-latest
    needs: [changes, perf-counters]
    # `!cancelled()` rather than `always()`: a shard that failed still leaves
    # its siblings' measurements worth rendering, and the failure is already
    # `ci-gate`'s business through `perf-counters`. A cancelled run has nothing
    # to say.
    if: ${{ !cancelled() && needs.changes.outputs.bench == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every shard's stamped summaries, each under its own directory, so two
      # shards' identically named files cannot overwrite each other on the way
      # in. Concatenation is the only merge the report needs: it sorts its rows
      # by shard and bench, so the order artifacts arrive in is not an order.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-summaries-*
          path: shards

      # The report script marks rows that cross the provisional advisory
      # thresholds and writes `has_regressions` for `perf-label.yml`; the
      # script itself always exits 0 on a metric moving, so nothing here can
      # turn the numbers into a gate. The thresholds live in the script.
      #
      # `continue-on-error` belongs on this step and nowhere else. On the job
      # it would also excuse the checkout and the download.
      #
      # The baseline label passed here is a fallback for a summary carrying no
      # `spate_shard` stamp, which a shard of this matrix never produces —
      # every row names its own baseline, including the shards that measured
      # none.
      - name: Report instruction counts
        id: report
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p shards
          find shards -name '*.jsonl' -exec cat {} + >gungraun-summaries.jsonl
          mkdir -p perf-regressions
          ./scripts/gungraun-report.sh \
            --regressions-out perf-regressions/has_regressions \
            gungraun-summaries.jsonl "baseline" >>"$GITHUB_STEP_SUMMARY"

      # The one output that crosses into `perf-label.yml`: a boolean, under the
      # artifact name and file name that workflow reads. It moved job, which
      # that workflow cannot observe — it downloads by name from the triggering
      # *run* — so the contract is unchanged and the label half needs no edit.
      # The report markdown deliberately stays in the step summary; nothing
      # fork-authored is ever re-posted by a privileged workflow. Gated on the
      # report step's *outcome* because that step is `continue-on-error`: a
      # report that died must not hand over a stale or half-written flag.
      - name: Upload the regression flag
        if: github.event_name == 'pull_request' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-regressions
          path: perf-regressions/has_regressions

  loom:
    name: Loom models (opt-in)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # Opt-in only, via the `ci: loom` label. The models run nightly regardless
    # (see scheduled.yml); this exists for the case where you have just changed
    # something under INV-3 and want the answer before merge rather than in the
    # morning. Skipping is a legitimate outcome and the gate treats it as one.
    if: needs.changes.outputs.loom == 'true'
    timeout-minutes: 60
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # `--cfg loom` rebuilds the world against loom-typed primitives, so
          # this shares nothing with any other job and needs its own cache. Same
          # key as the scheduled job, so whichever runs first warms the other.
          shared-key: loom
      - run: make loom

  msrv:
    name: Check (MSRV 1.94)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.94"
          # A different toolchain is a different set of build artifacts, so this
          # gets its own cache rather than thrashing the stable one.
          shared-key: msrv
      # `--locked` matters most here. Without it this job is free to resolve a
      # *different*, older graph than the one we ship, and would then pass while
      # the committed Cargo.lock needs a toolchain newer than 1.94. With it, the
      # job answers the question it claims to: does the dependency set we
      # actually ship build on the MSRV?
      - run: make check

  containers:
    name: Container suites
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.containers == 'true'
    timeout-minutes: 60
    # `checks: write` for the JUnit report below. Without it the publish step
    # logs `Resource not accessible by integration` and carries on, so the job
    # stays green while the annotation it exists to create is never made.
    permissions:
      contents: read
      checks: write
    steps:
      # Checkout precedes setup-rust because a `uses: ./...` action is resolved
      # from the workspace on disk — the tree has to exist before the composite
      # action inside it can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: nextest@0.9.140
          # The docker suites are `#[ignore]`d, so this builds test binaries the
          # `test` job never links. Separate key, or the two evict each other.
          shared-key: docker
      # Scoped by reverse-dependency closure over the crate graph: a change
      # confined to crates/spate-s3 runs `-p spate-s3` and `-p spate`, while a change
      # to spate-core — which everything depends on — runs all five. On push and
      # merge_group, ci-changes.sh forces the full set.
      #
      # Note the closure answers "can this break it", not "does this exercise
      # it". The facade's own e2e suite drives Kafka and ClickHouse, so an
      # spate-s3 change still boots those through `-p spate` even though no facade
      # test touches S3. That is the cost of a table cargo can verify.
      #
      # Serial: a hosted runner is 2 cores / ~7 GB and these span SeaweedFS,
      # NATS, Kafka and ClickHouse. Concurrency risks an OOM that would read
      # as a flake.
      #
      # The `docker` profile warns late and never terminates: these boot real
      # containers, so a cold image pull can outlast any per-test kill, and a
      # SIGKILL would report TIMEOUT indistinguishably from a real hang. The
      # job's `timeout-minutes` is the real bound.
      - name: Container suites
        env:
          PKGS: ${{ needs.changes.outputs.container-args }}
        # Read into an array and expand it, rather than letting an unquoted
        # variable word-split. The package list is a closure result, not
        # arbitrary input, but "this happens to split correctly" is a property
        # that breaks silently; `read -ra` says what is meant.
        run: |
          read -ra pkgs <<< "$PKGS"
          cargo nextest run --profile docker "${pkgs[@]}" --all-features --locked \
            --run-ignored ignored-only --test-threads 1

      # `[profile.docker.junit]` writes this report; publishing it is what puts
      # a container failure somewhere other than scrolled-past log text. These
      # suites are the least reproducible after the fact, so they are the ones
      # that most need the annotation — and unlike the fast suite they do not
      # retry, so nothing else would surface a failure twice. Distinct
      # `check_name` and artifact name; the `test` job publishes its own.
      - name: Publish container test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: target/nextest/docker/junit.xml
          check_name: Container test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          # The job's own exit code already failed the build; this step
          # exists to annotate, not to re-decide.
          fail_on_failure: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-nextest-docker
          path: target/nextest/docker/junit.xml

  site:
    name: Build site
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Docusaurus can derive per-page "last updated" times.
          fetch-depth: 0
          # Docusaurus reads git *history* for last-updated; it never pushes.
          # Leaving the token in .git/config would expose it to every later
          # step in this job, `npm ci` and the Docusaurus build included.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 went end-of-life in April 2026 — CI was building the
          # published site on an unsupported runtime. 24 is Active LTS, and is
          # also what this project is developed against locally, so CI and a
          # contributor's machine agree.
          node-version: 24
          cache: npm
          # Required: the lockfile is not at the repo root, and without this
          # setup-node looks only there, finds nothing, and silently never
          # caches.
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # Restored *after* `npm ci`, which is not a stylistic choice: npm ci
      # removes an existing node_modules before installing, so a cache restored
      # before it is deleted and the whole step silently does nothing. This is
      # the Rspack persistent cache that makes Docusaurus Faster's rebuilds
      # 2-5x rather than merely its cold builds 3-4x.
      #
      # Restore-only, and keyed on the lockfile rather than the commit. The
      # first version of this used the full `actions/cache` with a
      # `${{ github.sha }}` suffix — a key that can never hit, so every pull
      # request run saved a fresh entry. Measured: 546 MB raw, 88 MB
      # compressed, per run, against a 10 GB repository budget. That is
      # verbatim the LRU thrash `setup-rust` restricts rust-cache writes to
      # avoid; the rule just had not been applied to the one cache that is not
      # rust-cache. Pull requests consume, the scheduled deploy produces.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: docusaurus-${{ runner.os }}-

      # `docusaurus build` transpiles TypeScript with SWC, which strips types
      # without checking them — so until this step existed nothing in CI ran
      # `tsc` at all, and a type error merged green. Found by a bot bump to
      # TypeScript 7: it could not have been evaluated on its own pull request
      # because the only signal, `npm run build`, does not consult tsc.
      - name: Typecheck the site
        working-directory: website
        run: npm run typecheck

      # No rustdoc and no licence texts here — both are deploy-time artifacts
      # regenerated by the scheduled deploy, and building them cost every Rust
      # pull request a full `cargo doc` over the whole dependency graph plus an
      # npm install it had no other use for. What this job answers is the
      # question a docs change actually raises: does the site still build, and
      # do its links and redirects still resolve.
      #
      # CI=true is what registers the client-redirects plugin, and a redirect
      # whose target page was deleted is a hard build failure. GitHub Actions
      # sets CI=true itself; it is named here so that the guarantee is visible
      # rather than incidental.
      - name: Build Docusaurus site
        working-directory: website
        env:
          CI: "true"
        run: npm run build

      # The real guard against Cloudflare Pages' 20,000-file ceiling is the
      # identical step in scheduled.yml, because rustdoc is what actually scales
      # with the workspace and only the deploy build stages it — this build
      # produces a couple of hundred files and would never trip a threshold set
      # for the deploy. Kept here anyway, cheaply, so a docs change that
      # generates pages in bulk is caught on the pull request that made it
      # rather than at 03:17.
      - name: Site is within the Cloudflare file limit
        run: |
          count=$(find website/build -type f | wc -l)
          echo "site files: $count (deploy build adds ~1300 rustdoc files)"
          if [ "$count" -gt 15000 ]; then
            echo "::error::$count files; the deploy build adds rustdoc on top and"
            echo "::error::Cloudflare Pages refuses a deployment over 20000 files."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The gate. This is the ONLY job that should ever be a required status check.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` is load-bearing. Without it this job is itself skipped when a
    # dependency fails, and a skipped check reports as *success* to branch
    # protection — so a gate without `always()` is strictly worse than no gate,
    # because it green-lights exactly the runs it exists to stop.
    if: always()
    needs: [changes, lint, workflows, deny, changelog, test, doctests, features, msrv, containers, site, loom, alloc-assertions, perf-warm, perf-counters, perf-report]
    steps:
      - name: Evaluate dependency results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # `skipped` is accepted: it means ci-changes.sh determined the job had
          # nothing to do. `cancelled` is NOT — cancel-in-progress produces
          # `cancelled` rather than `failure`, and a gate that only looked for
          # failures would let a half-finished run through.
          #
          # Reading the whole `needs` object rather than naming each job means
          # adding a job to `needs:` above is enough; there is no second list to
          # forget to update.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | .[].key')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs succeeded or were legitimately skipped."
