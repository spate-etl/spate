name: CI

# No `paths:` filter: a workflow skipped by one never reports its checks, and a
# required check that never reports blocks the pull request.
on:
  push:
    branches: [main]
  # `edited` re-runs the changelog gate: it reads the pull request *title*, and
  # a retitle after a green run would land unchecked. The opt-in `ci: docker`
  # and `ci: bench` labels take effect on the branch's next push. `ci.yml`
  # classifies each run from the event that triggered it, so a manual re-run of
  # an already-started run carries the labels that run started with.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  # A full-DWARF build of the `spate` end-to-end test binaries exhausted the
  # runner: `rustc-LLVM ERROR: ... No space left on device`. Both keys: `cargo
  # test` builds the target under `test`, its dependencies under `dev`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Runs on `main` are not cancelled: they alone write the build cache every pull
# request restores from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What changed. Every `if:` below reads from here.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      site: ${{ steps.classify.outputs.site }}
      fuzz: ${{ steps.classify.outputs.fuzz }}
      containers: ${{ steps.classify.outputs.containers }}
      container-args: ${{ steps.classify.outputs.container-args }}
      semver: ${{ steps.classify.outputs.semver }}
      semver-pkgs: ${{ steps.classify.outputs.semver-pkgs }}
      bench: ${{ steps.classify.outputs.bench }}
      manifests: ${{ steps.classify.outputs.manifests }}
      # A JSON array of `{package, arm, cargo_features}` objects, one per shard.
      bench-shards: ${{ steps.classify.outputs.bench-shards }}
      # A JSON array of `{lane}` objects: the ClickHouse lanes needing a job
      # beyond the `lts` one `containers` runs. Empty when the two lanes
      # resolve to the same image, which they do until `stable` moves ahead.
      clickhouse-lanes: ${{ steps.classify.outputs.clickhouse-lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both diff endpoints must be present as objects.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: xtask
      - id: classify
        # Event fields go through `env:`, never interpolated into a `run:` block:
        # interpolation splices attacker-controlled text into generated shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The pull request's author, not `github.actor`: the latter is whoever
          # last triggered the run and changes on a manual re-run.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # For the `manifests` output on push, where no pull-request diff
          # exists. Empty or unresolvable fails closed to `manifests=true`.
          EVENT_BEFORE: ${{ github.event.before }}
          # The queue branch: this entry on top of the ones ahead of it. Absent
          # outside a merge group, where the arm reading them never runs.
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: cargo run -q -p spate-xtask --locked -- ci-changes

  # Tier 1: cheap, unconditional, gates the expensive tier. No job-level `if:`
  # here: a skipped job skips everything that `needs:` it. The step carries it.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          shared-key: dev-allfeatures
      - run: cargo xtask fmt --check
      - if: needs.changes.outputs.rust == 'true'
        run: cargo xtask clippy

  workflows:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # The entry the `changes` job owns. A consumer that also wrote it
          # would race the owner the first time it is missing.
          shared-key: xtask
          cache-save: never
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          # zizmor alone carries a version: a release can relax the default
          # audit policy this job rests on, and the action's own bump would
          # move it with nothing in the title to say so. Bumped by hand, after
          # reading the release notes for audit changes.
          tool: zizmor@1.28.0,shellcheck
      # `changelog` is outside this set: it reads the pull request's own fields
      # and has a job that supplies them. Without GH_TOKEN zizmor skips the API
      # audits and reports "No findings", exit 0, against a known-vulnerable
      # action.
      - run: cargo xtask tidy
        env:
          GH_TOKEN: ${{ github.token }}

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The RustSec advisory database moves with no file here changing, so this
    # runs on every pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not cargo-deny-action: it builds a container from a Dockerfile that pipes
      # an unverified release tarball into /usr/bin.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny

      - run: cargo xtask deny

      - run: cargo xtask tidy self-test

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own job: `workflows` is in every tier-2 `needs:`, so a missing release
    # note there would skip the whole test matrix.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: xtask
          cache-save: never

      - env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: cargo xtask tidy changelog

  # Tier 2: gated on tier 1, scoped to what changed.

  # The API of the crates this pull request can move, against the published
  # release. That baseline is what the version number is a claim about, and it
  # moves only at a release, which is what tokio, hyper, diesel and rustls all
  # compare against.
  #
  # A finding passes with a notice when the title carries the `!` marker. The
  # squash subject is the title, and the marker there is what the release
  # derivation reads, so `edited` in this workflow's triggers re-runs the gate
  # on a retitle. A finding also passes when a commit since the last tag
  # already carries a marker, because the break it names has already landed
  # and is already announced.
  #
  # That second excuse is workspace-wide. After the first announced break of a
  # release cycle, a later pull request breaking a different crate passes here
  # without a marker of its own; the version still derives as a minor and the
  # fragment for that second break is what goes missing. This is the trade the
  # published baseline carries and it is taken deliberately.
  #
  # The set comes from the CI selector's reverse-dependency closure over the
  # changed crates, which is why a change confined to one connector no longer
  # rebuilds every crate's rustdoc.
  semver:
    name: Semver (cargo-semver-checks)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: github.event_name == 'pull_request' && needs.changes.outputs.semver == 'true'
    timeout-minutes: 45
    steps:
      # The tool builds a rustdoc tree per crate per side and shares nothing
      # between them; the runner's stock disk has drowned under less.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags and every commit since the newest one: the marker scan
          # reads that range, and the base tip ends it.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-semver-checks
          # Reads the lint cache for the tree's side. The baselines come from
          # the cache below instead, which rust-cache would not hold: it prunes
          # target/ to what it recognizes.
          shared-key: dev-allfeatures
          cache-save: never

      - id: baseline-key
        run: cargo xtask semver-checks --cache-key

      # Restore-only; the baseline-cache job below produces this entry. The
      # tool writes the parsed rustdoc for each published baseline under
      # target/semver-checks/cache and reuses it in place of the build, which
      # is the expensive half of a comparison. The build trees beside it are
      # scratch and are not cached: they run to gigabytes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/semver-checks/cache
          key: ${{ steps.baseline-key.outputs.key }}

      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Crate names this workflow computed, not event data. The gate
          # rejects anything that is not a directory under crates/.
          SEMVER_PKGS: ${{ needs.changes.outputs.semver-pkgs }}
        run: cargo xtask semver-checks --against-registry --packages "$SEMVER_PKGS"

  # Fills the baseline cache the pull-request gate restores. The key names the
  # published release, so this runs once a release cycle and is a no-op on
  # every other push.
  #
  # The verdict is not this job's business: a pull request is where a break is
  # judged, and failing here would report a break nobody can act on from a
  # commit already on `main`. The run is for the artefacts it leaves behind.
  semver-baseline:
    name: Semver baseline cache
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-semver-checks
          shared-key: dev-allfeatures
          cache-save: never

      - id: baseline-key
        run: cargo xtask semver-checks --cache-key

      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/semver-checks/cache
          key: ${{ steps.baseline-key.outputs.key }}
          lookup-only: true

      # Every crate, so the entry serves whichever crates a later pull request
      # selects. A breaking verdict is expected here whenever an announced
      # break has landed, and is not this job's to report.
      #
      # The run producing nothing is the case to catch: an unreachable index
      # fails before any baseline is parsed, and saving that would serve an
      # empty entry as a hit until the next release moves the key.
      - if: steps.restore.outputs.cache-hit != 'true'
        id: fill
        run: |
          cargo xtask semver-checks --against-registry || true
          if [ -n "$(ls -A target/semver-checks/cache 2>/dev/null)" ]; then
            echo "filled=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::no baseline was parsed; leaving the cache unset."
          fi

      - if: steps.fill.outputs.filled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/semver-checks/cache
          key: ${{ steps.baseline-key.outputs.key }}

  # Packages and verify-builds every crate at a simulated next version. At
  # the version already on the registry every sibling resolves from there, so
  # the bump is what exercises the resolution a release performs; it is
  # committed locally and never pushed.
  #
  # Push to `main` only: a `pull_request` run executes the pull request's own
  # copy of this workflow. The job holds no credential and no environment;
  # `--dry-run` stops before the upload request. Skipped on the release push,
  # where the publish runs this for real.
  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: >-
      github.event_name == 'push' &&
      needs.changes.outputs.manifests == 'true' &&
      !startsWith(github.event.head_commit.message, 'chore: release v')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: publish

      - name: Bump to the next patch and commit it locally
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          next="${version%.*}.$(( ${version##*.} + 1 ))"
          cargo xtask release-version --bump "$next"
          # The dry run refuses a dirty worktree.
          git config user.name 'spate-release[bot]'
          git config user.email 'spate-release[bot]@users.noreply.github.com'
          git commit --all --quiet --message "chore: simulate the release bump to $next"

      # The dry run cannot see these: it packages a crate with no description
      # or license with a warning and exit 0, while the upload rejects it
      # (cargo issue 14249).
      - name: Prove the upload metadata is present
        run: cargo xtask release-version --check-publish-metadata

      - name: Prove every crate packages
        run: cargo publish --workspace --locked --dry-run

  # Catches a floor mismatch this diff introduces, before merge.
  minimal-versions:
    name: Declared version floors build
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.manifests == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain-file: .github/toolchains/nightly/rust-toolchain.toml
          shared-key: minimal-versions
      - name: Resolve every direct dependency to its declared floor
        run: cargo generate-lockfile -Z direct-minimal-versions
      # `--all-targets` holds dev-dependency floors to the same standard.
      - run: cargo check --workspace --all-targets --all-features --locked

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # `checks: write` for the JUnit publish step below.
    permissions:
      contents: read
      checks: write
    env:
      # Coverage builds a second target tree; at the default `debuginfo=2` the
      # disk fills and the linker dies with SIGBUS, reading as a compile failure.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # `secrets` is not available in a step-level `if:`. See the upload step.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          tools: nextest,cargo-llvm-cov
          # Its own key: llvm-cov builds into `target/llvm-cov-target`, not the
          # `target/debug` that lint, features and doctests share.
          shared-key: coverage

      - name: Test and coverage
        run: >
          cargo llvm-cov nextest --profile ci --workspace --all-features --locked
          --lcov --output-path lcov.info
          --ignore-filename-regex '/(tests|examples)/'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        # Keyed on the token's presence, not on a fork check: Dependabot resolves
        # `secrets.*` from a separate store, so a bot pull request has none and
        # `fail_ci_if_error` sinks it. Do not move to `pull_request_target`.
        if: env.HAS_CODECOV_TOKEN == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Loud: a silently failed upload leaves the coverage check permanently
          # absent.
          fail_ci_if_error: true
          flags: unit

      # Keeps a passing-on-retry flake visible as a check annotation.
      - name: Publish test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          fail_on_failure: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-nextest
          path: target/nextest/ci/junit.xml

  doctests:
    name: Doc tests and rustdoc
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # A separate job: `cargo test --doc` builds into `target/debug` and
    # `cargo llvm-cov` into `target/llvm-cov-target`, so pairing them with
    # `test` compiles the workspace twice.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: dev-allfeatures
      - run: cargo xtask doctest
      - run: cargo xtask doc

  docsrs:
    name: Rustdoc as docs.rs builds it
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # docs.rs builds each crate alone, on nightly, applying that crate's own
    # `[package.metadata.docs.rs]`. `cargo xtask doc` builds the workspace
    # together on stable, which unifies features across members and leaves
    # `docsrs` unset, so the `rustdoc-args` and the nightly rustdoc features
    # gated on that cfg reach no other job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain-file: .github/toolchains/nightly/rust-toolchain.toml
          # Its own entry: a nightly rustdoc build shares no artefact with the
          # stable dev-profile trees the other jobs cache.
          shared-key: docsrs
      # `+nightly` would name the floating channel and resolve past the pin.
      - env:
          NIGHTLY: ${{ steps.rust.outputs.toolchain }}
        run: cargo xtask docsrs --nightly "$NIGHTLY"

  features:
    name: Feature matrix (each feature)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    # Linear; the exhaustive powerset runs in scheduled.yml.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-hack
          shared-key: dev-allfeatures
      - run: cargo xtask hack

  alloc-assertions:
    name: Allocation assertions (spate-core)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    # `chain_alloc`'s bounds are calibrated against optimized code, so `--release`
    # is a requirement; a debug build allocates differently and proves nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release
      - run: cargo test -p spate-core --release --test chain_alloc --locked

  # Builds every target with libFuzzer's instrumentation, which needs nightly.
  # It runs none of them; the nightly tier in scheduled.yml is
  # what fuzzes, and is also the backstop for a crate change that breaks the
  # harness without touching `fuzz/`.
  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.fuzz == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          # libFuzzer's `-Z sanitizer` codegen is nightly-only.
          toolchain-file: .github/toolchains/nightly/rust-toolchain.toml
          # Its own entry: every artefact here is an instrumented release build
          # and shares nothing with the dev-profile trees the other jobs cache.
          shared-key: fuzz

      # install-action carries no manifest for cargo-fuzz and falls back to
      # cargo-binstall, which resolves a release binary nothing here checksums.
      - run: cargo xtask fuzz install

      - name: Build every fuzz target
        # `+nightly` would name the floating channel and resolve past the pin.
        env:
          NIGHTLY: ${{ steps.rust.outputs.toolchain }}
        run: |
          set -euo pipefail
          cargo "+$NIGHTLY" fuzz list >targets.txt
          targets=$(wc -l <targets.txt)
          if [[ "$targets" -eq 0 ]]; then
            echo "::error::the fuzz crate declares no target; this job built nothing"
            exit 1
          fi
          echo "building $targets target(s)"
          cargo xtask fuzz build --nightly "$NIGHTLY"

  # The instruction-count tier: one shard per (package, feature arm). gungraun's
  # summary path carries no feature component, so two feature builds of one bench
  # in one workspace overwrite each other's summary and baseline, silently.
  perf-warm:
    name: Warm the counter-tier build cache
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # `main` only: rust-cache writes from `main` alone.
    if: github.event_name == 'push' && needs.changes.outputs.bench == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Its own entry, not `release`: these pull each benched crate's
          # dev-dependencies and the gungraun harness.
          shared-key: bench
      - name: Build every bench arm
        env:
          BENCH_SHARDS: ${{ needs.changes.outputs.bench-shards }}
        run: |
          set -euo pipefail
          # Materialised and counted, not streamed: a `while read` whose producer
          # died iterates zero times and exits 0, having warmed nothing.
          jq -r '.[] | [.package, .cargo_features] | @tsv' <<<"$BENCH_SHARDS" >arms.tsv
          arms=$(wc -l <arms.tsv)
          if [[ "$arms" -eq 0 ]]; then
            echo "::error::the bench matrix is empty; there is nothing to warm"
            exit 1
          fi
          echo "warming $arms arm(s)"
          built=0
          while IFS=$'\t' read -r package cargo_features; do
            [[ -n "$package" ]] || continue
            cargo xtask bench gungraun --features "$cargo_features" --check "$package"
            built=$((built + 1))
          done <arms.tsv
          if [[ "$built" -ne "$arms" ]]; then
            echo "::error::warmed $built of $arms arm(s)"
            exit 1
          fi

  perf-counters:
    name: Instruction counts (${{ matrix.package }} / ${{ matrix.arm }})
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # The second clause is required: a matrix expanding to zero jobs is a
    # workflow-level error, and a false `if:` is what prevents the expansion.
    if: needs.changes.outputs.bench == 'true' && needs.changes.outputs.bench-shards != '[]'
    timeout-minutes: 45
    strategy:
      # `ci-gate` counts `cancelled` as failure, so fail-fast would turn one real
      # failure into several unattributable ones.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.bench-shards) }}
    # Advisory in what it reports, blocking in whether it ran: a moved count does
    # not fail a merge, and this job stays in `ci-gate`'s `needs:` so a bench that
    # stops building does.
    steps:
      # Full history: the merge base has to be resolvable and checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: bench
          # A pure consumer of the entry `perf-warm` owns.
          cache-save: never

      # The version is part of the measurement: valgrind emulates CPUID, so a
      # runner-image bump can move a count with nothing here changing.
      - name: Install valgrind
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      # Its own step because it is also the cache key below.
      - name: Resolve the gungraun-runner version
        id: runner-version
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "gungraun") | .version')
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Built from source: install-action has no checksummed prebuilt for it.
      # The key names no shard, so the matrix shares one entry.
      - name: Cache gungraun-runner
        id: runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gungraun/bin
          key: gungraun-runner-${{ runner.os }}-${{ steps.runner-version.outputs.version }}

      - name: Install gungraun-runner
        if: steps.runner-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.runner-version.outputs.version }}
        run: |
          set -euo pipefail
          cargo install gungraun-runner --version "$VERSION" --locked --root ~/.gungraun

      - name: Put gungraun-runner on PATH
        run: echo "$HOME/.gungraun/bin" >>"$GITHUB_PATH"

      # This leg runs the merge base's own copy of the bench runner, the head leg
      # the head's. A non-default arm probes first: a base predating the feature
      # axis measures the default arm and the delta is arm mismatch.
      - name: Measure the merge base
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base HEAD^1 HEAD^2)
          git checkout --quiet --detach "$merge_base"
          # A restored cargo cache's counter output would become the comparison.
          rm -rf target/gungraun
          measured=false
          # A merge base predating the command has no runner to measure with.
          # `--help` answers 0 where the command exists, which separates it from
          # the usage exit the argument probe below reads.
          runner=()
          if cargo xtask bench gungraun --help >/dev/null 2>&1; then
            runner=(cargo xtask bench gungraun)
          fi
          if [[ "${#runner[@]}" -eq 0 ]]; then
            # Names the cause: a rename would disable every baseline while CI
            # stayed green.
            echo "no baseline: the merge base carries no bench gungraun command"
          else
            args=()
            probe=2
            if [[ -n "$CARGO_FEATURES" ]]; then
              args=(--features "$CARGO_FEATURES")
              set +e
              "${runner[@]}" "${args[@]}" \
                --run __no_such_package__ >/dev/null 2>&1
              probe=$?
              set -e
            fi
            if [[ "$probe" -ne 2 ]]; then
              echo "no baseline: the merge base's ${runner[*]} does not take --features (probe exit $probe)."
              echo "It would build the default arm while this shard builds '$ARM', and two arms are not comparable."
            else
              set +e
              GUNGRAUN_SAVE_BASELINE=base "${runner[@]}" \
                ${args[@]+"${args[@]}"} --run "$PACKAGE"
              rc=$?
              set -e
              case "$rc" in
                0) measured=true ;;
                2) echo "no baseline: the merge base has no bench for $PACKAGE" ;;
                *) echo "no baseline: a bench failed on the merge base (exit $rc)" ;;
              esac
              [[ "$measured" == "true" ]] || rm -rf target/gungraun
            fi
          fi
          git checkout --quiet --detach "$head_sha"
          {
            echo "measured=$measured"
            echo "merge-base=$merge_base"
          } >>"$GITHUB_OUTPUT"

      # Writes one summary per bench for the stamping step below to collect.
      - name: Instruction counts
        env:
          GUNGRAUN_SAVE_SUMMARY: json
          GUNGRAUN_BASELINE: ${{ steps.base.outputs.measured == 'true' && 'base' || '' }}
          PACKAGE: ${{ matrix.package }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          if [[ -z "$GUNGRAUN_BASELINE" ]]; then
            unset GUNGRAUN_BASELINE
            # Otherwise a restored cache or aborted base leg becomes the baseline.
            rm -rf target/gungraun
          fi
          cargo xtask bench gungraun --features "$CARGO_FEATURES" --run "$PACKAGE"

      # A gate, not a measurement: a bench whose collected region measured the
      # allocator reports a plausible number through every other signal, and that
      # number becomes a baseline later comparisons inherit. Head leg only.
      - name: Reject a degenerate collected region
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
        run: cargo xtask bench region --shard "$PACKAGE ($ARM)"

      # A gungraun summary carries the package only as a directory path and the
      # feature arm not at all, so shard identity is stamped here for
      # `cargo xtask bench report`. Empty `baseline` renders as *no baseline*.
      #
      # The compiler is stamped alongside it. Codegen moves a count, and both
      # legs of this job run under one toolchain.
      - name: Stamp this shard's summaries
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
          BASE_MEASURED: ${{ steps.base.outputs.measured }}
          MERGE_BASE: ${{ steps.base.outputs.merge-base }}
          RUSTC: ${{ steps.rust.outputs.rustc }}
        run: |
          set -euo pipefail
          if [[ ! -d target/gungraun ]]; then
            echo "::error::$PACKAGE ($ARM) ran its benches but wrote no target/gungraun"
            exit 1
          fi
          find target/gungraun -name summary.json -exec cat {} + >raw.jsonl
          if [[ ! -s raw.jsonl ]]; then
            echo "::error::$PACKAGE ($ARM) wrote no summary.json; GUNGRAUN_SAVE_SUMMARY may no longer be honoured"
            exit 1
          fi
          if [[ "$BASE_MEASURED" == "true" ]]; then
            baseline="main @ ${MERGE_BASE:0:12}"
          else
            baseline=""
          fi
          mkdir -p shard
          jq -c --arg p "$PACKAGE" --arg a "$ARM" --arg b "$baseline" \
            --arg r "$RUSTC" \
            '. + {spate_shard: {package: $p, features: $a, baseline: $b, rustc: $r}}' \
            raw.jsonl >"shard/$PACKAGE.$ARM.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-summaries-${{ matrix.package }}-${{ matrix.arm }}
          path: shard/
          if-no-files-found: error

  perf-report:
    name: Instruction count report
    runs-on: ubuntu-latest
    needs: [changes, perf-counters]
    # A failed shard still leaves its siblings' measurements worth rendering.
    if: ${{ !cancelled() && needs.changes.outputs.bench == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: xtask
          cache-save: never

      # Own directory per shard, so identically named files do not collide.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-summaries-*
          path: shards

      # Writes `has_regressions` for `perf-label.yml`, exiting 0 on a moved
      # metric. `continue-on-error` here, not on the job.
      - name: Report instruction counts
        id: report
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p shards
          find shards -name '*.jsonl' -exec cat {} + >gungraun-summaries.jsonl
          mkdir -p perf-regressions
          cargo xtask bench report \
            --regressions-out perf-regressions/has_regressions \
            gungraun-summaries.jsonl "baseline" >>"$GITHUB_STEP_SUMMARY"

      # The one output crossing into `perf-label.yml`. The markdown stays in the
      # step summary; nothing fork-authored is re-posted by a privileged
      # workflow. Gated on the report's outcome: a dead report writes no flag.
      - name: Upload the regression flag
        if: github.event_name == 'pull_request' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-regressions
          path: perf-regressions/has_regressions

  loom:
    name: Loom models (spate-core)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # INV-3. The models are the only thing that checks it, and `--cfg loom` is
    # the only build that compiles their side of the cfg pairs.
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # `--cfg loom` rebuilds the world against loom-typed primitives. Same
          # key as the scheduled job, so whichever runs first warms the other.
          shared-key: loom
      - run: cargo xtask loom

  msrv:
    name: Check (MSRV)
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: msrv
          shared-key: msrv
      # `--locked` is what makes this ask about the graph we ship: free to
      # resolve, it would pass on an older graph than the committed lockfile.
      - run: cargo xtask check

  containers:
    name: Container suites
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.containers == 'true'
    timeout-minutes: 60
    # `checks: write` for the JUnit report: without it the publish step logs
    # `Resource not accessible by integration` and leaves the job green.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: nextest
          # Separate key: the `#[ignore]`d suites link binaries `test` does not.
          shared-key: docker
      # By digest, and re-tagged locally, so the suite runs the pinned bytes.
      # testcontainers creates the container before it pulls, so the local tag
      # is what it finds.
      - name: Pull the pinned ClickHouse image
        if: contains(needs.changes.outputs.container-args, 'spate-clickhouse')
        run: cargo xtask container-image --pull clickhouse
      # Serial: 2 cores and ~7 GB across SeaweedFS, NATS, Kafka and ClickHouse
      # OOMs in parallel.
      - name: Container suites
        env:
          PKGS: ${{ needs.changes.outputs.container-args }}
        # "This happens to split correctly" is a property that breaks silently.
        run: |
          read -ra pkgs <<< "$PKGS"
          cargo nextest run --profile docker "${pkgs[@]}" --all-features --locked \
            --run-ignored ignored-only --test-threads 1

      - name: Publish container test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: target/nextest/docker/junit.xml
          check_name: Container test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          fail_on_failure: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-nextest-docker
          path: target/nextest/docker/junit.xml

  # The ClickHouse server versions beyond the one `containers` runs: the older
  # supported LTS line, and the newest release once it moves ahead of that LTS.
  # `ci/clickhouse/<lane>/Dockerfile` pins each, and Dependabot moves them.
  clickhouse-versions:
    name: ClickHouse ${{ matrix.lane }}
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    # A matrix expanding to zero jobs is a workflow-level error, and a false
    # `if:` is what prevents the expansion. The classifier already empties the
    # array unless the ClickHouse suite was selected, so this one clause covers
    # both questions.
    if: needs.changes.outputs.clickhouse-lanes != '[]'
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    strategy:
      # `ci-gate` counts `cancelled` as failure, so fail-fast would turn one
      # real failure into several unattributable ones.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.clickhouse-lanes) }}
    env:
      SPATE_CLICKHOUSE_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: nextest
          shared-key: docker
          # A consumer of the entry `containers` owns. These legs build one
          # crate and would otherwise win the race to write a cache holding the
          # whole container tier.
          cache-save: never
      - name: Pull the pinned ClickHouse image
        run: cargo xtask container-image --pull clickhouse "$SPATE_CLICKHOUSE_LANE"
      - name: ClickHouse suite
        run: |
          cargo nextest run --profile docker -p spate-clickhouse --all-features \
            --locked --run-ignored ignored-only --test-threads 1

      # Both names carry the lane: upload-artifact rejects a duplicate name
      # within one run, and two checks sharing a name are unattributable.
      - name: Publish ClickHouse test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: target/nextest/docker/junit.xml
          check_name: ClickHouse ${{ matrix.lane }} test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          fail_on_failure: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-nextest-clickhouse-${{ matrix.lane }}
          path: target/nextest/docker/junit.xml

  site:
    name: Build site
    runs-on: ubuntu-latest
    needs: [changes, lint, workflows]
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Docusaurus can derive per-page "last updated" times.
          fetch-depth: 0
          # The benchmark data the site renders under /benchmarks.
          submodules: true
          # The token in `.git/config` would reach `npm ci` and the site build.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          # Required: the lockfile is not at the repo root, and without it
          # setup-node silently never caches.
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # After `npm ci`, not before: npm ci removes node_modules, so a cache
      # restored earlier is deleted and the step silently does nothing.
      # Restore-only; the scheduled deploy produces this entry.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: docusaurus-${{ runner.os }}-

      # SWC strips types without checking them; without this step a type error
      # merges green.
      - name: Typecheck the site
        working-directory: website
        run: npm run typecheck

      # The benchmark data layer and the neutrality rule. Nothing in the build
      # exercises them.
      - name: Test the site
        working-directory: website
        run: npm test

      # `CI=true` registers client-redirects, so a redirect to a deleted page
      # fails the build.
      - name: Build Docusaurus site
        working-directory: website
        env:
          CI: "true"
        run: npm run build

      - name: Site is within the Cloudflare file limit
        run: |
          count=$(find website/build -type f | wc -l)
          echo "site files: $count"
          if [ "$count" -gt 10000 ]; then
            echo "::error::$count files; Workers static assets refuse a deployment over 20000."
            exit 1
          fi

      # Its own step because it is also the cache key below. A browser build
      # from a different Playwright version is unusable, so the key names the
      # resolved version rather than a lockfile hash.
      - name: Resolve the Playwright version
        id: playwright-version
        working-directory: website
        run: |
          set -euo pipefail
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The apt-installed system libraries live outside the cached directory,
      # so a cache hit still needs them, just not the browser download.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Install Playwright's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: website
        run: npx playwright install-deps chromium

      # axe-core is DOM analysis, not rendering, so chromium alone covers it;
      # see website/tests/e2e/README.md for when firefox and webkit earn a run.
      - name: Accessibility and end-to-end tests
        working-directory: website
        run: npx playwright test --project=chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: website/playwright-report

  # The gate. This is the ONLY job that should ever be a required status check.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `!cancelled()` still runs this job when a dependency fails outright: a
    # skipped check reports as *success* to branch protection, and a genuine
    # failure must report through this gate. It skips only when the run itself
    # was cancelled, so a run superseded by a newer one for the same commit
    # leaves no lingering `failure` for branch protection to keep blocking on.
    if: ${{ !cancelled() }}
    needs: [changes, lint, workflows, deny, changelog, semver, semver-baseline, publish-dry-run, minimal-versions, test, doctests, docsrs, features, msrv, containers, clickhouse-versions, site, loom, alloc-assertions, fuzz, perf-warm, perf-counters, perf-report]
    steps:
      - name: Evaluate dependency results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # `skipped` is accepted; `cancelled` is not, since a dependency that
          # exceeds its own `timeout-minutes` completes with conclusion
          # `cancelled`, and every job in `needs:` carries one.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | .[].key')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs succeeded or were legitimately skipped."
