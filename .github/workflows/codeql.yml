name: CodeQL

# No `paths:` filter. The `code-scanning` ruleset blocks a merge while an
# analysis is pending, so a run that never starts leaves the pull request
# unmergeable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # The Rust database dominates; `actions` finishes in under a minute.
    timeout-minutes: 45
    permissions:
      contents: read
      # Publishes the results as code scanning alerts.
      security-events: write
      actions: read
    strategy:
      # One language failing must not hide the other's results.
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `npm ci` only populates node_modules so the extractor can resolve real
      # Docusaurus/React types; CodeQL still extracts under build-mode: none,
      # no `npm run build` involved.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        if: matrix.language == 'javascript-typescript'
        working-directory: website
        run: npm ci

      # `build-mode: none` reads the sources directly, so no cargo build runs
      # and the job needs no Rust toolchain.
      # Container fixtures pass a throwaway password to a server they start
      # and drop, which `rust/hard-coded-cryptographic-value` reports as a
      # credential. Every alert it has raised here has been one of those.
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - 'crates/*/tests/**'
              # Test specs, not shipped code.
              - 'website/**/*.test.ts'
              - 'website/**/*.test.js'

      # `category` keeps each language's results in its own SARIF namespace, so
      # one language's run does not retire the other's alerts.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
