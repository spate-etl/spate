name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'crates/**'
      - 'benchmarks/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'crates/**'
      - 'benchmarks/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only by default; the `deploy` job widens it to what wrangler needs. Set
# explicitly rather than inherited, so a repo-level default that is more
# permissive than read-only cannot silently reach the job that runs `npm ci`
# over ~1400 third-party packages.
permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so Docusaurus can derive per-page "last updated" times.
          fetch-depth: 0
          # Docusaurus reads git *history* for last-updated; it never pushes.
          # Leaving the token in .git/config would expose it to every later
          # step in this job, `npm ci` and the Docusaurus build included.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 20 went end-of-life in April 2026 — CI was building the
          # published site on an unsupported runtime. 24 is Active LTS, and is
          # also what this project is developed against locally, so CI and a
          # contributor's machine agree.
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build API reference (rustdoc)
        run: cargo doc --workspace --exclude benchmarks --no-deps --all-features --locked

      # Stage rustdoc under the site's static/ dir so Docusaurus copies it into
      # the build at <baseUrl>/api/ (and it's served during local `npm start`).
      - name: Stage API reference into static/api
        run: |
          rm -rf website/static/api
          mkdir -p website/static/api
          cp -r target/doc/. website/static/api/
          # rustdoc emits no workspace-root index; redirect /api/ to the facade crate.
          cat > website/static/api/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=etl/index.html" />
              <link rel="canonical" href="etl/index.html" />
              <title>etl-rs API reference</title>
            </head>
            <body>
              <a href="etl/index.html">Redirecting to the etl crate API reference…</a>
            </body>
          </html>
          EOF

      # Same generator as CI's attribution gate, different template: the
      # committed THIRD-PARTY.md carries licence ids only (so it stays
      # diffable), while the site carries every crate's full licence text.
      # ~300KB, regenerated per deploy rather than committed.
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-about@0.9.1

      - name: Build third-party licence texts
        run: |
          rm -rf website/static/licenses
          mkdir -p website/static/licenses
          cargo about generate --workspace --all-features --locked --fail \
            -o website/static/licenses/index.html about-html.hbs

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: website
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: website/build

  deploy:
    name: Deploy to Cloudflare Pages
    # Only publish from main; pull requests build the site to catch breakage
    # but never deploy (keeps deploy secrets away from fork PRs once open source).
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: https://etl-rs.pages.kainth.net
    # Serialize production deploys; don't cancel an in-progress publish.
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: website/build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        # This step runs its own `npm i wrangler@3.x` on the runner, and it does
        # so *after* setting CLOUDFLARE_API_TOKEN in the environment. That is a
        # second, unlockfiled npm install of ~60 packages resolved fresh on
        # every deploy — and website/.npmrc cannot reach it, because this job
        # has no checkout, so the install runs in an empty GITHUB_WORKSPACE with
        # lifecycle scripts on and the production token already in `process.env`.
        #
        # NPM_CONFIG_IGNORE_SCRIPTS closes that path the only way available
        # here: npm reads config from the environment, so this needs no file.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets wrangler record a GitHub Deployment for this run.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Pin the major; don't silently float onto a new wrangler.
          wranglerVersion: '3.x'
          # --branch=main matches the project's production branch, so this
          # registers as a production deployment (not a preview).
          command: pages deploy website/build --project-name=etl-rs --branch=main
