name: Labeler

# Applies the `crate:` and `area:` labels from the paths a pull request changed.
# `pull_request_target`, not `pull_request`: labelling needs a write token, and a
# fork's `pull_request` run gets read-only. That trigger runs fork-authored code
# with a privileged token if the workflow checks it out. This one must not.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read the labeler config from the base ref.
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          # `.github/**` rules would match nothing otherwise.
          dot: true
