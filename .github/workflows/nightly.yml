name: Nightly

# What belongs here is the world changing underneath a static tree; anything
# whose job is to stop a change entering `main` belongs in ci.yml.
on:
  schedule:
    # Off the hour: scheduled runs queue at peak, and the hour is the peak.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: >-
          `docs` builds and deploys the site alone. The release dispatches it
          after a publish so the install snippets go live without the rest of
          the night. A cron run leaves this empty.
        type: choice
        default: nightly
        options: [nightly, docs]

permissions:
  contents: read

# One run at a time per ref, never cancelled. A release's docs dispatch that
# lands during a night waits for that night to finish.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attribution:
    name: Attribution inventory
    runs-on: ubuntu-latest
    # A cron run leaves `inputs.tier` empty, so only a `docs` dispatch skips
    # this.
    if: inputs.tier != 'docs'
    timeout-minutes: 20
    # Proves the inventory still generates before a release depends on it.
    # THIRD-PARTY.md may lag `Cargo.lock` here; the release regenerates it.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about
      # `tee` streams the output to the run log, so a step killed at its
      # timeout still shows what it printed, and keeps the copy the issue body
      # carries.
      - id: regen
        run: |
          set -o pipefail
          rc=0
          cargo xtask attribution 2>&1 | tee "$RUNNER_TEMP/regen.log" || rc=$?
          exit "$rc"

      # Files only when the regen step fails; a setup failure would otherwise
      # file an issue asserting the generator broke.
      - name: Write the issue body
        if: failure() && steps.regen.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          where=$'Build, CI, or the examples\n\nThe `Attribution inventory` job of the nightly scheduled run.'
          version="\`main\` at $SHA"
          what="\`cargo xtask attribution\` failed on the [nightly run]($RUN_URL)."
          # Single quotes: the backticks must reach GitHub rather than run as
          # command substitutions.
          # shellcheck disable=SC2016
          expected='The inventory generates. The release assembly runs the same command, so a release fails the same way until this is fixed. Reproduce it with `cargo xtask attribution`. If the output shows a network error, rerun the job first.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/regen.log"
          again="Still failing at $SHA, in the [nightly run]($RUN_URL)."
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file logs="$RUNNER_TEMP/regen.log"
      - name: Report the failure as an issue
        if: failure() && steps.regen.conclusion == 'failure'
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] Attribution inventory fails to generate"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  advisories:
    name: Advisories (RustSec)
    runs-on: ubuntu-latest
    if: inputs.tier != 'docs'
    timeout-minutes: 20
    # An advisory against a crate already in Cargo.lock stays invisible until a
    # pull request is opened.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny
      - id: deny
        run: |
          set -o pipefail
          rc=0
          cargo deny --all-features --locked check advisories 2>&1 | tee "$RUNNER_TEMP/deny.log" || rc=$?
          exit "$rc"

      # Files only when the deny step fails; a checkout failure would otherwise
      # file an issue asserting an advisory was found.
      - name: Write the issue body
        if: failure() && steps.deny.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          where=$'Build, CI, or the examples\n\nThe `Advisories (RustSec)` job of the nightly scheduled run.'
          version="\`main\` at $SHA"
          what="\`cargo deny check advisories\` failed on the [nightly run]($RUN_URL)."
          # Single quotes: the backticks must reach GitHub rather than run as
          # command substitutions.
          # shellcheck disable=SC2016
          expected='No advisory against a crate in `Cargo.lock` without an `ignore` entry in `deny.toml`. Triage is one of two things: upgrade the affected crate, or add a dated `ignore` entry to `deny.toml` with a written justification. Closing this issue without doing one of them just reopens it tomorrow.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/deny.log"
          again="Still failing at $SHA, in the [nightly run]($RUN_URL)."
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file logs="$RUNNER_TEMP/deny.log"
      - name: Report the failure as an issue
        if: failure() && steps.deny.conclusion == 'failure'
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] Nightly advisory scan is failing"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  osv:
    name: Advisories (OSV)
    runs-on: ubuntu-latest
    if: inputs.tier != 'docs'
    timeout-minutes: 20
    # cargo-deny reads only the crates the workspace compiles. This reads every
    # package in every tracked manifest, including lockfile entries no build
    # compiles and the site's npm tree. OpenSSF Scorecard counts that same set.
    permissions:
      contents: read
      issues: write
    steps:
      # Submodules stay unchecked-out: each is its own repository with its own
      # scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: osv-scanner
      # Each manifest's findings are filtered by the `osv-scanner.toml` in its
      # directory. `--no-resolve` scans the versions a manifest names: resolving
      # a requirements file with no lockfile picks versions no install would.
      # Exit 1 is a finding. Any other non-zero code is an error such as an
      # unreachable API or an invalid config, and the report may still list
      # advisories, so the code goes to the report step to state.
      - id: scan
        run: |
          set -o pipefail
          rc=0
          osv-scanner scan source --recursive --no-resolve \
            --format markdown --output-file "$RUNNER_TEMP/osv.md" . \
            2>&1 | tee "$RUNNER_TEMP/osv.log" || rc=$?
          # `--output-file` sends the report to the file alone. Printing it
          # puts the rows a cut issue body leaves out in the run log.
          if [ -s "$RUNNER_TEMP/osv.md" ]; then cat "$RUNNER_TEMP/osv.md"; fi
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"

      # The steps below run only when the scan step fails, so an earlier
      # failure such as the install does not file an issue for a scan that
      # never ran. The toolchain is for xtask, which writes the body.
      - if: failure() && steps.scan.conclusion == 'failure'
        uses: ./.github/actions/setup-rust
        with:
          # The entry ci.yml's `changes` job owns.
          shared-key: xtask
          cache-save: never
      # The report is a markdown table, so it goes under What happened, which
      # renders markdown. Output is fenced as shell. The intro is a text
      # answer so that cutting a long report keeps the run link and exit code.
      - name: Write the issue body
        if: failure() && steps.scan.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          set -euo pipefail
          intro="\`osv-scanner scan source --recursive --no-resolve .\` exited ${RC} on the [nightly run]($RUN_URL). Exit 1 means it reported the advisories below; any other code is an error under Output."
          if [ ! -s "$RUNNER_TEMP/osv.md" ]; then
            echo 'The scan wrote no report.' >"$RUNNER_TEMP/osv.md"
          fi
          again="Still failing at $SHA. $intro"
          where=$'Build, CI, or the examples\n\nThe `Advisories (OSV)` job of the nightly scheduled run.'
          version="\`main\` at $SHA"
          # Single quotes: the backticks must reach GitHub rather than run as
          # command substitutions.
          # shellcheck disable=SC2016
          expected='No advisory without an entry in the `osv-scanner.toml` beside the manifest that holds it. On exit 1, triage is one of two things: upgrade the affected package, or add a dated `IgnoredVulns` entry with a written reason, and closing this issue without doing one of them just reopens it tomorrow. On any other exit code, the run log shows the error to fix.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$intro" \
            --answer-file what="$RUNNER_TEMP/osv.md" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/osv.log"
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file what="$RUNNER_TEMP/osv.md" \
            --answer-file logs="$RUNNER_TEMP/osv.log"
      - name: Report the failure as an issue
        if: failure() && steps.scan.conclusion == 'failure'
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] Nightly OSV scan is failing"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    if: inputs.tier != 'docs'
    # MAX_TOTAL_TIME below times the number of targets, plus a cold instrumented
    # build of all of them.
    timeout-minutes: 120
    # A fuzz run reaches no point at which it is finished, so it runs on a
    # schedule rather than as a gate. New inputs arrive with nothing in this
    # repository changing.
    permissions:
      contents: read
      issues: write
    env:
      # Seconds per target.
      MAX_TOTAL_TIME: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain-file: .github/toolchains/nightly/rust-toolchain.toml
          shared-key: fuzz

      - run: cargo xtask fuzz install

      # BEFORE the run: a restore afterwards extracts a tar over `fuzz/corpus`
      # and overwrites the inputs libFuzzer just found. The prefix restore-key
      # is what carries the corpus between nights.
      - name: Restore last night's corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build every fuzz target
        id: build
        # `+nightly` would name the floating channel and resolve past the pin.
        env:
          NIGHTLY: ${{ steps.rust.outputs.toolchain }}
        run: |
          set -euo pipefail
          cargo "+$NIGHTLY" fuzz list >targets.txt
          targets=$(wc -l <targets.txt)
          if [[ "$targets" -eq 0 ]]; then
            echo "::error::the fuzz crate declares no target; this run proved nothing"
            exit 1
          fi
          echo "building $targets target(s)"
          cargo xtask fuzz build --nightly "$NIGHTLY"

      - name: Fuzz every target
        id: run
        env:
          NIGHTLY: ${{ steps.rust.outputs.toolchain }}
        run: |
          set -euo pipefail
          targets=$(wc -l <targets.txt)
          echo "fuzzing $targets target(s) for ${MAX_TOTAL_TIME}s each"
          fuzzed=0
          crashed=""
          log="$RUNNER_TEMP/fuzz-target.log"
          : >"$RUNNER_TEMP/fuzz.log"
          while IFS= read -r target; do
            [[ -n "$target" ]] || continue
            echo "::group::$target"
            rc=0
            cargo "+$NIGHTLY" fuzz run "$target" -- \
              -max_total_time="$MAX_TOTAL_TIME" -print_final_stats=1 2>&1 | tee "$log" || rc=$?
            if [[ "$rc" -ne 0 ]]; then
              crashed="$crashed $target"
              { echo "==> $target <=="; cat "$log"; } >>"$RUNNER_TEMP/fuzz.log"
            fi
            echo "::endgroup::"
            fuzzed=$((fuzzed + 1))
          done <targets.txt
          echo "crashed=${crashed# }" >>"$GITHUB_OUTPUT"
          if [[ "$fuzzed" -ne "$targets" ]]; then
            echo "::error::fuzzed $fuzzed of $targets target(s)"
            exit 1
          fi
          if [[ -n "$crashed" ]]; then
            echo "::error::a crashing input was found for:$crashed"
            exit 1
          fi

      # actions/cache's post step saves on a green job alone. A night that found
      # a crash still grew the corpus, and the crash can stand for several more
      # nights, so the save is split out and runs under `always()`.
      - name: Save this night's corpus
        if: always() && steps.build.conclusion == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload the crashing inputs
        if: failure() && steps.run.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          # A target can also exit non-zero without writing one.
          if-no-files-found: warn

      # Gated on the run step, not `failure()`: a checkout or build failure
      # would file an issue asserting a crashing input was found.
      - name: Write the issue body
        if: failure() && steps.run.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          # The reader reproduces under the toolchain the crash was found on.
          # Sanitizer codegen moves between nightlies, and a floating channel
          # can fail to reproduce it.
          NIGHTLY: ${{ steps.rust.outputs.toolchain }}
          # Space-separated, as the run step's `::error::` line lists them.
          CRASHED: ${{ steps.run.outputs.crashed }}
        run: |
          set -euo pipefail
          where=$'Build, CI, or the examples\n\nThe `Fuzz targets` job of the nightly scheduled run.'
          version="\`main\` at $SHA"
          # Output is cut to its tail, which can miss every crashed target but
          # the last, so the names go here.
          if [ -n "$CRASHED" ]; then
            which="Fuzz target(s) \`${CRASHED// /\`, \`}\` exited"
          else
            which="A fuzz target exited"
          fi
          what="$which non-zero on the [nightly run]($RUN_URL). Each crashing input is attached to the run as the \`fuzz-artifacts\` artifact. Output is the end of the crashed targets' output, each part headed \`==> <target> <==\`."
          expected="Every target runs for ${MAX_TOTAL_TIME}s without a crash. Reproduce it against the downloaded file with \`cargo +${NIGHTLY} fuzz run <target> <path-to-the-input>\`. A panic on malformed bytes is a bug in the decoder, so the fix goes with a unit test in the crate that owns it. Keep the input under \`fuzz/corpus/<target>/\` so the case stays covered."
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/fuzz.log"
          again="Still failing at $SHA. $which non-zero on the [nightly run]($RUN_URL)."
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file logs="$RUNNER_TEMP/fuzz.log"
      - name: Report the failure as an issue
        if: failure() && steps.run.conclusion == 'failure'
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] A fuzz target found a crashing input"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  minimal-versions:
    name: Declared version floors build
    runs-on: ubuntu-latest
    if: inputs.tier != 'docs'
    # Builds every direct dependency at its requirement's lowest version. A red
    # run means a floor is fiction: raise it to what builds, do not lower it to
    # pass.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain-file: .github/toolchains/nightly/rust-toolchain.toml
          shared-key: minimal-versions
      - name: Resolve every direct dependency to its declared floor
        id: resolve
        run: |
          set -o pipefail
          rc=0
          cargo generate-lockfile -Z direct-minimal-versions 2>&1 | tee "$RUNNER_TEMP/floors.log" || rc=$?
          exit "$rc"
      # `--all-targets` holds dev-dependency floors to the same standard. Not
      # `-D warnings`: the minimal graph surfaces other people's deprecations.
      - id: check
        run: |
          set -o pipefail
          rc=0
          cargo check --workspace --all-targets --all-features --locked 2>&1 | tee "$RUNNER_TEMP/floors.log" || rc=$?
          exit "$rc"

      # xtask builds against the committed `Cargo.lock`, which the resolve step
      # replaced with the floors.
      - name: Write the issue body
        if: failure() && (steps.resolve.conclusion == 'failure' || steps.check.conclusion == 'failure')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git checkout -- Cargo.lock
          where=$'Build, CI, or the examples\n\nThe `Declared version floors build` job of the nightly scheduled run.'
          version="\`main\` at $SHA"
          what="The workspace no longer builds when every direct dependency is resolved to the lowest version its requirement admits, on the [nightly run]($RUN_URL)."
          expected='Every direct dependency builds at its floor. Raise the offending floor in [workspace.dependencies] to a version that builds. Do not lower it back to make this pass: the floor is a promise to consumers, and a green run is what makes it true.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/floors.log"
          again="Still failing at $SHA, in the [nightly run]($RUN_URL)."
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file logs="$RUNNER_TEMP/floors.log"
      - name: Report the failure as an issue
        if: failure() && (steps.resolve.conclusion == 'failure' || steps.check.conclusion == 'failure')
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] Declared version floors no longer build"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  publish-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    if: inputs.tier != 'docs'
    # The backstop for the manifest-selected gate in release-checks.yml: a
    # packaging break can arrive with nothing in this repository changing (a
    # yank, a toolchain release). The release's tools drift the same way: `gh` comes
    # from the runner image, and `cargo-about` and `cargo-cyclonedx` from the
    # `taiki-e/install-action` pin in setup-rust.
    # The rehearsal runs every build script and proc macro with this job's
    # token, so the job holds no write scope. `publish-dry-run-report` files
    # the issue from the outputs and the log below.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 60
    outputs:
      version-failed: ${{ steps.version.conclusion == 'failure' }}
      dry-run-failed: ${{ steps.dry-run.conclusion == 'failure' }}
      next: ${{ steps.version.outputs.next }}
    steps:
      # The full history and tags: `derive` reads the newest tag and counts
      # the commits since it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about,cargo-cyclonedx
          shared-key: publish

      # The night after a release, before anything merges, `derive` refuses
      # with "no commits since vX.Y.Z": there is no release to rehearse,
      # which is not a failure. The tag and the count are xtask's own rules
      # (`last_tag`, `derive`), so this skips exactly where `derive` would
      # refuse for that reason. A checkout with no tag does not skip, since
      # `..HEAD` counts nothing; `derive` fails it instead.
      - name: Derive the version to rehearse
        id: version
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n 1p)
          if [ -n "$tag" ] && [ "$(git rev-list --no-merges --count "$tag..HEAD")" = 0 ]; then
            echo "::notice::No commits since $tag, so there is no release to rehearse."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          next=$(cargo xtask release version derive 2>>"$RUNNER_TEMP/publish.log") || rc=$?
          cat "$RUNNER_TEMP/publish.log" >&2
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "next=$next" >>"$GITHUB_OUTPUT"

      # `--stand-in-post` commits a draft post in the rehearsal's worktree
      # when the version is a minor with no post yet, since a minor release
      # needs its post committed first (website/blog/README.md).
      - name: Rehearse the release
        id: dry-run
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -o pipefail
          rc=0
          cargo xtask release dry-run --version "$NEXT" --stand-in-post 2>&1 | tee -a "$RUNNER_TEMP/publish.log" || rc=$?
          exit "$rc"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-log
          path: ${{ runner.temp }}/publish.log
          # A skipped night or a failed checkout writes no log.
          if-no-files-found: ignore

  # Gated on the named steps' outputs as well as the result, so a checkout
  # failure files no issue asserting the release no longer assembles. The
  # version step gets the neutral title: its failures are the history, the
  # tooling or the network, before any release step ran. A skipped night
  # fails no step, so it files nothing.
  publish-dry-run-report:
    name: Report the release dry run
    runs-on: ubuntu-latest
    needs: publish-dry-run
    if: >-
      always() &&
      needs.publish-dry-run.result == 'failure' &&
      (needs.publish-dry-run.outputs.version-failed == 'true' ||
       needs.publish-dry-run.outputs.dry-run-failed == 'true')
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is for xtask, which writes the body.
      - uses: ./.github/actions/setup-rust
        with:
          # The entry ci.yml's `changes` job owns.
          shared-key: xtask
          cache-save: never
      - name: Download the log
        # No `run-id:` and no `github-token:`: scoped to this run.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-log
          path: ${{ runner.temp }}
      - name: Write the issue body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          VERSION_FAILED: ${{ needs.publish-dry-run.outputs.version-failed }}
          NEXT: ${{ needs.publish-dry-run.outputs.next }}
        run: |
          set -euo pipefail
          if [ "$VERSION_FAILED" = "true" ]; then
            what="Deriving the next version failed on the [nightly run]($RUN_URL) before the rehearsal started, so this says nothing about whether a release would succeed."
          else
            what="\`cargo xtask release dry-run --version $NEXT --stand-in-post\` failed on the [nightly run]($RUN_URL). It runs \`assemble\` and \`prepare\` as a release does, and prints the pushes, pull request changes and uploads instead of making them."
          fi
          where=$'Build, CI, or the examples\n\nThe `Release dry run` job of the nightly scheduled run.'
          version="\`main\` at $SHA"
          # shellcheck disable=SC2016
          expected='The release assembles, packages and stages its SBOMs at the version the history derives. A failure here stops the next release in `assemble`, or in `prepare` before anything is published. With nothing changed in this repository, a failure in `gh`, `cargo about` or `cargo cyclonedx` points at the runner image or the `taiki-e/install-action` pin. To reproduce it, follow "Rehearse it first" in RELEASING.md with `GH_REPO` set and `--stand-in-post` passed, as this job runs it. If the output shows a network error, rerun the job first.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/publish.log"
          again="Still failing at $SHA, in the [nightly run]($RUN_URL)."
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file logs="$RUNNER_TEMP/publish.log"
      # Runs after a failed download or body step too, so a missing log or a
      # toolchain that cannot build xtask still leaves an issue.
      - name: Report the failure as an issue
        if: ${{ !cancelled() }}
        uses: ./.github/actions/file-issue
        with:
          title: >-
            ${{ needs.publish-dry-run.outputs.version-failed == 'true'
              && '[bug] Nightly release rehearsal could not run'
              || '[bug] The nightly release dry run fails' }}
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  docs-build:
    name: Build site for deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The artifact this uploads is what docs-deploy publishes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Docusaurus can derive per-page "last updated" times.
          fetch-depth: 0
          # The benchmark data the site renders under /benchmarks.
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: docs

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # After `npm ci`, not before: npm ci removes node_modules, so a cache
      # restored earlier is deleted and the step silently does nothing. The only
      # job that *writes* this entry.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: docusaurus-${{ runner.os }}-

      # SWC strips types without checking them, so the build alone does not.
      - name: Typecheck the site
        working-directory: website
        run: npm run typecheck

      - name: Test the site
        working-directory: website
        run: npm test

      - name: Build Docusaurus site
        working-directory: website
        env:
          CI: "true"
        run: npm run build

      - name: Site is complete
        run: cargo xtask site-check

      # The deploy job has no checkout, so the config ships in the artifact.
      # `if-no-files-found` tests the whole `path:` list at once and
      # wrangler.jsonc always matches it, so the step above is what stops an
      # empty build reaching the deploy.
      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: |
            website/build
            website/wrangler.jsonc
          if-no-files-found: error

  docs-deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [docs-build]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
      url: https://spate.kainth.dev
    # Serialize production deploys; don't cancel an in-progress publish.
    concurrency:
      group: cloudflare-workers
      cancel-in-progress: false
    # No `actions/checkout` and no restored cache. The only job holding a
    # production credential; it must never share a workspace with repository
    # code or restored build state. Keep it that way.
    steps:
      - name: Download site artifact
        # No `run-id:` and no `github-token:`: scoped to this run.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: website

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        # This step runs an unlockfiled `npm i wrangler` *after* putting
        # CLOUDFLARE_API_TOKEN in the environment, with lifecycle scripts on.
        # website/.npmrc cannot reach it; npm reads this from the environment.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 3 is end-of-life, and the higher file-count limit needs 4.34.
          wranglerVersion: "4"
          # Creates the Worker and attaches its custom domain. The token needs
          # Workers Scripts edit on the account, and Workers Routes plus DNS
          # edit on the zone.
          command: deploy --config website/wrangler.jsonc

  release-verify:
    name: Verify the latest release
    runs-on: ubuntu-latest
    if: inputs.tier != 'docs'
    timeout-minutes: 30
    # A published release cannot change, so a failure here means `gh`,
    # crates.io or the GitHub API moved or was unreachable, the tag's xtask no
    # longer builds, or the newest tag has no published, immutable release.
    # `finish` makes most of the same calls, and this surfaces the change
    # before a release depends on it.
    permissions:
      contents: read
      attestations: read
      issues: write
    steps:
      # Full history for the tags. This checkout holds the composite actions
      # and the xtask that writes the issue body.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The rule xtask's `last_tag` applies, so this checks the release the
      # next one is derived from.
      - id: tag
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n 1p)
          if [ -z "$tag" ]; then
            echo "::error::No vX.Y.Z tag in the checkout, so there is no release to verify."
            exit 1
          fi
          { echo "tag=$tag"; echo "version=${tag#v}"; } | tee -a "$GITHUB_OUTPUT"

      # `verify` refuses any tree but a clean checkout of the tagged commit and
      # reads the crate set from it. xtask reads the tree it was built in, so
      # the tag's own xtask has to run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: release
          persist-credentials: false
      # No shared key: the build lands in `release/target`, which no cache
      # entry covers.
      - uses: ./.github/actions/setup-rust

      # Apart from `verify`, so a build failure files no issue.
      - name: Build the tag's xtask
        working-directory: release
        run: cargo build -p spate-xtask --locked

      - id: verify
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -o pipefail
          rc=0
          cargo xtask release verify "$VERSION" 2>&1 | tee "$RUNNER_TEMP/verify.log" || rc=$?
          exit "$rc"

      # Gated on the verify step: a checkout, setup or build failure would
      # otherwise file an issue asserting the release no longer verifies.
      - name: Write the issue body
        if: failure() && steps.verify.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          where=$'Build, CI, or the examples\n\nThe `Verify the latest release` job of the nightly scheduled run.'
          version="\`$TAG\`, from the nightly run at \`main\` $SHA"
          what="\`cargo xtask release verify $VERSION\` failed against \`$TAG\` on the [nightly run]($RUN_URL)."
          # Single quotes: the backticks must reach GitHub rather than run as
          # command substitutions.
          # shellcheck disable=SC2016
          expected='The newest release verifies: every crate came from the tagged commit, its provenance and SBOM attestations verify, and the GitHub release is immutable, attested and complete. A published release cannot change, so a failure with nothing changed points at `gh`, crates.io or the GitHub API, and the next release meets most of the same calls in `finish`. It also fails when the newest tag has no published, immutable release, which a `finish` that stopped between pushing the tag and publishing the release leaves until it is re-run. Reproduce it from a clean checkout of the tag with `cargo xtask release verify X.Y.Z`. If the output shows a network error, rerun the job first.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected" \
            --answer-file logs="$RUNNER_TEMP/verify.log"
          again="Still failing against \`$TAG\` at $SHA, in the [nightly run]($RUN_URL)."
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again" \
            --answer-file logs="$RUNNER_TEMP/verify.log"
      - name: Report the failure as an issue
        if: failure() && steps.verify.conclusion == 'failure'
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] The latest release no longer verifies"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md

  loom:
    name: Loom models (spate-core)
    runs-on: ubuntu-latest
    # INV-3 against a moving compiler: `setup-rust` installs the stable
    # channel, so this runs the models on whatever stable shipped that day.
    if: inputs.tier != 'docs'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: loom
      # Doc tests compiled under `--cfg loom` construct loom-typed primitives
      # outside a model and abort, so the models run `--lib` only on the built-in
      # harness. Do not move this onto nextest.
      - run: cargo xtask loom

  examples-containers:
    name: Example container tier
    runs-on: ubuntu-latest
    # The only thing driving a shipped example binary through SIGTERM and a real
    # drain.
    if: inputs.tier != 'docs'
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: nextest
          # Same key as containers.yml's container job: both build the plain
          # dev-profile test binaries for the `#[ignore]`d suites.
          shared-key: docker
      # `--ignore-default-filter` plus an explicit expression is what selects a
      # suite the profile excludes; the filter alone leaves nothing to run.
      - name: Example container tier
        run: >
          cargo nextest run --profile docker -p spate --all-features --locked
          --run-ignored ignored-only -E 'binary(e2e_examples)'
          --ignore-default-filter --test-threads 1

      - name: Publish example container test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: target/nextest/docker/junit.xml
          check_name: Example container test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          fail_on_failure: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-nextest-examples
          path: target/nextest/docker/junit.xml

  # ===========================================================================
  # Catch-all failure reporting. `attribution`, `advisories`, `osv`, `fuzz`,
  # `minimal-versions`, `publish-dry-run` (through `publish-dry-run-report`) and
  # `release-verify` file their own issues and are absent from `needs` below so
  # they are not reported twice.
  # ===========================================================================
  report:
    name: Report nightly failures
    runs-on: ubuntu-latest
    needs:
      - docs-build
      - docs-deploy
      - loom
      - examples-containers
    # A `docs` dispatch skips the nightly jobs, and a skipped job is not a failure.
    if: always() && contains(needs.*.result, 'failure')
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is for xtask, which writes the body.
      - uses: ./.github/actions/setup-rust
        with:
          # The entry ci.yml's `changes` job owns.
          shared-key: xtask
          cache-save: never
      - name: Write the issue body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(echo "$RESULTS" | jq -r '
            to_entries | map(select(.value.result == "failure")) | .[].key' | sort | tr '\n' ' ')
          where=$'Build, CI, or the examples\n\nThe nightly run, in a job that files no issue of its own.'
          version="\`main\` at $SHA"
          what="Failed jobs on the [nightly run]($RUN_URL): ${failed}"
          expected='Every job passes. The nightly run detects the world changing underneath a static tree, so a failure here is usually not caused by the last commit. Check the run before assuming a regression.'
          cargo xtask bug-report --out "$RUNNER_TEMP/body.md" \
            --answer components="$where" \
            --answer version="$version" \
            --answer what="$what" \
            --answer expected="$expected"
          again="Still failing at $SHA. Failed jobs on the [nightly run]($RUN_URL): ${failed}"
          cargo xtask bug-report --out "$RUNNER_TEMP/comment.md" \
            --answer what="$again"
      # Runs after a failed body step too, so a toolchain that cannot build
      # xtask still leaves an issue.
      - name: Open or update the tracking issue
        if: ${{ !cancelled() }}
        uses: ./.github/actions/file-issue
        with:
          title: "[bug] Nightly run is failing"
          body-file: ${{ runner.temp }}/body.md
          comment-file: ${{ runner.temp }}/comment.md
