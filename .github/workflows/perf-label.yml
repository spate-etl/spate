name: Performance label

# Syncs the `affects-performance` label from the flag artifact ci.yml's report
# step writes. `make check-perf-report` holds the write side of that contract.
#
# `workflow_run` because the halves cannot share a job: the benches run the pull
# request's code under a read-only token, and labelling is a write. This half
# runs the default branch's definition, checks out nothing, reads one
# fork-influenceable input, and may write exactly one label. Keep it that way.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: perf-label-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  label:
    name: Sync the affects-performance label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A failed or cancelled run does nothing here: a label from an earlier
    # benched push persists rather than being stripped by an unbenched one.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      # `run-id:` makes this a cross-run download, an actions-scoped read.
      actions: read
      pull-requests: write
    steps:
      # A missing artifact is normal when the paths never selected
      # `perf-counters`; the sync step skips and the label keeps its state.
      - name: Download the regression flag
        id: flag
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-regressions
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # `gh pr edit` resolves labels through GraphQL. On a scope rejection:
      #   gh api -X POST   "repos/$REPO/issues/$pr/labels" -f 'labels[]=...'
      #   gh api -X DELETE "repos/$REPO/issues/$pr/labels/..."
      - name: Sync the label
        if: steps.flag.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PERF_LABEL: "affects-performance"
        run: |
          set -euo pipefail
          # The head SHA is trusted event payload; resolving through the API
          # keeps the artifact and `workflow_run.pull_requests` out of the
          # decision, the latter being empty on forks and stacked on siblings.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            | jq -r --arg sha "$HEAD_SHA" \
                '[.[] | select(.state == "open" and .head.sha == $sha)][0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "no open pull request heads $HEAD_SHA (closed, or superseded by a newer push); nothing to sync"
            exit 0
          fi
          flag=$(tr -d '[:space:]' <has_regressions)
          case "$flag" in
            true) gh pr edit "$pr" --repo "$REPO" --add-label "$PERF_LABEL" ;;
            false) gh pr edit "$pr" --repo "$REPO" --remove-label "$PERF_LABEL" ;;
            *) echo "::warning::unrecognized regression flag content; leaving labels alone" ;;
          esac
