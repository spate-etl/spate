name: Perf

# The instruction-count tier: cache warming, one job per shard and the report.
# Called from ci.yml, whose `changes` job computes every input.
on:
  workflow_call:
    inputs:
      bench:
        type: string
        required: true
      bench-shards:
        type: string
        required: true

permissions:
  contents: read

jobs:
  # The instruction-count tier: one shard per (package, feature arm,
  # architecture). gungraun's summary path carries no feature component, so two
  # feature builds of one bench in one workspace overwrite each other's summary
  # and baseline, silently.
  perf-warm:
    name: Warm the counter-tier build cache (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # `main` only: rust-cache writes from `main` alone.
    if: github.event_name == 'push' && inputs.bench == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # rust-cache keys its entry by architecture, so each architecture needs a
      # leg to own it. These are the `(arch, runner)` pairs the shards carry.
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-26.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Its own entry, not `release`: these pull each benched crate's
          # dev-dependencies and the gungraun harness.
          shared-key: bench
      - name: Build every bench arm
        env:
          BENCH_SHARDS: ${{ inputs.bench-shards }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Materialised and counted, not streamed: a `while read` whose producer
          # died iterates zero times and exits 0, having warmed nothing.
          jq -r --arg arch "$ARCH" \
            '.[] | select(.arch == $arch) | [.package, .cargo_features] | @tsv' \
            <<<"$BENCH_SHARDS" >arms.tsv
          arms=$(wc -l <arms.tsv)
          if [[ "$arms" -eq 0 ]]; then
            echo "::error::the bench matrix is empty; there is nothing to warm"
            exit 1
          fi
          echo "warming $arms arm(s)"
          built=0
          while IFS=$'\t' read -r package cargo_features; do
            [[ -n "$package" ]] || continue
            cargo xtask bench gungraun --features "$cargo_features" --check "$package"
            built=$((built + 1))
          done <arms.tsv
          if [[ "$built" -ne "$arms" ]]; then
            echo "::error::warmed $built of $arms arm(s)"
            exit 1
          fi

  perf-counters:
    name: Instruction counts (${{ matrix.package }} / ${{ matrix.arm }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The second clause is required: a matrix expanding to zero jobs is a
    # workflow-level error, and a false `if:` is what prevents the expansion.
    if: inputs.bench == 'true' && inputs.bench-shards != '[]'
    timeout-minutes: 45
    env:
      VALGRIND_VERSION: 3.27.1
      VALGRIND_SHA256: 5d589152eb8071c02feab8ce6ab719e431a1fbc3e2b1700f5432632a8b9264dc
    strategy:
      # fail-fast would cancel the other legs, and a cancelled leg fails `CI gate`
      # as a failure does, so one real failure would read as several.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.bench-shards) }}
    # Advisory in what it reports, blocking in whether it ran: a moved count does
    # not fail a merge, and this unit's caller stays in `CI gate`'s `needs:` so a
    # bench that stops building does.
    steps:
      # Full history: the merge base has to be resolvable and checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: bench
          # A pure consumer of the entry `perf-warm` owns.
          cache-save: never

      # The version is part of the measurement: valgrind emulates CPUID on
      # x86_64 and masks `AT_HWCAP` on aarch64, so changing `VALGRIND_VERSION`
      # can move a count. Built from source because Ubuntu 24.04's apt valgrind
      # 3.22 can load no symbols or CFI for a bench binary whose two RW segments
      # abut (valgrind bug 492663, fixed in 3.24), and DHAT then records frames
      # gungraun-runner rejects.
      - name: Cache valgrind
        id: valgrind-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valgrind
          key: valgrind-${{ runner.os }}-${{ runner.arch }}-${{ env.VALGRIND_VERSION }}

      - name: Build valgrind
        if: steps.valgrind-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output valgrind.tar.bz2 \
            "https://sourceware.org/pub/valgrind/valgrind-$VALGRIND_VERSION.tar.bz2"
          echo "$VALGRIND_SHA256  valgrind.tar.bz2" | sha256sum --check --strict
          tar -xjf valgrind.tar.bz2
          cd "valgrind-$VALGRIND_VERSION"
          ./configure --prefix="$HOME/.valgrind"
          make -j"$(nproc)"
          make install

      - name: Put valgrind on PATH
        run: |
          set -euo pipefail
          echo "$HOME/.valgrind/bin" >>"$GITHUB_PATH"
          "$HOME/.valgrind/bin/valgrind" --version

      # Its own step because it is also the cache key below.
      - name: Resolve the gungraun-runner version
        id: runner-version
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "gungraun") | .version')
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Built from source: install-action has no checksummed prebuilt for it.
      # The key names the architecture and no shard, so each architecture's
      # legs share one entry.
      - name: Cache gungraun-runner
        id: runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gungraun/bin
          key: gungraun-runner-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-version.outputs.version }}

      - name: Install gungraun-runner
        if: steps.runner-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.runner-version.outputs.version }}
        run: |
          set -euo pipefail
          cargo install gungraun-runner --version "$VERSION" --locked --root ~/.gungraun

      - name: Put gungraun-runner on PATH
        run: echo "$HOME/.gungraun/bin" >>"$GITHUB_PATH"

      # This leg runs the merge base's own copy of the bench runner, the head leg
      # the head's. A non-default arm probes first: a base predating the feature
      # axis measures the default arm and the delta is arm mismatch.
      - name: Measure the merge base
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base HEAD^1 HEAD^2)
          git checkout --quiet --detach "$merge_base"
          # A restored cargo cache's counter output would become the comparison.
          rm -rf target/gungraun
          measured=false
          # A merge base predating the command has no runner to measure with.
          # `--help` answers 0 where the command exists, which separates it from
          # the usage exit the argument probe below reads.
          runner=()
          if cargo xtask bench gungraun --help >/dev/null 2>&1; then
            runner=(cargo xtask bench gungraun)
          fi
          if [[ "${#runner[@]}" -eq 0 ]]; then
            # Names the cause: a rename would disable every baseline while CI
            # stayed green.
            echo "no baseline: the merge base carries no bench gungraun command"
          else
            args=()
            probe=2
            if [[ -n "$CARGO_FEATURES" ]]; then
              args=(--features "$CARGO_FEATURES")
              set +e
              "${runner[@]}" "${args[@]}" \
                --run __no_such_package__ >/dev/null 2>&1
              probe=$?
              set -e
            fi
            if [[ "$probe" -ne 2 ]]; then
              echo "no baseline: the merge base's ${runner[*]} does not take --features (probe exit $probe)."
              echo "It would build the default arm while this shard builds '$ARM', and two arms are not comparable."
            else
              set +e
              GUNGRAUN_SAVE_BASELINE=base "${runner[@]}" \
                ${args[@]+"${args[@]}"} --run "$PACKAGE"
              rc=$?
              set -e
              case "$rc" in
                0) measured=true ;;
                2) echo "no baseline: the merge base has no bench for $PACKAGE" ;;
                *) echo "no baseline: a bench failed on the merge base (exit $rc)" ;;
              esac
              [[ "$measured" == "true" ]] || rm -rf target/gungraun
            fi
          fi
          git checkout --quiet --detach "$head_sha"
          {
            echo "measured=$measured"
            echo "merge-base=$merge_base"
          } >>"$GITHUB_OUTPUT"

      # Writes one summary per bench for the stamping step below to collect.
      - name: Instruction counts
        env:
          GUNGRAUN_SAVE_SUMMARY: json
          GUNGRAUN_BASELINE: ${{ steps.base.outputs.measured == 'true' && 'base' || '' }}
          PACKAGE: ${{ matrix.package }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -euo pipefail
          if [[ -z "$GUNGRAUN_BASELINE" ]]; then
            unset GUNGRAUN_BASELINE
            # Otherwise a restored cache or aborted base leg becomes the baseline.
            rm -rf target/gungraun
          fi
          cargo xtask bench gungraun --features "$CARGO_FEATURES" --run "$PACKAGE"

      # A gate, not a measurement: a bench whose collected region measured the
      # allocator reports a plausible number through every other signal, and that
      # number becomes a baseline later comparisons inherit. Head leg only.
      - name: Reject a degenerate collected region
        env:
          SHARD: ${{ matrix.package }} (${{ matrix.arm }}, ${{ matrix.arch }})
        run: cargo xtask bench region --shard "$SHARD"

      # A gungraun summary carries the package only as a directory path and
      # neither the feature arm nor the architecture, so shard identity is
      # stamped here for `cargo xtask bench report`. Empty `baseline` renders as
      # *no baseline*.
      #
      # The compiler is stamped alongside it. Codegen moves a count, and both
      # legs of this job run under one toolchain.
      - name: Stamp this shard's summaries
        env:
          PACKAGE: ${{ matrix.package }}
          ARM: ${{ matrix.arm }}
          ARCH: ${{ matrix.arch }}
          BASE_MEASURED: ${{ steps.base.outputs.measured }}
          MERGE_BASE: ${{ steps.base.outputs.merge-base }}
          RUSTC: ${{ steps.rust.outputs.rustc }}
        run: |
          set -euo pipefail
          if [[ ! -d target/gungraun ]]; then
            echo "::error::$PACKAGE ($ARM, $ARCH) ran its benches but wrote no target/gungraun"
            exit 1
          fi
          find target/gungraun -name summary.json -exec cat {} + >raw.jsonl
          if [[ ! -s raw.jsonl ]]; then
            echo "::error::$PACKAGE ($ARM, $ARCH) wrote no summary.json; GUNGRAUN_SAVE_SUMMARY may no longer be honoured"
            exit 1
          fi
          if [[ "$BASE_MEASURED" == "true" ]]; then
            baseline="main @ ${MERGE_BASE:0:12}"
          else
            baseline=""
          fi
          mkdir -p shard
          jq -c --arg p "$PACKAGE" --arg a "$ARM" --arg b "$baseline" \
            --arg r "$RUSTC" --arg h "$ARCH" \
            '. + {spate_shard: {package: $p, features: $a, baseline: $b, rustc: $r, arch: $h}}' \
            raw.jsonl >"shard/$PACKAGE.$ARM.jsonl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-summaries-${{ matrix.package }}-${{ matrix.arm }}-${{ matrix.arch }}
          path: shard/
          if-no-files-found: error

  perf-report:
    name: Instruction count report
    runs-on: ubuntu-latest
    needs: perf-counters
    # A failed shard still leaves its siblings' measurements worth rendering.
    if: ${{ !cancelled() && inputs.bench == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: xtask
          cache-save: never

      # Own directory per shard, so identically named files do not collide.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-summaries-*
          path: shards

      # Writes `has_regressions` for `perf-label.yml`, exiting 0 on a moved
      # metric. `continue-on-error` here, not on the job.
      - name: Report instruction counts
        id: report
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p shards
          find shards -name '*.jsonl' -exec cat {} + >gungraun-summaries.jsonl
          mkdir -p perf-regressions
          cargo xtask bench report \
            --regressions-out perf-regressions/has_regressions \
            gungraun-summaries.jsonl "baseline" >>"$GITHUB_STEP_SUMMARY"

      # The one output crossing into `perf-label.yml`. The markdown stays in the
      # step summary; nothing fork-authored is re-posted by a privileged
      # workflow. Gated on the report's outcome: a dead report writes no flag.
      - name: Upload the regression flag
        if: github.event_name == 'pull_request' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-regressions
          path: perf-regressions/has_regressions
