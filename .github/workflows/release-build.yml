name: Release build

# Packages the release commit and attests what it packaged, called by the
# publish in release.yml. The attestations are signed by this file's identity
# rather than the caller's, which is what makes the provenance SLSA Build L3:
# the caller cannot alter how the build or its provenance is produced, and a
# consumer verifies against this workflow with `--signer-workflow`.
#
# Renaming this file changes the signer every published verification command
# names; RELEASING.md and `cargo xtask release verify-artifacts` name it too.
on:
  workflow_call:
    outputs:
      version:
        description: The version the release commit names.
        value: ${{ jobs.package.outputs.version }}
      pending:
        description: How many crates are still to publish.
        value: ${{ jobs.package.outputs.pending }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package and attest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Signs the attestations with this workflow's OIDC identity.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      pending: ${{ steps.prepare.outputs.pending }}
      crates: ${{ steps.prepare.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache: the job that signs the provenance restores nothing
      # another workflow wrote.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-cyclonedx

      - name: Prepare and stage
        id: prepare
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: cargo xtask release prepare --out "$RUNNER_TEMP/release"

      # One attestation whose subjects are every packaged crate and the
      # checksum list, so SHA256SUMS on the release is itself attested.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        if: steps.prepare.outputs.pending != '0'
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.crate
            ${{ runner.temp }}/release/SHA256SUMS

      - name: Keep the provenance bundle with the artifacts
        if: steps.prepare.outputs.pending != '0'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/release/provenance.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: Attest the SBOM of ${{ matrix.crate }}
    needs: package
    if: needs.package.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        crate: ${{ fromJSON(needs.package.outputs.crates) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release

      # The SBOM goes in as the predicate rather than through `sbom-path`:
      # generated with SOURCE_DATE_EPOCH it carries no serialNumber, which the
      # action's CycloneDX detection requires. The predicate type is the same.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: sbom
        with:
          subject-path: ${{ runner.temp }}/release/${{ matrix.crate }}-${{ needs.package.outputs.version }}.crate
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ runner.temp }}/release/${{ matrix.crate }}-${{ needs.package.outputs.version }}.cdx.json

      - name: Keep the SBOM bundle
        env:
          BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          CRATE: ${{ matrix.crate }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$BUNDLE" "$RUNNER_TEMP/bundle/sbom-$CRATE.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.crate }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 90
