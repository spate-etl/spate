name: Release

# Two jobs with different jobs to do, deliberately split rather than run as one
# `release-plz` invocation:
#
#   release-pr — keeps a pull request open that bumps versions. Reopened and
#                rewritten on every push to `main`.
#   release    — publishes to crates.io and tags, but only once the versions in
#                the tree are ahead of what is on the registry, which is only
#                true after that pull request merges.
#
# Both run on every push to `main`, and `release` no-ops on the ones that are
# not a merged release pull request. `release_always = false` in
# release-plz.toml is what makes that no-op safe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never two of these at once: both mutate the same branch state, and a second
# run started mid-publish could tag a version the first is still uploading.
# `cancel-in-progress` stays false for the same reason — a half-finished
# publish must be allowed to finish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A GitHub App token, not GITHUB_TOKEN, and this is the whole reason the
      # app exists: events raised by GITHUB_TOKEN do not trigger workflows, so a
      # release pull request opened with it would never run CI. `ci-gate` is a
      # required check, so that pull request would then be permanently
      # unmergeable — the automation would produce exactly one artifact, and it
      # would be a dead end.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without these the token carries whatever the installation was
          # granted, which is a strictly larger set than this job needs. It
          # pushes a branch and opens a pull request; that is all it may do.
          permission-contents: write
          permission-pull-requests: write

      # Full history: release-plz reads the commits since the last release to
      # decide the bump, and a shallow clone would silently under-report it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # crates.io Trusted Publishing. release-plz exchanges this OIDC token for
      # a short-lived registry token itself, which is why there is no
      # CARGO_REGISTRY_TOKEN secret anywhere in this repository — there is no
      # long-lived credential to leak, and crates.io is configured to refuse
      # token-authenticated publishes for these crates outright.
      id-token: write
    environment:
      name: crates-io
      url: https://crates.io/crates/spate
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Tags and opens the GitHub release, so contents is write. It only
          # reads pull requests, to work out what went into the release.
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release

      # Publishes in dependency order, tags, and opens the GitHub release. It
      # no-ops unless the tree's versions are ahead of the registry, so the
      # pushes that are not a merged release pull request cost one no-op.
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
