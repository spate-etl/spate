name: Release

# Two phases handing off through a squash merge. `assemble` runs on the
# workflow_dispatch carrying the version, builds the single release commit and
# opens an auto-merging pull request; `build` and `publish` run on the push
# that merge produces. `build` calls release-build.yml, which packages and
# attests; `publish` verifies those attestations and does everything that
# touches the registry. The sequence lives
# in xtask/src/release/ and `cargo xtask release dry-run` runs it locally; this
# file adds the credentials and the OIDC exchange. RELEASING.md is the account
# of the whole process.
#
# The crates.io trusted publisher is bound to this repository, this filename
# and the `crates-io` environment name. Renaming any of the three breaks the
# OIDC exchange until the publisher configuration is updated to match.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, as X.Y.Z. Checked against the derivation:
          a changelog fragment opening with **Breaking:**, or a raised
          rust-version, means a minor bump, anything else a patch. The run
          fails when the two disagree.
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  assemble:
    name: Assemble the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dispatch only, from main only. Skipped when the release app is not
    # configured, as in every fork; keyed on the variable because `secrets`
    # is unavailable in a job-level `if:` and `vars` is.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_APP_ID != ''
    concurrency:
      group: release-assemble
      cancel-in-progress: false
    steps:
      # Events raised by GITHUB_TOKEN do not trigger workflows, so a release
      # pull request opened with it never runs CI and `CI gate`, a required
      # check, leaves it permanently unmergeable.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # It pushes a branch and opens a pull request; that is all it may do.
          permission-contents: write
          permission-pull-requests: write

      # Full history: the bump derivation reads every commit since the last
      # tag, and a shallow clone would silently under-report it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-rust's save-if writes a key only from `main`, so a pull request
      # cannot seed this cache. Reading is safe, and this job never writes it.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about
          shared-key: release
          cache-save: never

      - name: Assemble and open the release pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: cargo xtask release assemble --version "$VERSION"

  build:
    name: Build
    # The subject is matched rather than a tag, since the publish creates the
    # tag. Skipped rather than run-and-no-op, as the publish is.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release: v') &&
      vars.RELEASE_APP_ID != ''
    # No concurrency group: the build only reads the registry, and a group
    # here would let a second release's build queue ahead of this publish.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A second run started mid-publish could tag a version the first is still
    # uploading; `cancel-in-progress` stays false so a publish finishes. The
    # group sits on the job: skipped jobs never enter it, where a pending
    # workflow-level slot is replaced by the next push to `main`.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      # Trusted Publishing: crates-io-auth-action exchanges this for a
      # short-lived registry token, so no CARGO_REGISTRY_TOKEN exists in this
      # repository and crates.io refuses token-authenticated publishes for
      # these crates. The publisher matches this file, not release-build.yml.
      id-token: write
      # `gh workflow run` for the docs deploy at the end.
      actions: write
    # Entering the environment writes a deployment record, so it sits on the
    # job that needs its token and nowhere else.
    environment:
      name: crates-io
      url: https://crates.io/crates/spate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release
          cache-save: never

      # The crates, SBOMs and SHA256SUMS release-build.yml staged, with every
      # attestation bundle it produced.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      # Before any credential exists: the staged bytes match SHA256SUMS, each
      # one carries attestations signed by release-build.yml from main at this
      # commit, and this checkout packages the same bytes the upload will send.
      - name: Verify the artifacts
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: cargo xtask release verify-artifacts --dir "$RUNNER_TEMP/release"

      # Minted after all verification: the exchanged token lives 30 minutes,
      # fixed, and everything before this point needs none.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: needs.build.outputs.pending != '0'

      - name: Upload
        if: needs.build.outputs.pending != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo xtask release upload --artifacts "$RUNNER_TEMP/release"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Tags and opens the GitHub release; that is all it may do.
          permission-contents: write

      - name: Finish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
        run: cargo xtask release finish --artifacts "$RUNNER_TEMP/release"
