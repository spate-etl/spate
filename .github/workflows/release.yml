name: Release

# `release-pr` keeps a version-bump pull request open; `release` publishes and
# tags once the tree is ahead of the registry, which holds after that pull
# request merges. `release_always = false` is what makes the other no-ops safe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second run started mid-publish could tag a version the first is still
# uploading; `cancel-in-progress` stays false so a publish finishes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skipped when the release app is not configured, as in every fork. Keyed on
    # the variable because `secrets` is unavailable in a job-level `if:` and
    # `vars` is; the two are configured together.
    if: vars.RELEASE_APP_ID != ''
    steps:
      # Events raised by GITHUB_TOKEN do not trigger workflows, so a release pull
      # request opened with it never runs CI and `ci-gate`, a required check,
      # leaves it permanently unmergeable.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # It pushes a branch and opens a pull request; that is all it may do.
          permission-contents: write
          permission-pull-requests: write

      # Full history: release-plz reads the commits since the last release to
      # decide the bump, and a shallow clone would silently under-report it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `release_always = false` already stops the publish; this stops the *run*.
    # Without it every merge mints an unused App token and writes a `crates-io`
    # deployment record. The subject is matched rather than the tag, since this
    # job creates the tag; `pr_name` in release-plz.toml pins the other side.
    if: >-
      vars.RELEASE_APP_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'chore: release v'))
    permissions:
      contents: read
      # Trusted Publishing: release-plz exchanges this for a short-lived registry
      # token, so no CARGO_REGISTRY_TOKEN exists in this repository and crates.io
      # refuses token-authenticated publishes for these crates.
      id-token: write
    environment:
      name: crates-io
      url: https://crates.io/crates/spate
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Tags and opens the GitHub release; it only reads pull requests.
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
