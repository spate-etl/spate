name: Release

# Two phases handing off through a squash merge. `assemble` runs on the
# workflow_dispatch carrying the version, builds the single release commit and
# opens an auto-merging pull request; `publish` runs on the push that merge
# produces and does everything that touches the registry. The sequence lives
# in scripts/release.sh and `make release-dry-run` runs it locally; this file
# adds the credentials and the OIDC exchange. RELEASING.md is the account of
# the whole process.
#
# The crates.io trusted publisher is bound to this repository, this filename
# and the `crates-io` environment name. Renaming any of the three breaks the
# OIDC exchange until the publisher configuration is updated to match.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, as X.Y.Z. Checked against the derivation
          from history: any breaking marker since the last tag means a minor
          bump, anything else a patch. The run fails when the two disagree.
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  assemble:
    name: Assemble the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dispatch only, from main only. Skipped when the release app is not
    # configured, as in every fork; keyed on the variable because `secrets`
    # is unavailable in a job-level `if:` and `vars` is.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_APP_ID != ''
    concurrency:
      group: release-assemble
      cancel-in-progress: false
    steps:
      # Events raised by GITHUB_TOKEN do not trigger workflows, so a release
      # pull request opened with it never runs CI and `CI gate`, a required
      # check, leaves it permanently unmergeable.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # It pushes a branch and opens a pull request; that is all it may do.
          permission-contents: write
          permission-pull-requests: write

      # Full history: the bump derivation reads every commit since the last
      # tag, and a shallow clone would silently under-report it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-rust's save-if writes a key only from `main`, so a pull request
      # cannot seed this cache. Reading is safe; writing stays with the
      # publish job, which owns the key.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about@0.9.1
          shared-key: release
          cache-save: never

      - name: Assemble and open the release pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./scripts/release.sh assemble --version "$VERSION"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The subject is matched rather than a tag, since this job creates the
    # tag. Skipped rather than run-and-no-op: entering the `crates-io`
    # environment writes a deployment record, one per push to main otherwise.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore: release v') &&
      vars.RELEASE_APP_ID != ''
    # A second run started mid-publish could tag a version the first is still
    # uploading; `cancel-in-progress` stays false so a publish finishes. The
    # group sits on the job: skipped jobs never enter it, where a pending
    # workflow-level slot is replaced by the next push to `main`.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      # Trusted Publishing: crates-io-auth-action exchanges this for a
      # short-lived registry token, so no CARGO_REGISTRY_TOKEN exists in this
      # repository and crates.io refuses token-authenticated publishes for
      # these crates.
      id-token: write
      # `gh workflow run` for the docs deploy at the end.
      actions: write
    environment:
      name: crates-io
      url: https://crates.io/crates/spate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-rust's save-if writes a key only from `main`, which this push
      # is, so a pull request cannot seed this cache. A warm dependency graph
      # keeps the verify build well inside the job budget; the token is
      # minted after it either way.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release

      - name: Prepare
        id: prepare
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./scripts/release.sh prepare

      # Minted after all packaging work: the exchanged token lives 30
      # minutes, fixed, and everything before this point needs none.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.prepare.outputs.pending != '0'

      - name: Upload
        if: steps.prepare.outputs.pending != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDES: ${{ steps.prepare.outputs.excludes }}
          PENDING: ${{ steps.prepare.outputs.pending }}
        run: ./scripts/release.sh upload

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Tags and opens the GitHub release; that is all it may do.
          permission-contents: write

      - name: Finish
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh finish
