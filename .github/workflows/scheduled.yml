name: Scheduled

# Two tiers in one file, selected by which cron fired.
#
# What belongs here is narrow, and the rule is worth stating because it is easy
# to erode: the scheduled tier detects **the world changing underneath a static
# tree** — a new advisory, a yanked crate, a dependency floor that stopped
# building, a benchmark drifting. Anything whose job is to stop a change
# entering `main` belongs on the pull-request path in ci.yml, because a
# scheduled failure lands after the merge that caused it.
#
# This file replaces nightly.yml, which was `disabled_manually` and had never
# once been green: its single run (2026-07-06) had five jobs, of which three
# were broken on arrival — Miri ran six hours with no `timeout-minutes` and hit
# the 360-minute default cap, the container job named a test target that did not
# exist, and the bench job passed criterion arguments to a non-criterion target.
# Every job below carries a real timeout, and none of it is load-bearing until a
# `workflow_dispatch` run has proven it green.
on:
  schedule:
    # Minutes deliberately off the hour: scheduled runs queue at peak, and the
    # top of the hour is the peak.
    - cron: "17 3 * * *" # nightly
    - cron: "43 4 * * 1" # weekly, Monday
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run.
        type: choice
        default: nightly
        options: [nightly, weekly, both]

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the measurement behind these; the constraint is the same
  # here, and the bench job's release profile is the one that links the most.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

permissions:
  contents: read

# The old file had none, so a manual dispatch could race the cron and two runs
# would fight over the criterion baseline cache. Never cancels: a half-finished
# deploy or a half-written baseline is worse than a queued run.
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nightly: ${{ steps.select.outputs.nightly }}
      weekly: ${{ steps.select.outputs.weekly }}
    steps:
      - id: select
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TIER: ${{ inputs.tier }}
        run: |
          nightly=false
          weekly=false
          case "${SCHEDULE:-}" in
            "17 3 * * *") nightly=true ;;
            "43 4 * * 1") weekly=true ;;
          esac
          case "${TIER:-}" in
            nightly) nightly=true ;;
            weekly)  weekly=true ;;
            both)    nightly=true; weekly=true ;;
          esac
          # The cron strings above are duplicated from `on: schedule:`, and
          # nothing in GitHub Actions can derive one from the other. Editing one
          # copy and not the other would otherwise select no tier at all: every
          # job skips, and a run in which nothing happened reports green — the
          # exact silent-success failure this whole file is being rebuilt to
          # avoid. So say so out loud instead.
          if [ "$nightly" = false ] && [ "$weekly" = false ]; then
            echo "::error::No tier selected (schedule='${SCHEDULE:-}', tier='${TIER:-}')."
            echo "::error::The cron strings here must match the ones in 'on: schedule:'."
            exit 1
          fi
          { echo "nightly=$nightly"; echo "weekly=$weekly"; } | tee -a "$GITHUB_OUTPUT"

  # ===========================================================================
  # NIGHTLY
  # ===========================================================================
  attribution:
    name: Attribution inventory
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 20
    # THIRD-PARTY.md is derived from Cargo.lock, and it used to be diff-gated on
    # every pull request. That was the wrong place for it. The licence *verdict*
    # is `cargo deny check licenses`, which still runs on every pull request and
    # is unaffected by any of this; the inventory is documentation generated
    # from the same lockfile. Gating documentation staleness on a pull request
    # meant every dependency bump failed by construction — Dependabot cannot
    # regenerate the file — so a bot that exists to reduce toil produced a red
    # check on every one of its own pull requests, on exactly the changes where
    # the diff is a column of version numbers.
    #
    # Here it is bounded by a day, and at release it is regenerated outright, so
    # a published version's attribution is exact at the moment somebody's legal
    # review reads it. That is when it matters.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version-pinned: the script canonicalises row order on top of `cargo
      # about generate`, so a release that changed how the generator groups or
      # orders crates would show up here as spurious drift.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about@0.9.1
      - id: regen
        run: make attribution
      - id: drift
        run: git diff --exit-code THIRD-PARTY.md

      - name: Report the drift as an issue
        if: failure() && steps.drift.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='THIRD-PARTY.md is out of date'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still drifted: ${RUN_URL}"
            exit 0
          fi
          # shellcheck disable=SC2016
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              'The committed attribution inventory no longer matches `Cargo.lock`.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'This is expected after a dependency bump and is not a licence' \
              'problem — `cargo deny check licenses` gates that on every pull' \
              'request and is green. Regenerate and commit:' \
              '' \
              '```sh' \
              'cargo install cargo-about --locked --features cli --version 0.9.1' \
              './scripts/attribution.sh' \
              '```' \
              '' \
              'The release flow regenerates it too, so this can also just wait' \
              'for the next release rather than being fixed on its own.'
          )"

  advisories:
    name: Advisories (RustSec)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 20
    # This runs *in addition to* ci.yml's `cargo deny check all`, not instead of
    # it. An advisory published against a crate already in Cargo.lock is
    # invisible until somebody happens to open a PR — on a quiet week, that is
    # the whole week. Running it on the schedule bounds disclosure-to-detection
    # by a day instead of by contributor activity.
    #
    # The converse is why the PR gate keeps `check all` rather than dropping
    # advisories to this job: a pull request that *introduces* a crate with an
    # existing advisory has to be stopped before it merges.
    permissions:
      contents: read
      # For the tracking issue below.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not cargo-deny-action — it builds a container that curls an unverified
      # release tarball into /usr/bin. install-action resolves the version from
      # a manifest baked into the pinned action SHA and enforces a SHA-256.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny@0.20.2
      # `--locked` so this asks about the graph we ship, not one resolved fresh
      # at 03:17 — the action's default arguments omit it.
      - id: deny
        run: cargo deny --all-features --locked check advisories

      # A red nightly is easy to miss — nobody is watching Actions at 03:17.
      # Reuse a single open issue rather than filing a new one every night
      # until the advisory is dealt with.
      #
      # Gated on the deny step specifically, not on `failure()`: a checkout or
      # toolchain-install failure would otherwise file an issue whose body
      # asserts an advisory was found, which is worse than silence.
      - name: Report the failure as an issue
        if: failure() && steps.deny.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Nightly advisory scan is failing'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
            exit 0
          fi
          # The single quotes are deliberate: the body is Markdown, and its
          # backticks must reach GitHub rather than being run as command
          # substitutions.
          # shellcheck disable=SC2016
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              '`cargo deny check advisories` failed on the nightly run.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'Triage is one of two things: upgrade the affected crate, or add a' \
              'dated `ignore` entry to `deny.toml` with a written justification.' \
              'Closing this issue without doing one of them just reopens it tomorrow.'
          )"

  minimal-versions:
    name: Declared version floors build
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    # Every version requirement in [workspace.dependencies] is a promise to
    # consumers: "this crate works with anything from here up". Nothing checked
    # that promise, and it was false for 19 of them — `bytes = "1"` could never
    # have worked, because our own tree already required 1.11.1, and
    # `metrics = "0.24"` named a release that does not compile at all.
    #
    # `-Z direct-minimal-versions` resolves our *direct* dependencies to the
    # lowest version each requirement admits, leaving transitives at their
    # normal resolution, and then builds. A green run means the floors are
    # honest; a red one means a floor is fiction and should be raised to
    # whatever actually builds — never lowered back to make this pass.
    #
    # Nightly-only: the flag is unstable. It also rewrites Cargo.lock, which is
    # why this job generates a throwaway lockfile rather than using `--locked`
    # against the committed one.
    #
    # Two limits worth knowing, so nobody reads this job as proving more than it
    # does. `--all-targets` does not include doctests, so a floor-version break
    # reachable only from a doc example would pass here. And the minimal graph is
    # only ever built on nightly — the MSRV job checks 1.94 against the committed
    # lockfile, so "oldest dependencies on the oldest compiler" is untested.
    #
    # Note it only catches a floor that is too *low*. A needlessly high floor
    # still builds, and narrows the range consumers can resolve against, which no
    # gate can detect — that one is on review.
    permissions:
      contents: read
      # For the tracking issue below.
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          shared-key: minimal-versions
      - name: Resolve every direct dependency to its declared floor
        id: resolve
        run: cargo generate-lockfile -Z direct-minimal-versions
      # `--all-targets` so dev-dependency floors are held to the same standard.
      # They do not reach consumers, but a floor that cannot build is still a
      # false statement — `divan = "0.1"` resolves to a release whose
      # `__private::EntryMeta` layout the `#[divan::bench]` macro cannot expand
      # against.
      #
      # Deliberately not `-D warnings`: the minimal graph surfaces upstream
      # deprecations (chrono's `TimeDelta::seconds`, since reverted upstream)
      # that say nothing about whether our floors are honest. Denying them would
      # make this job hostage to other people's deprecation churn.
      - id: check
        run: cargo check --workspace --all-targets --all-features --locked

      # Same reasoning as the advisories job: nobody is watching Actions at
      # 03:17, and a silent red here means the floors have drifted back into
      # fiction without anyone hearing about it. Drift detection is this job's
      # entire purpose, so silence is the one failure it cannot afford.
      - name: Report the failure as an issue
        if: failure() && (steps.resolve.conclusion == 'failure' || steps.check.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Declared version floors no longer build'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
            exit 0
          fi
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              'The workspace no longer builds when every direct dependency is' \
              'resolved to the lowest version its requirement admits.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'Raise the offending floor in [workspace.dependencies] to a version' \
              'that actually builds. Do not lower it back to make this pass — the' \
              'floor is a promise to consumers, and a green run is the only thing' \
              'that makes it a true one.'
          )"

  docs-build:
    name: Build site for deploy
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 30
    # The full build, including the two generated artifacts a pull request does
    # not pay for: rustdoc, and every dependency's licence text. ci.yml's `site`
    # job answers "does the site still build"; this one produces what actually
    # ships.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Docusaurus can derive per-page "last updated" times.
          fetch-depth: 0
          # Docusaurus reads git *history* for last-updated; it never pushes.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Same generator as ci.yml's attribution gate, different template: the
      # committed THIRD-PARTY.md carries licence ids only (so it stays
      # diffable), while the site carries every crate's full licence text.
      # ~300KB, regenerated per deploy rather than committed.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about@0.9.1
          shared-key: docs

      - name: Build API reference (rustdoc)
        run: cargo doc --workspace --exclude benchmarks --no-deps --all-features --locked

      # Stage rustdoc under the site's static/ dir so Docusaurus copies it into
      # the build at <baseUrl>/api/ (and it's served during local `npm start`).
      - name: Stage API reference into static/api
        run: |
          rm -rf website/static/api
          mkdir -p website/static/api
          cp -r target/doc/. website/static/api/
          # rustdoc emits no workspace-root index; redirect /api/ to the facade crate.
          cat > website/static/api/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=spate/index.html" />
              <link rel="canonical" href="spate/index.html" />
              <title>Spate API reference</title>
            </head>
            <body>
              <a href="spate/index.html">Redirecting to the spate crate API reference…</a>
            </body>
          </html>
          EOF

      - name: Build third-party licence texts
        run: |
          rm -rf website/static/licenses
          mkdir -p website/static/licenses
          cargo about generate --workspace --all-features --locked --fail \
            -o website/static/licenses/index.html about-html.hbs

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # After `npm ci`, not before: npm ci removes an existing node_modules
      # before installing, so a cache restored earlier is deleted and the step
      # silently does nothing.
      #
      # This is the only job that *writes* this cache — pull requests restore it
      # read-only. Keyed on the lockfile alone, so an unchanged lockfile finds
      # the existing entry and `actions/cache` skips the upload rather than
      # storing another ~88 MB copy every night.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: docusaurus-${{ runner.os }}-

      - name: Build Docusaurus site
        working-directory: website
        env:
          CI: "true"
        run: npm run build

      - name: Site is within the Cloudflare file limit
        run: |
          count=$(find website/build -type f | wc -l)
          echo "site files: $count"
          if [ "$count" -gt 18000 ]; then
            echo "::error::$count files, approaching Cloudflare Pages' 20000 limit."
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: website/build
          # Without this, a build that silently produced nothing uploads an
          # empty artifact and the deploy below wipes the live site.
          if-no-files-found: error

  docs-deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [plan, docs-build]
    if: needs.plan.outputs.nightly == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: https://spate.kainth.dev
    # Serialize production deploys; don't cancel an in-progress publish.
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    # Deliberately has no `actions/checkout` and restores no cache. This is the
    # only job in the repository that holds a production credential, and it must
    # never share a workspace with repository code or with restored build state.
    # Keep it that way.
    steps:
      - name: Download site artifact
        # No `run-id:` and no `github-token:`, so the lookup is scoped to this
        # run and cannot reach an artifact built by any other workflow.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: website/build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        # This step runs its own `npm i wrangler` on the runner, and it does so
        # *after* setting CLOUDFLARE_API_TOKEN in the environment. That is a
        # second, unlockfiled npm install resolved fresh on every deploy — and
        # website/.npmrc cannot reach it, because this job has no checkout, so
        # the install runs in an empty GITHUB_WORKSPACE with lifecycle scripts
        # on and the production token already in `process.env`.
        #
        # NPM_CONFIG_IGNORE_SCRIPTS closes that path the only way available
        # here: npm reads config from the environment, so this needs no file.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets wrangler record a GitHub Deployment for this run.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # wrangler-action v4 defaults to wrangler v4; naming it keeps the
          # major explicit rather than inherited from the action's default.
          # wrangler 3 is end-of-life, and Cloudflare gates the higher per-site
          # file ceiling on v4.
          wranglerVersion: "4"
          # --branch=main matches the project's production branch, so this
          # registers as a production deployment (not a preview).
          command: pages deploy website/build --project-name=spate --branch=main

  # ===========================================================================
  # WEEKLY
  # ===========================================================================
  features-powerset:
    name: Feature powerset (exhaustive)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    # The exhaustive check the pull-request path cannot afford: the `spate` facade
    # declares 18 feature keys, so this is 2^18 combinations and several build
    # librdkafka or compile OpenSSL from source. ~48 minutes, which is fine once
    # a week and was not fine on every PR. ci.yml runs `--each-feature` (linear)
    # instead, so a feature that fails alone is still caught in minutes; what
    # lands here is the interaction between two features that individually work.
    #
    # Weekly rather than nightly because feature interactions change only when
    # somebody edits a [features] table, which is rare, and 48 minutes seven
    # times a week to catch it a few days sooner is not a trade worth making.
    #
    # `--no-dev-deps` rewrites each Cargo.toml while it runs and restores it
    # afterwards, so a cancelled run can leave manifests stripped. Harmless on
    # a throwaway runner; worth knowing before running it locally.
    #
    # That rewrite is also why this is the one cargo call here without
    # `--locked`: the stripped manifest makes the lockfile need an update, and
    # `--locked` fails the run outright. Verified. Lockfile drift is caught on
    # the same commit by ci.yml's `--locked` jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-hack@0.6.45
          shared-key: dev-allfeatures
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps

  alloc-assertions:
    name: Allocation assertions (spate-core)
    runs-on: ubuntu-latest
    needs: plan
    # Nightly, and its own job rather than a step inside the weekly bench run.
    # `chain_alloc` is a hard assertion — a per-record allocation on the hot
    # path fails it — so it is a gate, and the rule at the top of this file
    # says gates do not belong on a slow timer. It cannot go on the pull-request
    # path without paying for a release build there, which is precisely what
    # moving the benches off that path bought back; nightly is where it was
    # before this restructure and is the honest compromise.
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release
      - run: cargo test -p spate-core --release --test chain_alloc --locked

  loom:
    name: Loom models (spate-core)
    runs-on: ubuntu-latest
    needs: plan
    # Nightly, not weekly. INV-3 says the checkpoint tracker stays synchronous
    # and free of async runtimes precisely so loom can model it, and the models
    # were nightly before this restructure — moving them to weekly would have
    # quietly widened the window on the one thing the project says it will not
    # let regress. It is 21 tests and a few minutes.
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # `--cfg loom` rebuilds the world against loom-typed primitives, so
          # this shares nothing with any other job and needs its own cache.
          shared-key: loom
      # Stays on the built-in harness deliberately: the loom models must run
      # as `--lib` only (doc tests compiled under `--cfg loom` construct
      # loom-typed primitives outside a model and abort), and nextest would
      # buy nothing here. Do not "modernise" this onto nextest.
      # The target carries `RUSTFLAGS=--cfg loom` itself, so this and a local
      # run are the same command rather than two spellings of it.
      - run: make loom

  coverage-containers:
    name: Coverage (with containers)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    timeout-minutes: 90
    # The docker-inclusive coverage number, reported under its own Codecov flag.
    # Weekly, not per-push: it is a second full instrumented run of a suite
    # ci.yml already ran, and the measurement that justified splitting it says
    # the container suites move the total by single digits over the 87.6%
    # docker-free baseline. codecov.yml sets `carryforward: true` on this flag
    # precisely so it can be updated on a slower cadence than `unit`.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          tools: nextest@0.9.140,cargo-llvm-cov@0.8.7
          # Not `docker`: this job builds instrumented, into
          # `target/llvm-cov-target`, where ci.yml's container job builds plain.
          # Sharing one entry would have them overwrite each other.
          shared-key: coverage-docker

      - name: Clean coverage state
        # `--locked` here is not redundant with the steps below: `clean` shells
        # out to `cargo metadata`, and it runs *first*. Without it, a stale
        # lockfile gets quietly repaired by this step and the `--locked` on the
        # steps that follow can never fire — which is exactly the case those
        # flags exist to catch.
        run: cargo llvm-cov clean --workspace --locked
      # `--no-report` accumulates raw profile data without rendering; the
      # `report` step merges both runs into one lcov file.
      - name: Coverage — unit and integration
        run: cargo llvm-cov --no-report nextest --profile ci --workspace --all-features --locked
      # Serial: a hosted runner is 2 cores / ~7 GB and this spans SeaweedFS,
      # NATS, Kafka and ClickHouse. Concurrency risks an OOM that would
      # read as a flake.
      - name: Coverage — docker suites
        run: >
          cargo llvm-cov --no-report nextest --profile docker
          --workspace --all-features --locked --run-ignored ignored-only --test-threads 1
      - name: Merge coverage
        run: >
          cargo llvm-cov report --lcov --locked --output-path lcov-full.info
          --ignore-filename-regex '(/tests/|/benchmarks/)'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-lcov-full
          path: lcov-full.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov-full.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: with-containers

  bench:
    name: Criterion + divan micro benches
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Release-profile artifacts; shares nothing with the dev-profile jobs.
          shared-key: release

      # Restored BEFORE the benches run, which is the whole point: this brings
      # last week's `previous` baseline onto disk so there is something to
      # compare against. Restoring it afterwards, as this once did, extracts a
      # tar over `target/criterion` and overwrites the results just measured —
      # the job then compares this week's numbers against themselves and the
      # post-job save stores the stale tree back under a fresh key, freezing the
      # baseline at whatever the first run produced, forever.
      #
      # A cache with a prefix restore-key is the mechanism that carries state
      # between scheduled runs: the exact key never hits, so it always falls
      # back to the newest previous entry. (`download-artifact` cannot do this —
      # with no `run-id` it looks only in the current run, where the artifact
      # does not exist yet.)
      - name: Restore last week's criterion baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: criterion-baseline-${{ github.run_id }}
          restore-keys: criterion-baseline-

      # Compile every bench target and benchmark rig in the bench (release)
      # profile. ci.yml's clippy `--all-targets` already type-checks all of them
      # on each PR, so what this adds is release-profile-only breakage — a link
      # error, or a `cfg(not(debug_assertions))` path. It lives here because
      # this job needs a release build anyway; on the PR path it was a second
      # full dependency compile and the slowest job in CI.
      - run: make bench-check
      # Both bench steps below name their target explicitly. `cargo bench -p X --
      # --save-baseline` forwards those args to *every* bench target in the
      # package, including the lib's default libtest harness, which rejects them
      # with "Unrecognized option: 'save-baseline'" and fails the step. That is
      # exactly how the 2026-07-06 run died.
      #
      # spate-core's only bench target is divan, not criterion — divan has no
      # baseline concept, so it takes no criterion arguments at all.
      - run: cargo bench -p spate-core --locked --bench chain
      # spate-avro's `decode` is the criterion bench, and it is what critcmp
      # compares below. Saved as `current`, against last week's `previous`:
      # critcmp needs *two* named baselines to compare anything. Given one it
      # prints a single column of 1.00 ratios and exits 0, which reads exactly
      # like a clean comparison and is how this step used to pass every week
      # while measuring nothing.
      - run: cargo bench -p spate-avro --locked --bench decode -- --save-baseline current

      # Version-pinned, but still built from source — critcmp is not in
      # install-action's manifest, so there is no checksummed prebuilt binary to
      # fetch. It runs after the benches and its output is advisory, so the
      # exposure is a build script on a scheduled runner rather than anything on
      # the pull-request path.
      - run: cargo install critcmp --locked --version 0.1.8

      - name: Compare against last week's baseline
        run: |
          set -euo pipefail
          if find target/criterion -type d -name previous | grep -q .; then
            critcmp previous current
          else
            echo "::notice::No previous baseline yet; this run establishes one."
          fi

      # Rotate `current` to `previous` so next week has something to compare
      # against. The cache saves at post-job from the tree as it stands here.
      - name: Rotate this week's baseline
        run: |
          set -euo pipefail
          rotated=0
          while IFS= read -r dir; do
            rm -rf "${dir%/current}/previous"
            mv "$dir" "${dir%/current}/previous"
            rotated=$((rotated + 1))
          done < <(find target/criterion -type d -name current)
          echo "rotated $rotated baseline director(ies) to 'previous'"
          if [ "$rotated" -eq 0 ]; then
            echo "::error::criterion wrote no 'current' baseline; the comparison above proved nothing."
            exit 1
          fi

  synthetic-trend:
    name: pipeline_synthetic trend run
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release
      - run: cargo build --release -p benchmarks --locked
      - run: RUN_ONE=1 THREADS=2 DURATION_S=60 RESULTS=synthetic-trend.jsonl ./target/release/pipeline_synthetic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-trend-${{ github.run_id }}
          path: synthetic-trend.jsonl
          if-no-files-found: error

  # ===========================================================================
  # Catch-all failure reporting.
  #
  # `advisories` and `minimal-versions` file their own issues, with triage
  # instructions specific to what they check, and are deliberately absent from
  # `needs` below so they are not reported twice. Every other job had no failure
  # path at all: it went red at 03:17 with nobody watching. That is worst for
  # `docs-build`/`docs-deploy`, which are now the only thing that publishes the
  # site — a silent failure there freezes the published documentation
  # indefinitely, and the first symptom is someone noticing the site is stale.
  # ===========================================================================
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    timeout-minutes: 20
    # Scores this repository against the OpenSSF checks — branch protection,
    # pinned dependencies, token permissions, dangerous workflow patterns,
    # signed releases, and so on. Most of what it looks for is already in place;
    # the value is that it keeps being true. A ruleset relaxed, an action
    # unpinned, or a `permissions:` block widened shows up here rather than
    # going unnoticed.
    #
    # Weekly rather than nightly: it grades a configuration, and a configuration
    # does not change most days.
    permissions:
      contents: read
      # Reads workflow run metadata for the checks that grade CI configuration.
      actions: read
      # `publish_results` signs its output with an OIDC token so the OpenSSF
      # API can attest that the score came from this repository rather than
      # from anyone who cared to POST one.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        id: scorecard
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API, which is what makes the README
          # badge resolve and the findings readable without downloading an
          # artifact. The repository is public and so is everything scored, so
          # this discloses nothing that is not already visible.
          publish_results: true

      # Kept for the run itself: the published result is a score, and this is
      # the detail behind it when a check regresses and the question is which
      # file caused it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 30

  report:
    name: Report scheduled failures
    runs-on: ubuntu-latest
    needs:
      - plan
      - docs-build
      - docs-deploy
      - features-powerset
      - alloc-assertions
      - loom
      - coverage-containers
      - bench
      - synthetic-trend
    # `always()` so this runs at all when a dependency failed, and a `contains`
    # guard so it stays silent on a green run. Skipped dependencies — the whole
    # other tier — are not failures.
    if: always() && contains(needs.*.result, 'failure')
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(echo "$RESULTS" | jq -r '
            to_entries | map(select(.value.result == "failure")) | .[].key' | sort | tr '\n' ' ')
          title='Scheduled run is failing'
          body=$(printf '%s\n' \
            "Failed jobs: ${failed}" \
            '' \
            "Run: ${RUN_URL}" \
            '' \
            'The scheduled tier detects the world changing underneath a static' \
            'tree, so a failure here is usually not caused by the last commit.' \
            'Check the run before assuming a regression.')
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
