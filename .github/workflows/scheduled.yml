name: Scheduled

# Two tiers in one file, selected by which cron fired. What belongs here is the
# world changing underneath a static tree; anything whose job is to stop a
# change entering `main` belongs in ci.yml.
on:
  schedule:
    # Off the hour: scheduled runs queue at peak, and the hour is the peak.
    - cron: "17 3 * * *" # nightly
    - cron: "43 4 * * 1" # weekly, Monday
  workflow_dispatch:
    inputs:
      tier:
        description: >-
          Which tier to run. `docs` builds and deploys the site alone; the
          release dispatches it after a publish so the install snippets go
          live without dragging the whole nightly tier along.
        type: choice
        default: nightly
        options: [nightly, weekly, both, docs]

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the measurement behind these.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

permissions:
  contents: read

# A manual dispatch must not race the cron over the criterion baseline cache,
# and cancelling one mid-write leaves the baseline half written.
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nightly: ${{ steps.select.outputs.nightly }}
      weekly: ${{ steps.select.outputs.weekly }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - id: select
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TIER: ${{ inputs.tier }}
        run: |
          nightly=false
          weekly=false
          docs=false
          case "${SCHEDULE:-}" in
            "17 3 * * *") nightly=true ;;
            "43 4 * * 1") weekly=true ;;
          esac
          case "${TIER:-}" in
            nightly) nightly=true ;;
            weekly)  weekly=true ;;
            both)    nightly=true; weekly=true ;;
            docs)    docs=true ;;
          esac
          # These cron strings are duplicated from `on: schedule:`. Editing one
          # copy and not the other selects no tier: every job skips and the run
          # reports green.
          if [ "$nightly" = false ] && [ "$weekly" = false ] && [ "$docs" = false ]; then
            echo "::error::No tier selected (schedule='${SCHEDULE:-}', tier='${TIER:-}')."
            echo "::error::The cron strings here must match the ones in 'on: schedule:'."
            exit 1
          fi
          { echo "nightly=$nightly"; echo "weekly=$weekly"; echo "docs=$docs"; } | tee -a "$GITHUB_OUTPUT"

  # ===========================================================================
  # NIGHTLY
  # ===========================================================================
  attribution:
    name: Attribution inventory
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 20
    # Not gated per pull request: Dependabot cannot regenerate THIRD-PARTY.md
    # and every bump would fail.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version-pinned: a release reordering the generator's output reads here
      # as spurious drift.
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about@0.9.1
      - id: regen
        run: make attribution
      - id: drift
        run: git diff --exit-code THIRD-PARTY.md

      # Both named steps: the regeneration itself can fail loud, on a
      # first-party crate the filter no longer finds among them.
      - name: Report the drift as an issue
        if: failure() && (steps.regen.conclusion == 'failure' || steps.drift.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='THIRD-PARTY.md is out of date'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still drifted: ${RUN_URL}"
            exit 0
          fi
          # shellcheck disable=SC2016
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              '`make attribution` failed, or the committed inventory no longer matches `Cargo.lock`.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'This is expected after a dependency bump and is not a license' \
              'problem. `cargo deny check licenses` gates that on every pull' \
              'request and is green. Regenerate and commit:' \
              '' \
              '```sh' \
              'cargo install cargo-about --locked --features cli --version 0.9.1' \
              './scripts/attribution.sh' \
              '```' \
              '' \
              'The release flow regenerates it too, so this can also just wait' \
              'for the next release rather than being fixed on its own.'
          )"

  advisories:
    name: Advisories (RustSec)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 20
    # An advisory against a crate already in Cargo.lock stays invisible until a
    # pull request is opened.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny@0.20.2
      - id: deny
        run: cargo deny --all-features --locked check advisories

      # Gated on the deny step, not `failure()`: a checkout failure would file
      # an issue asserting an advisory was found.
      - name: Report the failure as an issue
        if: failure() && steps.deny.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Nightly advisory scan is failing'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
            exit 0
          fi
          # Single quotes: the body's backticks must reach GitHub rather than
          # run as command substitutions.
          # shellcheck disable=SC2016
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              '`cargo deny check advisories` failed on the nightly run.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'Triage is one of two things: upgrade the affected crate, or add a' \
              'dated `ignore` entry to `deny.toml` with a written justification.' \
              'Closing this issue without doing one of them just reopens it tomorrow.'
          )"

  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    # MAX_TOTAL_TIME below times the number of targets, plus a cold instrumented
    # build of all of them. The current eight targets at five minutes each come
    # to 40 minutes of fuzzing and about 75 minutes of job.
    timeout-minutes: 120
    # A fuzz run reaches no point at which it is finished, so it runs on a
    # schedule rather than as a gate. New inputs arrive with nothing in this
    # repository changing.
    permissions:
      contents: read
      issues: write
    env:
      # Seconds per target. The corpus carries between nights, so coverage
      # accumulates across runs rather than restarting each one.
      MAX_TOTAL_TIME: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          # Same key as ci.yml's fuzz job, so whichever runs first warms the
          # other.
          shared-key: fuzz

      # Built from source: install-action carries no manifest for cargo-fuzz.
      - run: cargo install cargo-fuzz --locked --version 0.13.2

      # BEFORE the run: a restore afterwards extracts a tar over `fuzz/corpus`
      # and overwrites the inputs libFuzzer just found. The prefix restore-key
      # is what carries the corpus between nights.
      - name: Restore last night's corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build every fuzz target
        id: build
        run: |
          set -euo pipefail
          # Materialised and counted: an empty target set fuzzes nothing and
          # exits 0.
          cargo +nightly fuzz list >targets.txt
          # `|| true`: grep exits 1 on an empty file, and under `set -e` that
          # aborts the assignment before the check below can name the problem.
          targets=$(grep -c '' targets.txt || true)
          if [[ "$targets" -eq 0 ]]; then
            echo "::error::the fuzz crate declares no target; this run proved nothing"
            exit 1
          fi
          echo "building $targets target(s)"
          cargo +nightly fuzz build

      - name: Fuzz every target
        id: run
        run: |
          set -euo pipefail
          targets=$(grep -c '' targets.txt || true)
          echo "fuzzing $targets target(s) for ${MAX_TOTAL_TIME}s each"
          fuzzed=0
          crashed=""
          while IFS= read -r target; do
            [[ -n "$target" ]] || continue
            echo "::group::$target"
            if ! cargo +nightly fuzz run "$target" -- \
              -max_total_time="$MAX_TOTAL_TIME" -print_final_stats=1; then
              crashed="$crashed $target"
            fi
            echo "::endgroup::"
            fuzzed=$((fuzzed + 1))
          done <targets.txt
          if [[ "$fuzzed" -ne "$targets" ]]; then
            echo "::error::fuzzed $fuzzed of $targets target(s)"
            exit 1
          fi
          if [[ -n "$crashed" ]]; then
            echo "::error::a crashing input was found for:$crashed"
            exit 1
          fi

      # actions/cache's post step saves on a green job alone. A night that found
      # a crash still grew the corpus, and the crash can stand for several more
      # nights, so the save is split out and runs under `always()`.
      - name: Save this night's corpus
        if: always() && steps.build.conclusion == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload the crashing inputs
        if: failure() && steps.run.conclusion == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          # A target can also exit non-zero without writing one.
          if-no-files-found: warn

      # Gated on the run step, not `failure()`: a checkout or build failure
      # would file an issue asserting a crashing input was found.
      - name: Report the failure as an issue
        if: failure() && steps.run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='A fuzz target found a crashing input'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
            exit 0
          fi
          # Single quotes: the body's backticks must reach GitHub rather than
          # run as command substitutions.
          # shellcheck disable=SC2016
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              'A fuzz target exited non-zero on the nightly run. The input that' \
              'did it is attached to the run as the `fuzz-artifacts` artifact,' \
              'and the run log names the target.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'Reproduce it against the downloaded file:' \
              '' \
              '```sh' \
              'cargo +nightly fuzz run <target> <path-to-the-input>' \
              '```' \
              '' \
              'A panic on malformed bytes is a bug in the decoder, so the fix' \
              'goes with a unit test in the crate that owns it. Keep the input' \
              'under `fuzz/corpus/<target>/` so the case stays covered.'
          )"

  minimal-versions:
    name: Declared version floors build
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    # Builds every direct dependency at its requirement's lowest version. A red
    # run means a floor is fiction: raise it to what builds, do not lower it to
    # pass.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          shared-key: minimal-versions
      - name: Resolve every direct dependency to its declared floor
        id: resolve
        run: cargo generate-lockfile -Z direct-minimal-versions
      # `--all-targets` holds dev-dependency floors to the same standard. Not
      # `-D warnings`: the minimal graph surfaces other people's deprecations.
      - id: check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Report the failure as an issue
        if: failure() && (steps.resolve.conclusion == 'failure' || steps.check.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Declared version floors no longer build'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
            exit 0
          fi
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              'The workspace no longer builds when every direct dependency is' \
              'resolved to the lowest version its requirement admits.' \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'Raise the offending floor in [workspace.dependencies] to a version' \
              'that builds. Do not lower it back to make this pass: the floor' \
              'is a promise to consumers, and a green run is what makes it true.'
          )"

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true'
    # The backstop for the manifest-selected gate in ci.yml: a packaging
    # break can arrive with nothing in this repository changing (a yank, a
    # toolchain release).
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: publish

      - name: Bump to the next patch and commit it locally
        id: bump
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          next="${version%.*}.$(( ${version##*.} + 1 ))"
          ./scripts/release-version.sh --bump "$next"
          git config user.name 'spate-release[bot]'
          git config user.email 'spate-release[bot]@users.noreply.github.com'
          git commit --all --quiet --message "chore: simulate the release bump to $next"

      # The dry run cannot see these: it packages a crate with no description
      # or license with a warning and exit 0, while the upload rejects it
      # (cargo issue 14249).
      - id: metadata
        run: ./scripts/release-version.sh --check-publish-metadata

      - id: dry-run
        run: cargo publish --workspace --locked --dry-run

      # Gated on the named steps, not `failure()`: a checkout failure would
      # file an issue asserting the workspace no longer packages. The bump
      # step gets the neutral title: it runs sed, the rewriters and
      # `cargo update`, so its failures are the tooling or the network, and
      # filing them as a packaging break would be wrong twice a year.
      - name: Report the failure as an issue
        if: >-
          failure() &&
          (steps.bump.conclusion == 'failure' ||
           steps.metadata.conclusion == 'failure' ||
           steps.dry-run.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUMP_FAILED: ${{ steps.bump.conclusion == 'failure' }}
        run: |
          set -euo pipefail
          # Single quotes throughout: the body's backticks must reach GitHub
          # rather than run as command substitutions.
          # shellcheck disable=SC2016
          if [ "$BUMP_FAILED" = "true" ]; then
            title='Nightly publish rehearsal could not run'
            body_head='The simulated version bump failed before anything was packaged, so'
            body_head2='this says nothing about whether the workspace packages. Read the run.'
          else
            title='The workspace no longer packages'
            body_head='`cargo publish --workspace --locked --dry-run` or the upload-metadata'
            body_head2='check failed on the nightly run, at a simulated next-patch version.'
          fi
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
            exit 0
          fi
          # shellcheck disable=SC2016
          gh issue create --title "$title" --body "$(
            printf '%s\n' \
              "$body_head" \
              "$body_head2" \
              '' \
              "Run: ${RUN_URL}" \
              '' \
              'A release cannot upload until this is green, and a failure that' \
              'first appears on release day has already published whatever came' \
              'before it in the order. Fix it before cutting one.'
          )"

  docs-build:
    name: Build site for deploy
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.nightly == 'true' || needs.plan.outputs.docs == 'true'
    timeout-minutes: 30
    # The full build, with rustdoc and every dependency's license text on top.
    # This produces what ships.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Docusaurus can derive per-page "last updated" times.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-about@0.9.1
          shared-key: docs

      - name: Build API reference (rustdoc)
        run: cargo doc --workspace --no-deps --all-features --locked

      # Under static/ so Docusaurus copies it into the build at <baseUrl>/api/.
      - name: Stage API reference into static/api
        run: |
          rm -rf website/static/api
          mkdir -p website/static/api
          cp -r target/doc/. website/static/api/
          # rustdoc emits no workspace-root index; redirect /api/ to the facade crate.
          cat > website/static/api/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=spate/index.html" />
              <link rel="canonical" href="spate/index.html" />
              <title>Spate API reference</title>
            </head>
            <body>
              <a href="spate/index.html">Redirecting to the spate crate API reference…</a>
            </body>
          </html>
          EOF

      # The script filters the first-party crates and generates
      # THIRD-PARTY.md the same way, so the page and the inventory agree.
      - name: Build third-party license texts
        run: |
          rm -rf website/static/licenses
          mkdir -p website/static/licenses
          ./scripts/attribution.sh --html website/static/licenses/index.html

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # After `npm ci`, not before: npm ci removes node_modules, so a cache
      # restored earlier is deleted and the step silently does nothing. The only
      # job that *writes* this entry.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: docusaurus-${{ runner.os }}-

      - name: Build Docusaurus site
        working-directory: website
        env:
          CI: "true"
        run: npm run build

      - name: Site is within the Cloudflare file limit
        run: |
          count=$(find website/build -type f | wc -l)
          echo "site files: $count"
          if [ "$count" -gt 18000 ]; then
            echo "::error::$count files, approaching Cloudflare Pages' 20000 limit."
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: website/build
          # A build that silently produced nothing would upload an empty
          # artifact and the deploy below would wipe the live site.
          if-no-files-found: error

  docs-deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [plan, docs-build]
    if: >-
      (needs.plan.outputs.nightly == 'true' || needs.plan.outputs.docs == 'true') &&
      github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: https://spate.kainth.dev
    # Serialize production deploys; don't cancel an in-progress publish.
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    # No `actions/checkout` and no restored cache. The only job holding a
    # production credential; it must never share a workspace with repository
    # code or restored build state. Keep it that way.
    steps:
      - name: Download site artifact
        # No `run-id:` and no `github-token:`: scoped to this run.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: website/build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        # This step runs an unlockfiled `npm i wrangler` *after* putting
        # CLOUDFLARE_API_TOKEN in the environment, with lifecycle scripts on.
        # website/.npmrc cannot reach it; npm reads this from the environment.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets wrangler record a GitHub Deployment for this run.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # wrangler 3 is end-of-life, and Cloudflare gates the higher per-site
          # file ceiling on v4.
          wranglerVersion: "4"
          # --branch=main matches the project's production branch, so this
          # registers as a production deployment (not a preview).
          command: pages deploy website/build --project-name=spate --branch=main

  # ===========================================================================
  # WEEKLY
  # ===========================================================================
  features-powerset:
    name: Feature powerset (exhaustive)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    # 2^18 combinations, several building librdkafka or OpenSSL: ~48 minutes. A
    # cancelled run leaves manifests stripped.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-hack@0.6.45
          shared-key: dev-allfeatures
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps

  loom:
    name: Loom models (spate-core)
    runs-on: ubuntu-latest
    needs: plan
    # On the nightly tier: INV-3 gets the narrower regression window.
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: loom
      # Doc tests compiled under `--cfg loom` construct loom-typed primitives
      # outside a model and abort, so the models run `--lib` only on the built-in
      # harness. Do not move this onto nextest.
      - run: make loom

  examples-containers:
    name: Example container tier
    runs-on: ubuntu-latest
    needs: plan
    # The only thing driving a shipped example binary through SIGTERM and a real
    # drain.
    if: needs.plan.outputs.nightly == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: nextest@0.9.140
          # Same key as ci.yml's container job: both build the plain dev-profile
          # test binaries for the `#[ignore]`d suites.
          shared-key: docker
      # `--ignore-default-filter` plus an explicit expression is what selects a
      # suite the profile excludes; the filter alone leaves nothing to run.
      - name: Example container tier
        run: >
          cargo nextest run --profile docker -p spate --all-features --locked
          --run-ignored ignored-only -E 'binary(e2e_examples)'
          --ignore-default-filter --test-threads 1

      - name: Publish example container test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: target/nextest/docker/junit.xml
          check_name: Example container test results
          detailed_summary: true
          include_passed: false
          flaky_summary: true
          fail_on_failure: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-nextest-examples
          path: target/nextest/docker/junit.xml

  coverage-containers:
    name: Coverage (with containers)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    timeout-minutes: 90
    # The docker-inclusive number, under its own Codecov flag.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          tools: nextest@0.9.140,cargo-llvm-cov@0.8.7
          # Not `docker`: this builds instrumented into `target/llvm-cov-target`,
          # where ci.yml's container job builds plain.
          shared-key: coverage-docker

      - name: Clean coverage state
        # Not redundant with the steps below: `clean` shells out to `cargo
        # metadata` and runs *first*, so without `--locked` it quietly repairs a
        # stale lockfile and the later `--locked` flags can never fire.
        run: cargo llvm-cov clean --workspace --locked
      - name: Coverage (unit and integration)
        run: cargo llvm-cov --no-report nextest --profile ci --workspace --all-features --locked
      # Serial: 2 cores / ~7 GB across four servers; concurrency OOMs.
      - name: Coverage (docker suites)
        run: >
          cargo llvm-cov --no-report nextest --profile docker
          --workspace --all-features --locked --run-ignored ignored-only --test-threads 1
      - name: Merge coverage
        run: >
          cargo llvm-cov report --lcov --locked --output-path lcov-full.info
          --ignore-filename-regex '/(tests|examples)/'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-lcov-full
          path: lcov-full.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov-full.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: with-containers

  bench:
    name: Criterion micro benches
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Release-profile artifacts; shares nothing with the dev-profile jobs.
          shared-key: release

      # BEFORE the benches: restoring afterwards extracts a tar over
      # `target/criterion`, overwriting the results just measured and freezing
      # the baseline. The prefix restore-key is what carries state between runs.
      - name: Restore last week's criterion baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: criterion-baseline-${{ github.run_id }}
          restore-keys: criterion-baseline-

      - run: make bench-check
      # The target is named because a bare `-p X -- --save-baseline` reaches the
      # lib's libtest harness too, which rejects it. Given one baseline critcmp
      # prints a column of 1.00 ratios and exits 0, and a bench never run leaves
      # no `current` and drops out of the comparison silently.
      - run: cargo bench -p spate-clickhouse --locked --bench encode -- --save-baseline current

      # Built from source: install-action has no checksummed prebuilt for it.
      - run: cargo install critcmp --locked --version 0.1.8

      - name: Compare against last week's baseline
        run: |
          set -euo pipefail
          if find target/criterion -type d -name previous | grep -q .; then
            critcmp previous current
          else
            echo "::notice::No previous baseline yet; this run establishes one."
          fi

      # Rotate so next week has a `previous`. The cache saves at post-job from
      # the tree as it stands here.
      - name: Rotate this week's baseline
        run: |
          set -euo pipefail
          rotated=0
          while IFS= read -r dir; do
            rm -rf "${dir%/current}/previous"
            mv "$dir" "${dir%/current}/previous"
            rotated=$((rotated + 1))
          done < <(find target/criterion -type d -name current)
          echo "rotated $rotated baseline director(ies) to 'previous'"
          if [ "$rotated" -eq 0 ]; then
            echo "::error::criterion wrote no 'current' baseline; the comparison above proved nothing."
            exit 1
          fi

  # ===========================================================================
  # Catch-all failure reporting. `advisories`, `minimal-versions` and `fuzz`
  # file their own issues and are absent from `needs` below so they are not
  # reported twice.
  # ===========================================================================
  report:
    name: Report scheduled failures
    runs-on: ubuntu-latest
    needs:
      - plan
      - docs-build
      - docs-deploy
      - features-powerset
      - loom
      - examples-containers
      - coverage-containers
      - bench
    # Skipped dependencies, meaning the whole other tier, are not failures.
    if: always() && contains(needs.*.result, 'failure')
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(echo "$RESULTS" | jq -r '
            to_entries | map(select(.value.result == "failure")) | .[].key' | sort | tr '\n' ' ')
          title='Scheduled run is failing'
          body=$(printf '%s\n' \
            "Failed jobs: ${failed}" \
            '' \
            "Run: ${RUN_URL}" \
            '' \
            'The scheduled tier detects the world changing underneath a static' \
            'tree, so a failure here is usually not caused by the last commit.' \
            'Check the run before assuming a regression.')
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
