[workspace]
resolver = "3"
members = [
    "crates/etl",
    "crates/etl-core",
    "crates/etl-avro",
    "crates/etl-json",
    "crates/etl-kafka",
    "crates/etl-clickhouse",
    "crates/etl-coordination",
    "crates/etl-s3",
    "crates/etl-test",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Marcus Kainth <marcus@kainth.dev>"]
repository = "https://github.com/marcuskainth/etl-rs"
keywords = ["etl", "pipeline", "streaming", "kafka", "clickhouse"]
categories = ["asynchronous", "data-structures"]

[workspace.dependencies]
# Internal crates — exact pins, versions move in lockstep via workspace.package.
etl-core = { version = "=0.1.0", path = "crates/etl-core" }
etl-avro = { version = "=0.1.0", path = "crates/etl-avro" }
etl-json = { version = "=0.1.0", path = "crates/etl-json" }
etl-kafka = { version = "=0.1.0", path = "crates/etl-kafka" }
etl-clickhouse = { version = "=0.1.0", path = "crates/etl-clickhouse" }
# default-features = false so the etl facade can gate the NATS tree
# behind its own `coordination-nats` feature (memory-only embedding must
# not drag async-nats in).
etl-coordination = { version = "=0.1.0", path = "crates/etl-coordination", default-features = false }
etl-s3 = { version = "=0.1.0", path = "crates/etl-s3" }
etl-test = { version = "=0.1.0", path = "crates/etl-test" }

# Async runtime and I/O edge.
tokio = { version = "1.52", default-features = false }
hyper = "1.10"
hyper-util = "0.1.12"
http-body-util = "0.1.2"

# Serialization and config.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Opt-in SIMD JSON decode backend behind etl-json's `simd` feature (off by
# default, excluded from `full`). The deserialization-formats study measured it
# faster than serde_json on the single-document and array paths (the
# Kafka-message default). Apache-2.0 / MIT with a clean transitive tree, so no
# deny.toml carve-out is needed. Default features stay on — they enable
# `serde_impl` (the `from_slice` path used here) and `runtime-detection`.
#
# Was `=0.17.3`, to keep the benchmark and the licence review looking at one
# fixed release. Cargo.lock already delivers that — it pins an exact version and
# CI builds `--locked` — whereas an `=` requirement in a *published* manifest is
# imposed on consumers, where it cannot be overridden and conflicts with any
# other crate in their graph wanting a different 0.17.x. The blast radius was
# limited only because `simd` is off by default.
simd-json = "0.17.3"
serde_yaml = { package = "yaml_serde", version = "0.10" }
serde_path_to_error = "0.1"
humantime-serde = "1.1"
uuid = { version = "1.18.1", default-features = false }
chrono = { version = "0.4.35", default-features = false, features = ["std"] }
time = { version = "0.3.36", default-features = false, features = ["std", "macros"] }
rust_decimal = { version = "1.13", default-features = false, features = ["std"] }
bytesize = { version = "2.4", features = ["serde"] }

# Errors, logging, metrics.
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.8", default-features = false }
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"

# Concurrency and buffers.
crossbeam-channel = "0.5.15"
bytes = "1.11.1"
core_affinity = "0.8"
foldhash = "0.2"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
# Split identity in etl-s3: ids are persisted, so the digest must hold up
# even for adversarially-named keys (a collision would silently drop work).
sha2 = "0.10"

# Connector dependencies. 0.x crates with breaking minors are held to a
# single minor; Cargo.lock pins exact patches.
rdkafka = "0.39"
clickhouse = "0.15"
apache-avro = "0.21"
# Object-storage client for etl-s3. 0.x like rdkafka/clickhouse: internal
# only, no types in public APIs (dependency policy in docs/DESIGN.md).
object_store = "0.14"
# NATS client for etl-coordination's JetStream KV backend. 0.x policy as
# above: single minor, internal only, never in public signatures. The
# `server_2_11` feature (in defaults) gates the limit-marker KV config the
# lease buckets depend on; the paired server version floor is asserted at
# startup.
async-nats = "0.49"
url = "2.5"
futures-util = { version = "0.3.31", default-features = false }
base64 = "0.22.1"
flate2 = "1.1"
zstd = "0.13"
# Benchmark-only codec, listed here rather than in benchmarks/Cargo.toml so
# every dependency in the workspace has exactly one declared version. 0.11.6
# rather than 0.11 because 0.11.0 through 0.11.5 are all yanked — cargo will not
# select them, so "0.11" was a floor naming no reachable release.
lz4_flex = "0.11.6"
schema_registry_converter = { version = "4.9", default-features = false }

# Test and bench tooling.
async-trait = "0.1.53"
serde_repr = "0.1.16"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = "0.15"
proptest = "1.11"
loom = "0.7"
criterion = "0.8"
divan = "0.1.13"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"

[profile.bench]
debug = true
