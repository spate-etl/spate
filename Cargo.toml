[workspace]
resolver = "3"
members = [
    "bench",
    "crates/spate",
    "crates/spate-core",
    "crates/spate-avro",
    "crates/spate-json",
    "crates/spate-kafka",
    "crates/spate-clickhouse",
    "crates/spate-coordination",
    "crates/spate-datagen",
    "crates/spate-s3",
    "crates/spate-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Marcus Kainth <marcus@kainth.dev>"]
repository = "https://github.com/spate-etl/spate"
homepage = "https://spate.kainth.dev"
keywords = ["etl", "pipeline", "streaming", "kafka", "clickhouse"]
categories = ["asynchronous", "data-structures"]

[workspace.dependencies]
spate-core = { version = "=0.1.0", path = "crates/spate-core" }
spate-avro = { version = "=0.1.0", path = "crates/spate-avro" }
spate-json = { version = "=0.1.0", path = "crates/spate-json" }
spate-kafka = { version = "=0.1.0", path = "crates/spate-kafka" }
spate-clickhouse = { version = "=0.1.0", path = "crates/spate-clickhouse" }
# Defaults off keeps async-nats out of a memory-only embedding.
spate-coordination = { version = "=0.1.0", path = "crates/spate-coordination", default-features = false }
spate-datagen = { version = "=0.1.0", path = "crates/spate-datagen" }
spate-s3 = { version = "=0.1.0", path = "crates/spate-s3" }
spate-test = { version = "=0.1.0", path = "crates/spate-test" }
# Versionless: cargo strips a versionless path dev-dependency at package time,
# letting a published crate dev-depend on this unpublished harness.
spate-bench = { path = "bench" }

tokio = { version = "1.52", default-features = false }
hyper = "1.10"
hyper-util = "0.1.12"
http-body-util = "0.1.2"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Default features stay on: they carry `serde_impl` and `runtime-detection`.
simd-json = "0.17.3"
serde_yaml = { package = "yaml_serde", version = "0.10" }
serde_path_to_error = "0.1"
humantime-serde = "1.1"
uuid = { version = "1.18.1", default-features = false }
chrono = { version = "0.4.35", default-features = false, features = ["std"] }
time = { version = "0.3.36", default-features = false, features = ["std", "macros"] }
rust_decimal = { version = "1.13", default-features = false, features = ["std"] }
bytesize = { version = "2.4", features = ["serde"] }

thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.8", default-features = false }
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"

crossbeam-channel = "0.5.15"
bytes = "1.11.1"
core_affinity = "0.8"
foldhash = "0.2"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
# Split identity in spate-s3. Ids are persisted and a collision drops work
# silently, so this must resist adversarially-named keys.
sha2 = "0.11"

# The connector clients below (rdkafka, clickhouse, apache-avro, object_store,
# async-nats) are internal only, never in public signatures (INV-6).
rdkafka = "0.39"
# Do not declare the lz4 codec separately. It arrives transitively through this
# crate's `lz4` feature, which spate-clickhouse enables; declaring it again
# either widens the client's features for workspace builds only, or puts two
# majors in the graph.
clickhouse = "0.15"
apache-avro = "0.22"
object_store = "0.14"
# The `server_2_11` default feature gates the limit-marker KV config the lease
# buckets depend on.
async-nats = "0.49"
url = "2.5"
futures-util = { version = "0.3.31", default-features = false }
base64 = "0.22.1"
flate2 = "1.1"
zstd = "0.13"
schema_registry_converter = { version = "4.9", default-features = false }

async-trait = "0.1.53"
serde_repr = "0.1.16"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = "0.15"
proptest = "1.11"
loom = "0.7"
criterion = "0.8"
# A normal (not dev) dependency, so cargo-about lists it in THIRD-PARTY.md.
clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# `getrusage`, for the harness's peak resident set and CPU time in one call.
# Raise the patch floor only when the `-Z direct-minimal-versions` job says to.
libc = "0.2.183"
gungraun = "0.19.4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"

[profile.bench]
debug = true
