[workspace]
resolver = "3"
members = [
    "bench",
    "crates/spate",
    "crates/spate-core",
    "crates/spate-avro",
    "crates/spate-json",
    "crates/spate-kafka",
    "crates/spate-clickhouse",
    "crates/spate-clickhouse-derive",
    "crates/spate-datagen",
    "crates/spate-s3",
    "crates/spate-sqs",
    "crates/spate-test",
    "test-support",
    "fuzz",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Marcus Kainth <marcus@kainth.dev>"]
repository = "https://github.com/spate-etl/spate"
homepage = "https://spate.kainth.dev"
keywords = ["etl", "pipeline", "streaming", "kafka", "clickhouse"]
categories = ["asynchronous", "data-structures"]

[workspace.dependencies]
spate-core = { version = "=0.3.0", path = "crates/spate-core" }
spate-avro = { version = "=0.3.0", path = "crates/spate-avro" }
spate-json = { version = "=0.3.0", path = "crates/spate-json" }
spate-kafka = { version = "=0.3.0", path = "crates/spate-kafka" }
spate-clickhouse = { version = "=0.3.0", path = "crates/spate-clickhouse" }
spate-clickhouse-derive = { version = "=0.3.0", path = "crates/spate-clickhouse-derive" }
spate-datagen = { version = "=0.3.0", path = "crates/spate-datagen" }
spate-s3 = { version = "=0.3.0", path = "crates/spate-s3" }
spate-sqs = { version = "=0.3.0", path = "crates/spate-sqs" }
spate-test = { version = "=0.3.0", path = "crates/spate-test" }
# Versionless: cargo strips a versionless path dev-dependency at package time,
# letting a published crate dev-depend on these unpublished crates.
spate-bench = { path = "bench" }
spate-test-support = { path = "test-support" }

tokio = { version = "1.52", default-features = false }
hyper = "1.10"
http = "1.3.1"
hyper-util = "0.1.16"
http-body-util = "0.1.3"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Default features stay on: they carry `serde_impl` and `runtime-detection`.
simd-json = "0.18.1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
serde_path_to_error = "0.1"
humantime-serde = "1.1"
uuid = { version = "1.23.3", default-features = false }
chrono = { version = "0.4.35", default-features = false, features = ["std"] }
time = { version = "0.3.36", default-features = false, features = ["std", "macros"] }
rust_decimal = { version = "1.13", default-features = false, features = ["std"] }
bytesize = { version = "2.4", features = ["serde"] }

ouroboros = "0.18.5"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", default-features = false }
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"

crossbeam-channel = "0.5.15"
bytes = "1.11.1"
core_affinity = "0.8"
foldhash = "0.2"
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash64"] }
# Split identity in spate-s3. Ids are persisted and a collision drops work
# silently, so this must resist adversarially-named keys.
sha2 = "0.11"

# The connector clients below (rdkafka, clickhouse, apache-avro, object_store)
# are internal only, never in public signatures (INV-6).
rdkafka = { version = "0.39", features = ["zstd"] }
# Not used directly. rdkafka-sys takes zstd-sys with its default features, and
# this floor is the first release rdkafka-sys accepts whose defaults leave out
# bindgen, which needs libclang on the build host.
zstd-sys = { version = "2.1", default-features = false }
openssl-sys = "0.9.108"
clickhouse = "0.15.3"
# spate-clickhouse compresses insert blocks with the lz4 codec the client
# uses, and features unify into one copy. So this entry names exactly the
# client's features: `safe-encode`, a default, would slow the client's codec
# as well as spate's, and a second major would put two codecs in the graph.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std"] }
# The checksum of ClickHouse's compressed block framing.
cityhash-rs = "1.0.1"
apache-avro = "0.22"
object_store = "0.14.1"
# spate-s3 decodes listing pages with the decoder object_store uses, so its
# version and features follow object_store's.
quick-xml = { version = "0.41.0", features = ["serialize", "overlapped-lists"] }
rustls-native-certs = "0.8.4"
webpki-roots = "1.0.10"
# The same Mozilla bundle as whole certificates, for a client that takes PEM.
webpki-root-certs = "1.0.10"
# spate-sqs's client, internal only (INV-6). Without default features the SDK
# leaves out its legacy hyper client on ring; `default-https-client` is the
# current hyper client on rustls with aws-lc. smithy-rs releases these
# together.
aws-config = { version = "1.13", default-features = false, features = ["default-https-client", "rt-tokio", "sso", "credentials-process"] }
aws-sdk-sqs = { version = "1.114", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Builds that client over a trust store spate-sqs assembles.
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = ["rustls-aws-lc"] }
# spate-clickhouse's HTTPS connector, handed to `clickhouse` in place of its
# default client, and the roots spate-avro's registry client verifies against.
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
url = "2.5.4"
futures-util = { version = "0.3.31", default-features = false }
base64 = "0.23.1"
flate2 = "1.1"
# clickhouse requires ^0.13, so 0.14 adds a second copy of the crate. Tracked
# in #562.
# spate-clickhouse's frame codec needs a `Sync` `CCtx`. This floor is the first
# release that guarantees one.
zstd = "0.13.1"
# spate-avro's schema registry client; internal only (INV-6).
reqwest = { version = "0.13.4", default-features = false }

async-trait = "0.1.53"
serde_repr = "0.1.16"
tempfile = "3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26.4", default-features = false }
testcontainers = "0.27"
testcontainers-modules = "0.15"
proptest = "1.11"
# The fuzz harness. 0.4.9 is the floor: every earlier release declares its
# license as `MIT/Apache-2.0/NCSA`, which is not an SPDX expression, and both
# cargo-deny and cargo-about refuse it.
libfuzzer-sys = "0.4.9"
# 1.4.2 is the floor: the derive emits calls into `arbitrary::details`, which
# the crate gained there, and cargo resolves the two independently.
arbitrary = { version = "1.4.2", features = ["derive"] }
# spate-clickhouse-derive's proc-macro toolchain.
syn = { version = "3", features = ["full"] }
quote = "1.0.44"
proc-macro2 = "1.0.106"
# Resolves the derive's emitted paths against whichever of spate-clickhouse or
# the spate facade the invoking crate actually depends on.
proc-macro-crate = "3"
trybuild = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
loom = "0.7"
criterion = "0.8"
clap = { version = "4.5", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# `getrusage`, for the harness's peak resident set and CPU time in one call.
# Raise the patch floor only when the `-Z direct-minimal-versions` job says to.
libc = "0.2.183"
gungraun = "0.20.0"
# xtask's changelog gate parses fragments as CommonMark; the HTML renderer
# and its CLI stay off.
pulldown-cmark = { version = "0.13.4", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(loom)"] }
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
absolute_paths = "warn"

[profile.release]
lto = "thin"

[profile.bench]
debug = true
