# cargo-about: generates the dependency attribution artifacts.
#
#   ./scripts/attribution.sh                  # THIRD-PARTY.md
#   cargo about generate --workspace --all-features --locked --fail \
#     -o website/static/licenses/index.html about/html.hbs   # docs site
#
# Generate the committed inventory through the script; it canonicalises the row
# order cargo-about leaves machine-dependent.

# Priority-ordered, where deny.toml's `allow` is a set: for a dual-licensed
# `MIT OR Apache-2.0` crate the first satisfiable entry is the one we comply
# with.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
    "0BSD",
    "BSL-1.0",
    "MIT-0",
    "Unlicense",
]

# The platforms Spate is built and shipped for. A crate reachable only through
# a `cfg()` predicate matching no target here is left out of the attribution.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Build-dependencies stay attributed: a build script can contribute generated
# code to the shipped artifact.
ignore-dev-dependencies = true

private = { ignore = true }

workarounds = ["ring", "rustls"]

# Per-crate clarifications, naming which file a licence text is read from. Both
# crates below ship several files scanning as the same licence id at equal
# confidence, and the scan's tie-break is readdir order, so an unclarified crate
# moves between licence-text groups from machine to machine (#87).
#
# Three things to know before editing an entry:
#
# - Checksums are of the whole file (`shasum -a 256`). Regenerate them when a
#   clarified crate is bumped: a stale checksum is only a warning, the
#   clarification is dropped and the scan silently takes over again.
# - `license` here *replaces* the crate's declared expression rather than being
#   checked against it, and nothing warns if the two drift. Re-check on a
#   version bump.
# - Listing several files for one licence id publishes all of their texts. The
#   site reproduces each, and `attribution.sh` collapses the duplicate rows that
#   would otherwise appear in THIRD-PARTY.md.
#
# Nothing re-checks the tie when a dependency is added; see #88.

# bnum vendors modified code from num-bigint and rand and ships their notices
# under `licenses/` alongside its own (see its COPYRIGHT). All three are listed
# so all three are reproduced.
[bnum.clarify]
license = "MIT OR Apache-2.0"

[[bnum.clarify.files]]
path = "LICENSE-MIT"
checksum = "d584283c484685cbd9a881194fb2192d103819b783ad1a286ad989c3735918f3"
license = "MIT"

[[bnum.clarify.files]]
path = "licenses/LICENSE-num-bigint"
checksum = "14435fbcd271e2783f721b57b7bf4f6502c1379249a4300e0e5bb774686c2d90"
license = "MIT"

[[bnum.clarify.files]]
path = "licenses/LICENSE-rand"
checksum = "cc367a7134c2b07d995a2f8dea591094a1d100e49c68513f729fdf3eaf580a21"
license = "MIT"

[[bnum.clarify.files]]
path = "LICENSE-APACHE"
checksum = "eb1cfebd2a5760e95f672ba77e5e43f047ada1641173a70990a822c6f0c4b873"
license = "Apache-2.0"

# `LICENSE` and `LICENSE-MIT.md` are the same notice, differing by one blank
# line and both carrying all four copyright holders, so naming either publishes
# the same text.
[miniz_oxide.clarify]
license = "MIT OR Zlib OR Apache-2.0"

[[miniz_oxide.clarify.files]]
path = "LICENSE-MIT.md"
checksum = "799e9ca9d179295ef372f25d3769cdda7d25bb2668add6a6a1e22d1e4c678b8d"
license = "MIT"

