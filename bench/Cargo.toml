[package]
name = "spate-bench"
description = "Wall-clock A/B benchmark harness for Spate (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Default is the author surface: the case builder, the measurement loop, the
# counting allocator and the corpus generators, all a crate's `benches/*_wall.rs`
# needs. `driver` adds the CLI (clap, git worktrees, cargo-metadata, the
# comparator) and only the `bench` binary enables it.
default = []
driver = ["dep:clap"]

[dependencies]
# `getrusage`, for the peak resident set and the CPU time in the same call.
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
twox-hash = { workspace = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "bench"
required-features = ["driver"]

# Named `_wall` like every crate-side target, outside the `*_gungraun`
# discovery glob.
[[bench]]
name = "selftest_wall"
harness = false
