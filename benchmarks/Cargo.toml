[package]
name = "benchmarks"
description = "Benchmark harnesses for the etl-rs framework (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
apache-avro = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
# `fast` pulls the serde_avro_fast backend in for the avro_pipeline A/B; the
# licence exceptions it needs are already scoped in deny.toml.
etl-avro = { workspace = true, features = ["fast"] }
etl-clickhouse = { workspace = true }
etl-core = { workspace = true }
etl-json = { workspace = true }
etl-kafka = { workspace = true }
lz4_flex = "0.11"
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
zstd = "0.13"

[lints]
workspace = true
