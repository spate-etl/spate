[package]
name = "benchmarks"
description = "Benchmark harnesses for the Spate framework (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Every auto-discovered bin would also get a libtest harness, and each of those
# harnesses is a separate binary the workspace test run has to link and execute
# for zero tests. Declared explicitly with `test = false` instead. `bench` stays
# on so `cargo bench --no-run --workspace` keeps proving these compile.
autobins = false

[features]
# Pass-through selector for the deser_formats simd-json arm. Rebuild the rig
# with this feature; the emitted `backend` variant tracks the compiled seam.
json-simd = ["spate-json/simd"]

[dependencies]
apache-avro = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
spate-avro = { workspace = true }
spate-clickhouse = { workspace = true }
# `default-features = false` (from the workspace entry) drops the NATS backend:
# the coordinated rig runs over the in-memory store, no broker.
spate-coordination = { workspace = true }
spate-core = { workspace = true }
spate-json = { workspace = true }
spate-kafka = { workspace = true }
spate-s3 = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
lz4_flex = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
zstd = { workspace = true }

[lints]
workspace = true

# See `autobins` above: these exist only to be run by hand (and to be
# compile-checked by `cargo clippy --all-targets` / `cargo bench --no-run`).
[[bin]]
name = "ch_native_format"
test = false

[[bin]]
name = "ch_sink_saturation"
test = false

[[bin]]
name = "deser_formats"
test = false

[[bin]]
name = "e2e_kafka_clickhouse"
test = false

[[bin]]
name = "kafka_sink_saturation"
test = false

[[bin]]
name = "kafka_topology"
test = false

[[bin]]
name = "loadgen"
test = false

[[bin]]
name = "multi_table_split"
test = false

[[bin]]
name = "pipeline_synthetic"
test = false

[[bin]]
name = "s3_backfill"
test = false

[[bin]]
name = "s3_backfill_coordinated"
test = false
# (whitespace-only change for a CI verification pull request)
