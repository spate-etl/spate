absolute-paths-max-segments = 3

# `missing_safety_doc` checks private `unsafe fn`s too.
check-private-items = true

disallowed-macros = [
    { path = "metrics::counter", reason = "register through a `Meter` or the stage constructors in `spate-core`'s `metrics::labels`; the raw facade is the INV-9 opt-out and takes an `expect` naming why" },
    { path = "metrics::gauge", reason = "register through a `Meter` or the stage constructors in `spate-core`'s `metrics::labels`; the raw facade is the INV-9 opt-out and takes an `expect` naming why" },
    { path = "metrics::histogram", reason = "register through a `Meter` or the stage constructors in `spate-core`'s `metrics::labels`; the raw facade is the INV-9 opt-out and takes an `expect` naming why" },
]

disallowed-methods = [
    { path = "std::path::Path::exists", replacement = "std::path::Path::try_exists", reason = "returns false on a stat error, so a permission or I/O failure reads as missing" },
    { path = "rdkafka::config::ClientConfig::new", reason = "build Kafka clients through `spate-kafka`'s `client::Base`, which owns the settings every client shares; a test outside every role takes an `expect` naming why" },
    { path = "rdkafka::config::ClientConfig::create", reason = "build Kafka clients through `spate-kafka`'s `client::Base`, which owns the settings every client shares; a test outside every role takes an `expect` naming why" },
    { path = "rdkafka::config::ClientConfig::create_with_context", reason = "build Kafka clients through `spate-kafka`'s `client::Base`, which owns the settings every client shares; a test outside every role takes an `expect` naming why" },
    { path = "rdkafka::config::FromClientConfig::from_config", reason = "build Kafka clients through `spate-kafka`'s `client::Base`, which owns the settings every client shares; a test outside every role takes an `expect` naming why" },
    { path = "rdkafka::config::FromClientConfigAndContext::from_config_and_context", reason = "build Kafka clients through `spate-kafka`'s `client::Base`, which owns the settings every client shares; a test outside every role takes an `expect` naming why" },
    { path = "rdkafka::client::Client::new", reason = "build Kafka clients through `spate-kafka`'s `client::Base`, which owns the settings every client shares; a test outside every role takes an `expect` naming why" },
]

await-holding-invalid-types = [
    { path = "tracing::span::Entered", reason = "the task can resume on another thread under the wrong span; use `Instrument::instrument` or `Span::in_scope`" },
    { path = "tracing::span::EnteredSpan", reason = "the task can resume on another thread under the wrong span; use `Instrument::instrument` or `Span::in_scope`" },
]
