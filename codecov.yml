# Codecov configuration. Two flags, uploaded by two different jobs:
#
#   unit            — the docker-free suite, from ci.yml, on every pull request.
#                     The status checks below gate on this one alone.
#   with-containers — the docker-free run merged with the `#[ignore]`d
#                     testcontainers suites, from scheduled.yml's weekly tier.

coverage:
  precision: 1
  round: down
  range: "70...90"

  status:
    # Both statuses are scoped to the `unit` flag. Without that they would
    # aggregate `with-containers` too, carried forward from main on a pull
    # request that never ran it, so the gate would silently include coverage
    # the pull request did not produce.
    patch:
      default:
        target: 80%
        threshold: 0%
        flags: [unit]
        # Informational while the target is calibrated. Flip to `false` once
        # a few real pull requests confirm it behaves.
        informational: true

    project:
      default:
        target: auto
        threshold: 1%
        flags: [unit]
        informational: true

comment:
  layout: "condensed_header, diff, flags, components, condensed_files"
  behavior: default
  require_changes: false

github_checks:
  annotations: true

flags:
  unit:
    # On a pull request this flag reflects what that run produced, rather than
    # the last value seen on main.
    carryforward: false
  with-containers:
    # Uploaded weekly, so most runs have none of their own. Carried forward so
    # the flag keeps its last known value instead of reading as a regression to
    # zero.
    carryforward: true

ignore:
  - "**/tests/**"
  - "crates/spate-test/**" # the mock/test-harness crate shipped for users
  - "examples/**"
  - "bench/**" # the wall-clock harness: unpublished, run by hand
  - "fuzz/**" # the libFuzzer harness: its own crate, outside the workspace
  # The entry points those targets reach the private decoders through. They
  # are exercised by the nightly fuzz tier, which needs a sanitizer build on
  # nightly and cannot run under `cargo llvm-cov`, so coverage reads them as
  # unreached however long they have been fuzzed.
  - "**/fuzz_seams.rs"

component_management:
  individual_components:
    - component_id: core
      name: spate-core
      paths: ["crates/spate-core/**"]
    - component_id: coordination
      name: spate-coordination
      paths: ["crates/spate-coordination/**"]
    - component_id: kafka
      name: spate-kafka
      paths: ["crates/spate-kafka/**"]
    - component_id: s3
      name: spate-s3
      paths: ["crates/spate-s3/**"]
    - component_id: clickhouse
      name: spate-clickhouse
      paths: ["crates/spate-clickhouse/**"]
    - component_id: codecs
      name: codecs (avro, json)
      paths: ["crates/spate-avro/**", "crates/spate-json/**"]
    - component_id: datagen
      name: spate-datagen
      paths: ["crates/spate-datagen/**"]
    - component_id: facade
      name: spate
      paths: ["crates/spate/**"]
