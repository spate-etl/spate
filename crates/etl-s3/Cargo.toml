[package]
name = "etl-s3"
description = "Bounded object-storage (S3) backfill source for the etl-rs pipeline framework: a self-terminating NDJSON backfill with durable manifest checkpoints and drift-checked resume. Applications should depend on the `etl` facade crate with the `s3` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
etl-core = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
humantime-serde = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
twox-hash = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
etl-test = { workspace = true }
proptest = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
