[package]
name = "etl"
description = "High-performance at-least-once ETL pipeline framework with a chaining operator API, checkpoint-driven source commits, sharded asynchronous sinks, backpressure, and Prometheus metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
etl-core = { workspace = true }
etl-avro = { workspace = true, optional = true }
etl-coordination = { workspace = true, optional = true }
etl-json = { workspace = true, optional = true }
etl-kafka = { workspace = true, optional = true }
etl-clickhouse = { workspace = true, optional = true }
etl-s3 = { workspace = true, optional = true }

[dev-dependencies]
apache-avro = { workspace = true }
flate2 = { workspace = true }
bytes = { workspace = true }
clickhouse = { workspace = true }
etl-test = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true }
metrics = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
testcontainers-modules = { workspace = true, features = ["kafka"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }

# Docker-backed end-to-end scenarios; one binary each because the metrics
# recorder is process-global. All #[ignore]d — run with:
# `cargo test -p etl --all-features -- --ignored --test-threads=1`
[[test]]
name = "e2e_happy"
required-features = ["full"]

[[test]]
name = "e2e_sink_outage"
required-features = ["full"]

[[test]]
name = "e2e_rebalance"
required-features = ["full"]

[[test]]
name = "e2e_drain_restart"
required-features = ["full"]

[[test]]
name = "e2e_poison"
required-features = ["full"]

[[example]]
name = "memory_pipeline"

[[example]]
name = "custom_operator"

[[example]]
name = "custom_source_sink"

[[example]]
name = "custom_metrics"

[[example]]
name = "kafka_avro_to_clickhouse"
required-features = ["full"]

[[example]]
name = "kafka_avro_flatmap_clickhouse"
required-features = ["full", "avro-fast"]

[[example]]
name = "multi_table_split"
required-features = ["full", "avro-fast"]

[[example]]
name = "kafka_to_kafka_split"
required-features = ["kafka"]

[[example]]
name = "json_ndjson_memory"
required-features = ["json"]

[[example]]
name = "s3_backfill"
required-features = ["s3", "json"]

[[example]]
name = "coordinated_pipeline"
required-features = ["coordination"]

[[example]]
name = "s3_coordinated_backfill"
required-features = ["s3", "json", "coordination"]

[features]
default = []
avro = ["dep:etl-avro"]
json = ["dep:etl-json"]
# JSON fidelity knobs passed through to etl-json (each implies `json`). Kept
# out of `full`: they are deliberate, documented trade-offs — `arbitrary-precision`
# in particular is crate-wide and interacts with flatten/untagged/RawValue.
json-float-roundtrip = ["json", "etl-json/float-roundtrip"]
json-arbitrary-precision = ["json", "etl-json/arbitrary-precision"]
json-raw-value = ["json", "etl-json/raw-value"]
# Opt-in simd-json decode backend for JSON (implies `json`). Deliberately
# excluded from `full`: it pulls in simd-json (SIMD JSON parsing) — a decode
# speedup on the single-document/array path over serde_json, per the
# deserialization-formats benchmark study. Permissively licensed (no compliance
# caveat like avro-fast), but kept opt-in so `full` stays lean. See the JSON
# connector docs.
json-simd = ["json", "etl-json/simd"]
kafka = ["dep:etl-kafka"]
clickhouse = ["dep:etl-clickhouse"]
# Multi-instance work-stealing coordination for broker-less sources: the
# protocol, StoreCoordinator, and the in-memory store — enough for tests
# and single-process embedding with zero infrastructure. The seam types
# (`etl::coordination`) and the CoordinationDriver need no feature.
# Standalone: no connector implies it.
coordination = ["dep:etl-coordination"]
# The production NATS JetStream KV store (server >= 2.11) on top of
# `coordination`; this is what pulls the async-nats dependency tree.
coordination-nats = ["coordination", "etl-coordination/nats"]
s3 = ["dep:etl-s3"]
# Fast Avro decode backend (implies `avro`). Deliberately excluded from
# `full`: it pulls in `serde_avro_fast`, whose crates.io license metadata
# (LGPL-3.0-only) conflicts with its repository license (MPL-2.0) — enabling
# it is a per-project compliance call. See the etl-avro crate docs.
avro-fast = ["avro", "etl-avro/fast"]
# Opt-in TLS/mTLS + SASL (SCRAM-SHA-*/PLAIN) for the Kafka connector (implies
# `kafka`). Deliberately excluded from `full`: it compiles OpenSSL from source
# (rdkafka's `ssl-vendored`), so `full` stays buildable without the extra
# toolchain and build time. See the securing-connections guide.
kafka-tls = ["kafka", "etl-kafka/tls"]
# ClickHouse ecosystem column types (each implies `clickhouse`).
clickhouse-uuid = ["clickhouse", "etl-clickhouse/uuid"]
clickhouse-chrono = ["clickhouse", "etl-clickhouse/chrono"]
clickhouse-time = ["clickhouse", "etl-clickhouse/time"]
clickhouse-rust-decimal = ["clickhouse", "etl-clickhouse/rust_decimal"]
full = ["avro", "json", "kafka", "clickhouse", "coordination-nats", "s3"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
