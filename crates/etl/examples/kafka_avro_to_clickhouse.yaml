# The flagship pipeline: Kafka → Avro → chain → sharded ClickHouse.
# Every ${VAR:-default} interpolates from the environment (Kubernetes:
# ConfigMap/Secret env). Framework sections are typed and validated;
# `source`/`deserializer`/`sink` bodies belong to their connectors.

pipeline:
  name: orders
  # threads: 4          # default: available cores minus the I/O reserve
  io_threads: 2

checkpoint:
  interval: 5s
  max_pending_batches: 1024
  drain_timeout: 25s    # keep below terminationGracePeriodSeconds

backpressure:
  # Sizing rule (docs/DESIGN.md § Backpressure): the budget's low watermark
  # must hold ~2x (shards x inflight x batch.max_bytes + queued chunks), or
  # a saturated source lives above the high watermark and throughput
  # collapses into min_pause duty cycles. With one shard and the batch
  # settings below: 2x (1 x 2 x 128MiB) = 512MiB -> 1GiB budget at low=0.5.
  # Throttled sources that never fill batches are fine with far less.
  max_inflight_bytes: 1GiB

metrics:
  exporter: prometheus
  listen: 0.0.0.0:9090  # /metrics, /healthz, /readyz

source:
  kafka:
    brokers: ${KAFKA_BROKERS:-localhost:9092}
    topic: ${KAFKA_TOPIC:-orders}
    group_id: ${KAFKA_GROUP:-orders-etl}
    commit_interval: 5s
    rdkafka:
      # Raw librdkafka passthrough. Properties the framework owns for
      # correctness (offset storage, auto-commit) are rejected here.
      auto.offset.reset: earliest

deserializer:
  avro:
    mode: confluent
    registry:
      url: ${SCHEMA_REGISTRY_URL:-http://localhost:8081}
    prewarm_subjects: ["${KAFKA_TOPIC:-orders}-value"]

sink:
  clickhouse:
    table: ${CLICKHOUSE_TABLE:-orders}
    # Column order is the RowBinary wire contract: it must match the row
    # struct's field declaration order in the example.
    columns: [id, customer, amount_cents, ts_ms]
    shards:
      - replicas: ["${CLICKHOUSE_URL:-http://localhost:8123}"]
    user: ${CLICKHOUSE_USER:-default}
    password: ${CLICKHOUSE_PASSWORD:-}
    batch:
      max_rows: 500000
      max_bytes: 128MiB
      linger: 1s
    inflight:
      max_per_shard: 2
