[package]
name = "spate-avro"
description = "Avro deserialization for the Spate framework: Confluent wire format, schema registry integration, and schema-evolution support. Applications should depend on the `spate` facade crate with the `avro` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
apache-avro = { workspace = true }
bytes = { workspace = true }
spate-core = { workspace = true }
schema_registry_converter = { workspace = true, features = ["futures", "rustls_tls"] }
humantime-serde = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
spate-test = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["http1", "server", "tokio"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
