[package]
name = "spate-clickhouse"
description = "ClickHouse sink for the Spate framework: direct-to-shard writes with replica rotation, batch flushing, and insert deduplication tokens. Applications should depend on the `spate` facade crate with the `clickhouse` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
clickhouse = { workspace = true, features = ["lz4", "zstd"] }
cityhash-rs = { workspace = true }
lz4_flex = { workspace = true }
# Declared directly: Cargo ignores `default-features = false` on an inherited
# entry whose workspace entry keeps the defaults, and the workspace entry keeps
# them for spate-s3. A bump of the workspace requirement (#562) changes this
# line too.
zstd = { version = "0.13.1", default-features = false }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
spate-core = { workspace = true }
spate-clickhouse-derive = { workspace = true }
foldhash = { workspace = true }
humantime-serde = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
twox-hash = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }

[features]
## `uuid::Uuid` fields for `UUID` columns via `serde::uuid`.
uuid = ["dep:uuid"]
## `chrono` fields (NaiveDate, DateTime<Utc>, Duration) for date/time
## columns via `serde::chrono`.
chrono = ["dep:chrono"]
## `time` crate fields (Date, OffsetDateTime, Duration) for date/time
## columns via `serde::time`.
time = ["dep:time"]
## Checked conversions between `rust_decimal::Decimal` and the pre-scaled
## `Decimal32/64/128` wrappers.
rust_decimal = ["dep:rust_decimal"]
## Test-only. Off by default, not enabled by the `spate` facade, and outside
## the semver surface.
testing = []

[dev-dependencies]
spate-clickhouse = { path = ".", features = ["testing"] }
gungraun = { workspace = true }
criterion = { workspace = true }
clickhouse = { workspace = true, features = ["lz4", "zstd", "test-util"] }
spate-test = { workspace = true }
spate-test-support = { workspace = true, features = ["tls"] }
proptest = { workspace = true }
serde_repr = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
spate-bench = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
testcontainers-modules = { workspace = true, features = ["clickhouse"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "encode_gungraun"
harness = false

[[bench]]
name = "route_gungraun"
harness = false

[[bench]]
name = "frame_gungraun"
harness = false

[[bench]]
name = "frame_wall"
harness = false

[[bench]]
name = "write_wall"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
