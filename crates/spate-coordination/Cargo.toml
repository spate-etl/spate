[package]
name = "spate-coordination"
description = "Distributed work coordination backend for the Spate pipeline framework: a leader-elected planner enumerates weighted splits into a shared low-latency store (NATS JetStream KV) and publishes a desired assignment per instance; workers lease and heartbeat what they are assigned, cooperatively drain what they are not, and commit progress through epoch-fenced compare-and-swap. Applications should depend on the `spate` facade crate with the `coordination` feature (in-memory store) or `coordination-nats` (the NATS backend)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["nats"]
# The NATS JetStream KV store backend. Off leaves the store trait, the
# protocol, and the in-memory store (tests, single-process embedding).
nats = ["dep:async-nats"]
# Test-only injection seam: exposes `clock::TestClock`, the deterministic
# clock this crate's `tests/` binaries drive, and `bench_seams`, which the
# instruction-count benches reach the pure decision core through. Off by
# default and never enabled by the `spate` facade, so a `TestClock` can never
# be wired into a real pipeline — it would stop the control loop dead — and
# neither seam is part of this crate's semver surface. Enabled for our own
# integration tests and benches via the self dev-dependency below.
testing = []

[dependencies]
async-nats = { workspace = true, optional = true }
base64 = { workspace = true }
spate-core = { workspace = true }
foldhash = { workspace = true }
# `alloc` is load-bearing for the feature-off build: BoxStream and
# StreamExt::boxed vanish without it once async-nats (which unified it
# in) is disabled.
futures-util = { workspace = true, features = ["alloc"] }
humantime-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Self dev-dependency so the external `tests/` binaries see the `testing`
# feature's `TestClock` while consumers never do.
spate-coordination = { path = ".", features = ["testing"] }
gungraun = { workspace = true }
proptest = { workspace = true }
serde_yaml = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The peer-join suite asserts on what the log says, so it needs a subscriber
# to capture: `fmt` is the formatter, installed globally for that one binary.
tracing-subscriber = { workspace = true, features = ["fmt"] }

# gungraun's `main!` is the harness; without these the default libtest one
# wraps them and rejects the harness's own arguments at run time.
[[bench]]
name = "assignment_gungraun"
harness = false

[[bench]]
name = "claims_gungraun"
harness = false

[lints]
workspace = true
