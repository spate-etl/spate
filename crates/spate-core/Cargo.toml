[package]
name = "spate-core"
description = "Engine for the Spate framework: records, operator chains, source/sink abstractions, checkpointing, backpressure, config, metrics, and the pipeline runtime. Applications should depend on the `spate` facade crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
core_affinity = { workspace = true }
crossbeam-channel = { workspace = true }
http-body-util = { workspace = true }
humantime-serde = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["http1", "server", "tokio"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }
serde = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
gungraun = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
spate-bench = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }

# A normal (not dev) target dependency: the library swaps to loom atomics under
# `--cfg loom`, which a dev-dependency cannot provide. Absent from normal builds.
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[[bench]]
name = "chain_gungraun"
harness = false

[[bench]]
name = "split_gungraun"
harness = false

[[bench]]
name = "checkpoint_gungraun"
harness = false

[[bench]]
name = "backpressure_gungraun"
harness = false

# The wall-clock A/B tier, driven by `make bench-ab`.
[[bench]]
name = "chain_wall"
harness = false

[[bench]]
name = "split_wall"
harness = false

[[bench]]
name = "control_plane_wall"
harness = false

[lints]
workspace = true
