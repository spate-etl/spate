[package]
name = "spate-core"
description = "Engine for the Spate framework: records, operator chains, source/sink abstractions, checkpointing, backpressure, config, metrics, and the pipeline runtime. Applications should depend on the `spate` facade crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
core_affinity = { workspace = true }
crossbeam-channel = { workspace = true }
http-body-util = { workspace = true }
humantime-serde = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["http1", "server", "tokio"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }
serde = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
criterion = { workspace = true }
divan = { workspace = true }
gungraun = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }

# A real (not dev) target dependency: the library itself swaps to loom
# atomics under `--cfg loom`, which dev-dependencies cannot provide. Absent
# from all normal builds.
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

# divan provides its own main; without this the default libtest harness
# wraps the file and `cargo bench` silently runs zero benchmarks.
[[bench]]
name = "chain"
harness = false

# Same reason: gungraun's `main!` is the harness. Runs only where valgrind and
# a same-version `gungraun-runner` are installed — see `make bench-gungraun`.
[[bench]]
name = "chain_gungraun"
harness = false

[lints]
workspace = true
