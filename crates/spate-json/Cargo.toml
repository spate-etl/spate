[package]
name = "spate-json"
description = "JSON deserialization for the Spate framework: single-document, NDJSON, and top-level-array framings decoded into serde types or dynamically-typed values. Applications should depend on the `spate` facade crate with the `json` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Fidelity knobs passed straight through to serde_json. Each is a deliberate,
# documented trade-off (see the crate docs); `arbitrary-precision` in particular
# unifies crate-wide across the dependency graph and interacts with
# flatten/untagged/RawValue.
float-roundtrip = ["serde_json/float_roundtrip"]
arbitrary-precision = ["serde_json/arbitrary_precision"]
raw-value = ["serde_json/raw_value"]
# Opt-in SIMD decode backend behind the byte-slice → value seam (`backend.rs`).
# Off by default; when on, `decode_one` parses with simd-json instead of
# serde_json. The dup-key structural guard always stays on serde_json. The
# margin over serde_json depends on the payload and the host architecture.
simd = ["dep:simd-json"]

[dependencies]
spate-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
gungraun = { workspace = true }
spate-test = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde_yaml = { workspace = true }
proptest = { workspace = true }
# Versionless by way of the workspace table, so cargo strips it when the crate
# is packaged and the unpublished harness never reaches what a consumer
# resolves.
spate-bench = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# gungraun's `main!` is the harness; without this the default libtest one wraps
# it and rejects the harness's own arguments at run time.
[[bench]]
name = "decode_gungraun"
harness = false

[[bench]]
name = "framing_gungraun"
harness = false

# The wall-clock A/B tier, driven by `make bench-ab`. `harness = false` for the
# same reason and one more: the runner protocol's arguments only reach the
# target's own `main` when libtest is not in front of it, and the A/B driver
# builds both legs before it starts a target, so a missing stanza would surface
# several minutes into a comparison. `make check-wall-benches` catches it here
# instead.
[[bench]]
name = "decode_wall"
harness = false

[[bench]]
name = "framing_wall"
harness = false

[lints]
workspace = true
