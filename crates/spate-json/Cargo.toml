[package]
name = "spate-json"
description = "JSON deserialization for the Spate framework: single-document, NDJSON, and top-level-array framings decoded into serde types or dynamically-typed values. Applications should depend on the `spate` facade crate with the `json` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Fidelity knobs passed straight through to serde_json (see the crate docs).
# `arbitrary-precision` unifies crate-wide across the dependency graph and
# interacts with flatten/untagged/RawValue.
float-roundtrip = ["serde_json/float_roundtrip"]
arbitrary-precision = ["serde_json/arbitrary_precision"]
raw-value = ["serde_json/raw_value"]
# Opt-in SIMD decode backend behind the byte-slice to value seam (`backend.rs`).
simd = ["dep:simd-json"]

[dependencies]
spate-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
gungraun = { workspace = true }
spate-test = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde_yaml = { workspace = true }
proptest = { workspace = true }
spate-bench = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "decode_gungraun"
harness = false

[[bench]]
name = "framing_gungraun"
harness = false

# The wall-clock A/B tier, driven by `make bench-ab`.
[[bench]]
name = "decode_wall"
harness = false

[[bench]]
name = "framing_wall"
harness = false

[lints]
workspace = true
