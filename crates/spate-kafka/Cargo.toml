[package]
name = "spate-kafka"
description = "Kafka source, producer sink and work feed for the Spate framework, built on rdkafka: one consumer per process by default, with partition queues fanned across pipeline threads, a delivery-report-acknowledged producer sink, and a feed backend over work, retry and dead-letter topics. Applications should depend on the `spate` facade crate with the `kafka` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
tls = ["rdkafka/ssl-vendored", "dep:openssl-sys"]
# `KafkaJsonEncoder::with_simd_json`, a per-encoder opt-in. Without the call
# the encoder keeps serde_json.
json-simd = ["dep:simd-json"]
# Test-only. Off by default, not enabled by the `spate` facade, and outside
# the semver surface.
testing = []

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
spate-core = { workspace = true }
humantime-serde = { workspace = true }
openssl-sys = { workspace = true, optional = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
zstd-sys = { workspace = true }

[dev-dependencies]
# `json-simd`: the tests and the encode bench measure both JSON encoders in
# one build.
spate-kafka = { path = ".", features = ["testing", "json-simd"] }
gungraun = { workspace = true }
spate-json = { workspace = true }
# `testing`: `S3Source::with_clock`, so a bounded job's end check and the
# lanes' receive deadline run on a test clock.
spate-s3 = { workspace = true, features = ["testing"] }
# `testing`: `TestClock`.
spate-core = { workspace = true, features = ["testing"] }
spate-test = { workspace = true }
spate-test-support = { workspace = true, features = ["kafka", "s3", "tls"] }
metrics = { workspace = true }
object_store = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
proptest = { workspace = true }
# `raw_value`: pins how `with_simd_json` writes a `RawValue`.
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[package.metadata.docs.rs]
features = ["json-simd"]

[[bench]]
name = "encode_gungraun"
harness = false

# The allocation snapshot, driven by `cargo xtask bench alloc`.
[[bench]]
name = "encode_alloc"
harness = false

[[bench]]
name = "prepare_gungraun"
harness = false

[[bench]]
name = "prepare_alloc"
harness = false

[lints]
workspace = true
