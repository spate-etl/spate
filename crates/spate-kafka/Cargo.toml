[package]
name = "spate-kafka"
description = "Kafka source and producer sink for the Spate framework, built on rdkafka: a single consumer per process with partition queues fanned across pipeline threads, and a delivery-report-acknowledged producer sink. Applications should depend on the `spate` facade crate with the `kafka` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Opt-in TLS/mTLS + SASL (SCRAM-SHA-*/PLAIN) transport. Off by default: it
# turns on rdkafka's `ssl-vendored`, which compiles OpenSSL from source into the
# static build (longer builds; needs perl + a C compiler). SASL SCRAM/PLAIN ride
# on OpenSSL's libcrypto, so no separate SASL feature is needed —
# Kerberos/GSSAPI is intentionally not included. Security properties themselves
# are set through the raw `rdkafka` passthrough (see the securing-connections
# guide); this feature only compiles the transport in.
tls = ["rdkafka/ssl-vendored"]

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
spate-core = { workspace = true }
humantime-serde = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
spate-test = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde_yaml = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
testcontainers-modules = { workspace = true, features = ["kafka"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
