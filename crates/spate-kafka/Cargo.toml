[package]
name = "spate-kafka"
description = "Kafka source, producer sink and work feed for the Spate framework, built on rdkafka: a single consumer per process with partition queues fanned across pipeline threads, a delivery-report-acknowledged producer sink, and a feed backend over work, retry and dead-letter topics. Applications should depend on the `spate` facade crate with the `kafka` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
tls = ["rdkafka/ssl-vendored", "dep:openssl-sys"]
# Test-only. Off by default, not enabled by the `spate` facade, and outside
# the semver surface.
testing = []

[dependencies]
bytes = { workspace = true }
bytesize = { workspace = true }
spate-core = { workspace = true }
humantime-serde = { workspace = true }
openssl-sys = { workspace = true, optional = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
zstd-sys = { workspace = true }

[dev-dependencies]
spate-kafka = { path = ".", features = ["testing"] }
gungraun = { workspace = true }
spate-json = { workspace = true }
# `testing`: `S3Source::with_clock`, so a bounded job's end check runs on a
# test clock.
spate-s3 = { workspace = true, features = ["testing"] }
# `testing`: `TestClock`.
spate-core = { workspace = true, features = ["testing"] }
spate-test = { workspace = true }
spate-test-support = { workspace = true, features = ["rustfs", "tls"] }
metrics = { workspace = true }
object_store = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
proptest = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
testcontainers-modules = { workspace = true, features = ["kafka"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[[bench]]
name = "encode_gungraun"
harness = false

# The allocation snapshot, driven by `cargo xtask bench alloc`.
[[bench]]
name = "encode_alloc"
harness = false

[lints]
workspace = true
