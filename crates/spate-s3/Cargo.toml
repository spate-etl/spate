[package]
name = "spate-s3"
description = "Coordinated object-storage (S3) backfill source for the Spate pipeline framework: an elected leader plans the prefix into splits, workers lease them with fenced per-split progress in a coordination store, resume is drift-checked against ETag pins, and the job self-terminates when the plan completes. Applications should depend on the `spate` facade crate with the `s3` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Development-only seams: `S3Source::with_store` for tests, and
# `bench_seams` for the instruction-count benches. Off by default and never
# enabled by the `spate` facade, so neither the `object_store` types the
# first exposes nor the internals the second reaches touch a real consumer's
# API surface.
testing = []

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
spate-coordination = { workspace = true }
spate-core = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# Self dev-dependency purely to switch on the `testing` seams for this
# crate's own integration tests; dependents never see them.
spate-s3 = { path = ".", features = ["testing"] }
# The NATS backend for the Docker-gated durable-resume suite; a dev-only
# feature — dependents of spate-s3 never link async-nats through it.
spate-coordination = { workspace = true, features = ["nats"] }
spate-test = { workspace = true }
gungraun = { workspace = true }
proptest = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# gungraun's `main!` is the harness; without this the default libtest one wraps
# it and rejects the harness's own arguments at run time.
[[bench]]
name = "split_gungraun"
harness = false

[lints]
workspace = true
