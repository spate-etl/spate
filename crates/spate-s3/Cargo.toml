[package]
name = "spate-s3"
description = "Object-storage (S3) source for the Spate pipeline framework: workers read objects and byte ranges as units from a work feed, filled by a lister run or by storage notifications, with reads pinned to ETags. Applications should depend on the `spate` facade crate with the `s3` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Test-only. Off by default, not enabled by the `spate` facade, and outside
# the semver surface.
testing = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
spate-core = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
quick-xml = { workspace = true }
# `tls_rejection!` expands against this crate's rustls.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zstd = { workspace = true, features = ["arrays", "legacy", "zdict_builder"] }

[dev-dependencies]
spate-s3 = { path = ".", features = ["testing"] }
# `clock::tokio::TestClock`, which the job location tests advance.
spate-core = { workspace = true, features = ["testing"] }
spate-bench = { workspace = true }
spate-test = { workspace = true }
spate-test-support = { workspace = true, features = ["rustfs", "tls"] }
spate-json = { workspace = true }
gungraun = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

[[bench]]
name = "framing_gungraun"
harness = false

[[bench]]
name = "descriptor_gungraun"
harness = false

[[bench]]
name = "feed_small_objects_wall"
harness = false

# The allocation snapshot, driven by `cargo xtask bench alloc`.
[[bench]]
name = "framing_alloc"
harness = false

[lints]
workspace = true
