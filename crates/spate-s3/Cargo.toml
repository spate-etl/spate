[package]
name = "spate-s3"
description = "Coordinated object-storage (S3) backfill source for the Spate pipeline framework: an elected leader plans the prefix into splits, workers lease them with fenced per-split progress in a coordination store, resume is drift-checked against ETag pins, and the job self-terminates when the plan completes. Applications should depend on the `spate` facade crate with the `s3` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Development-only seams: `S3Source::with_store` for tests, `bench_seams` for
# the instruction-count benches. Off by default and not enabled by the `spate`
# facade.
testing = []

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
spate-coordination = { workspace = true }
spate-core = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
spate-s3 = { path = ".", features = ["testing"] }
spate-coordination = { workspace = true, features = ["nats"] }
spate-test = { workspace = true }
spate-json = { workspace = true }
gungraun = { workspace = true }
proptest = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "split_gungraun"
harness = false

[[bench]]
name = "framing_gungraun"
harness = false

[[bench]]
name = "descriptor_gungraun"
harness = false

[lints]
workspace = true
