[package]
name = "spate-test"
description = "Testing utilities for the Spate framework: in-memory sources and sinks with scripting handles for exercising pipelines without external infrastructure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
spate-core = { workspace = true }
proptest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[features]
default = []
# Property-testing strategies for framework types (payload vectors, lane
# layouts, source scripts, writer outcomes).
proptest = ["dep:proptest"]

[lints]
workspace = true
