[package]
name = "spate"
description = "High-performance at-least-once ETL pipeline framework with a chaining operator API, checkpoint-driven source commits, sharded asynchronous sinks, backpressure, and Prometheus metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
spate-core = { workspace = true }
spate-avro = { workspace = true, optional = true }
spate-coordination = { workspace = true, optional = true }
spate-json = { workspace = true, optional = true }
spate-kafka = { workspace = true, optional = true }
spate-clickhouse = { workspace = true, optional = true }
spate-s3 = { workspace = true, optional = true }

[dev-dependencies]
apache-avro = { workspace = true }
flate2 = { workspace = true }
bytes = { workspace = true }
clickhouse = { workspace = true }
spate-test = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true }
metrics = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
testcontainers-modules = { workspace = true, features = ["kafka"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }

# Docker-backed end-to-end scenarios; one binary each because the metrics
# recorder is process-global. All #[ignore]d — run with:
# `cargo test -p spate --all-features -- --ignored --test-threads=1`
[[test]]
name = "e2e_happy"
required-features = ["full"]

[[test]]
name = "e2e_sink_outage"
required-features = ["full"]

[[test]]
name = "e2e_rebalance"
required-features = ["full"]

[[test]]
name = "e2e_drain_restart"
required-features = ["full"]

[[test]]
name = "e2e_poison"
required-features = ["full"]

[[example]]
name = "memory_pipeline"

[[example]]
name = "custom_operator"

[[example]]
name = "custom_source_sink"

[[example]]
name = "custom_metrics"

[[example]]
name = "kafka_avro_to_clickhouse"
required-features = ["full"]

[[example]]
name = "kafka_avro_flatmap_clickhouse"
required-features = ["full"]

[[example]]
name = "multi_table_split"
required-features = ["full"]

[[example]]
name = "kafka_to_kafka_split"
required-features = ["kafka"]

[[example]]
name = "clickhouse_aggregating_mv"
required-features = ["clickhouse"]

[[example]]
name = "json_ndjson_memory"
required-features = ["json"]

[[example]]
name = "s3_backfill"
required-features = ["s3", "json"]

[[example]]
name = "coordinated_pipeline"
required-features = ["coordination"]

[[example]]
name = "s3_coordinated_backfill"
required-features = ["s3", "json", "coordination"]

[features]
default = []
avro = ["dep:spate-avro"]
json = ["dep:spate-json"]
# JSON fidelity knobs passed through to spate-json (each implies `json`). Kept
# out of `full`: they are deliberate, documented trade-offs — `arbitrary-precision`
# in particular is crate-wide and interacts with flatten/untagged/RawValue.
json-float-roundtrip = ["json", "spate-json/float-roundtrip"]
json-arbitrary-precision = ["json", "spate-json/arbitrary-precision"]
json-raw-value = ["json", "spate-json/raw-value"]
# Opt-in simd-json decode backend for JSON (implies `json`). Deliberately
# excluded from `full`: it pulls in simd-json (SIMD JSON parsing) — a decode
# speedup on the single-document/array path over serde_json, by a
# payload- and architecture-dependent margin. Kept opt-in so `full` stays lean.
# See the JSON connector docs.
json-simd = ["json", "spate-json/simd"]
kafka = ["dep:spate-kafka"]
clickhouse = ["dep:spate-clickhouse"]
# Multi-instance leader-assigned coordination for broker-less sources: the
# protocol, StoreCoordinator, and the in-memory store — enough for tests
# and single-process embedding with zero infrastructure. The seam types
# (`spate::coordination`) and the CoordinationDriver need no feature.
# Standalone: no connector implies it.
coordination = ["dep:spate-coordination"]
# The production NATS JetStream KV store (server >= 2.11) on top of
# `coordination`; this is what pulls the async-nats dependency tree.
coordination-nats = ["coordination", "spate-coordination/nats"]
s3 = ["dep:spate-s3"]
# Opt-in TLS/mTLS + SASL (SCRAM-SHA-*/PLAIN) for the Kafka connector (implies
# `kafka`). Deliberately excluded from `full`: it compiles OpenSSL from source
# (rdkafka's `ssl-vendored`), so `full` stays buildable without the extra
# toolchain and build time. See the securing-connections guide.
kafka-tls = ["kafka", "spate-kafka/tls"]
# ClickHouse ecosystem column types (each implies `clickhouse`).
clickhouse-uuid = ["clickhouse", "spate-clickhouse/uuid"]
clickhouse-chrono = ["clickhouse", "spate-clickhouse/chrono"]
clickhouse-time = ["clickhouse", "spate-clickhouse/time"]
clickhouse-rust-decimal = ["clickhouse", "spate-clickhouse/rust_decimal"]
full = ["avro", "json", "kafka", "clickhouse", "coordination-nats", "s3"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
