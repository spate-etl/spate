# Zero-copy pipeline: Kafka → Avro (borrowed) → flat_map → ClickHouse Native.
# The high-performance sibling of kafka_avro_to_clickhouse.yaml. Every
# ${VAR:-default} interpolates from the environment (Kubernetes:
# ConfigMap/Secret env). Framework sections are typed and validated;
# `source`/`deserializer`/`sink` bodies belong to their connectors.

pipeline:
  name: sensor-events
  # threads: 4          # default: available cores minus the I/O reserve
  io_threads: 2

checkpoint:
  interval: 5s
  max_pending_batches: 1024
  drain_timeout: 25s    # keep below terminationGracePeriodSeconds

backpressure:
  # Sizing rule (see the Backpressure concept page): the budget's low watermark
  # must hold ~2x (shards x inflight x batch.max_bytes + queued chunks).
  max_inflight_bytes: 1GiB

admin:
  listen: 0.0.0.0:9090  # /metrics, /healthz, /readyz

metrics:
  exporter: prometheus

source:
  kafka:
    brokers: ${KAFKA_BROKERS:-localhost:9092}
    topic: ${KAFKA_TOPIC:-sensor-batches}
    group_id: ${KAFKA_GROUP:-sensor-events-etl}
    commit_interval: 5s
    rdkafka:
      auto.offset.reset: earliest

deserializer:
  avro:
    # Bare datums with a fixed writer schema — no registry. The fast backend
    # (`build_fast`) has no reader-schema resolution, so evolution is
    # expressed with serde attributes on the row structs, not `reader_schema`.
    mode: raw
    schema:
      inline: |
        {"type":"record","name":"SensorBatch","fields":[
          {"name":"sensor","type":"string"},
          {"name":"batch_ts_ms","type":"long"},
          {"name":"events","type":{"type":"array","items":
            {"type":"record","name":"Event","fields":[
              {"name":"name","type":"string"},
              {"name":"value","type":"long"},
              {"name":"unit","type":"string"}]}}}]}

sink:
  clickhouse:
    table: ${CLICKHOUSE_TABLE:-sensor_events}
    # Columnar Native blocks: offloads parse CPU to the client and shrinks the
    # wire on LowCardinality columns. Column order is the positional contract —
    # it must match the SensorEvent struct's field order in the example.
    columns: [sensor, batch_ts_ms, name, value, unit]
    format: native
    # `full` checks type classes on the first record against the live table —
    # including the SensorEvent struct's DateTime64Millis wrapper against the
    # column's declared DateTime64(3) precision, so a milli/micro scale
    # mismatch fails fatally instead of landing 1970-era timestamps.
    # (`format: native` would upgrade `off` to `names` anyway: the encoder is
    # type-driven and always fetches system.columns.)
    validate_schema: full
    shards:
      - replicas: ["${CLICKHOUSE_URL:-http://localhost:8123}"]
    # Scale-out: list shards in the cluster's remote_servers order (shard i
    # here = shard_num i+1 there), weights matching the cluster config, and
    # let startup verify parity against the Distributed table's DDL — the
    # example's router already shards by xxHash64(sensor):
    # shards:
    #   - replicas: ["http://ch-0:8123"]
    #     weight: 1
    #   - replicas: ["http://ch-1:8123"]
    #     weight: 1
    # distributed_check:
    #   cluster: sensors
    #   table: sensor_events_dist
    #   sharding_key: sensor
    user: ${CLICKHOUSE_USER:-default}
    password: ${CLICKHOUSE_PASSWORD:-}
    batch:
      max_rows: 500000
      max_bytes: 128MiB
      linger: 1s
    inflight:
      max_per_shard: 2
