[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (author archived it) but has no safe replacement
    # in this position: it reaches us only through the `clickhouse` dev-dependency
    # (clickhouse -> polonius-the-crab -> higher-kinded-types -> paste). It is a
    # proc-macro with no runtime or network surface. Re-check when clickhouse
    # ships a release that drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained transitive dev-dep of clickhouse; no upgrade path" },
    # quick-xml 0.40.1 (object_store's S3 list-response parser) carries two
    # DoS-class advisories (quadratic duplicate-attribute check; unbounded
    # namespace-declaration allocation). Patched in quick-xml >= 0.41, but
    # object_store 0.14.0 pins the 0.40 minor and no released object_store
    # depends on 0.41 yet. Exposure is bounded: the XML parsed is the
    # operator's own object store's list responses, not attacker-controlled
    # input, and the worst case is denial of service of the backfill job
    # itself. Remove both when object_store releases against quick-xml 0.41.
    { id = "RUSTSEC-2026-0194", reason = "DoS-class; XML source is the operator's own object store; fixed upstream, waiting on an object_store release" },
    { id = "RUSTSEC-2026-0195", reason = "DoS-class; XML source is the operator's own object store; fixed upstream, waiting on an object_store release" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
]
# NOTE: these two crates power the opt-in `fast` feature of etl-avro. The
# feature is off by default — the default build contains no trace of either —
# and users who enable it make their own compliance call, so the exceptions
# admit exactly these crates at the exact evaluated versions. Two distinct
# situations:
#   - serde_avro_fast: metadata error. The repository is MPL-2.0 (fix merged
#     upstream, awaiting a release); crates.io metadata still says
#     LGPL-3.0-only. Narrow this exception when a corrected release ships
#     (MPL-2.0 is already on the allow list).
#   - serde_serializer_quick_unsupported: genuinely LGPL-3.0-only (LICENSE
#     file matches the metadata) — a ~300-line no_std macro-only helper by
#     the same author, and still a dependency of serde_avro_fast master, so
#     it remains in the feature's tree even after the metadata fix ships.
exceptions = [
    { name = "serde_avro_fast", version = "=2.1.0", allow = ["LGPL-3.0-only"] },
    { name = "serde_serializer_quick_unsupported", version = "=1.0.0", allow = [
        "LGPL-3.0-only",
    ] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
