[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (author archived it) but has no safe replacement
    # in this position: it arrives under `clickhouse`
    # (clickhouse -> polonius-the-crab -> higher-kinded-types -> paste).
    #
    # Corrected 2026-07-22: an earlier revision of this note called that a *dev*
    # dependency. It is not — `cargo tree --edges normal -i paste` puts the whole
    # chain in the shipped tree, which is also why `paste` appears in
    # THIRD-PARTY.md. The argument for ignoring it never rested on that claim:
    # `paste` is a **proc-macro**, so it runs at compile time only and contributes
    # no runtime or network surface to the artifact. Re-check when clickhouse
    # ships a release that drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro under clickhouse; compile-time only, no runtime or network surface; no upgrade path" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A `*` requirement on a *registry* dependency is still refused. What this
# exempts is narrower than "path dependencies": for a crate we publish it covers
# non-registry dependencies of **dev** kind only, and for one we do not publish,
# any kind.
#
# It is what lets a published crate dev-depend on the unpublished benchmark
# harness. `spate-bench = { path = "bench" }` carries no version deliberately,
# because cargo strips a versionless path dev-dependency when the crate is
# packaged — but cargo-deny reads a missing version as a wildcard whichever kind
# of edge it is on, so without this the documented way to add a
# `benches/*_wall.rs` fails `make deny` on the pull request that does it. The
# guard that still matters survives: a versionless path dependency under
# `[dependencies]` of a published crate is refused as before.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
