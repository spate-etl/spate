[graph]
all-features = true

[advisories]
version = 2
# Evaluated by the advisories check, so a yank follows its blocking rule.
yanked = "deny"
# zstd 0.13.3 and zstd-safe 7.2.4 stay in the graph only through the codec
# features of spate-clickhouse's clickhouse dev-dependency, because clickhouse
# requires zstd ^0.13 (#562). No published crate reaches them. Each ignore names
# an id, so a new advisory against either copy still fails the check, and an
# ignore that stops matching when #562 lands is reported as unused.
ignore = [
    { id = "RUSTSEC-2026-0391", reason = "clickhouse's zstd 0.13.3 calls no `with_context` constructor" },
    { id = "RUSTSEC-2026-0398", reason = "the `seekable` feature is off" },
    { id = "RUSTSEC-2026-0403", reason = "clickhouse's response decoder writes into an initialized slice and returns the error" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
]

# libfuzzer-sys vendors LLVM's libFuzzer, so its expression is
# `(MIT OR Apache-2.0) AND NCSA` and the NCSA term has to be satisfied on its
# own. The exception is scoped to this crate.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Exempts non-registry dependencies, which `spate-bench = { path = "bench" }`
# needs: it is versionless and cargo-deny reads a missing version as a wildcard.
# A `*` on a registry dependency, and a versionless path dependency under
# `[dependencies]` of a published crate, are still refused.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
