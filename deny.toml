[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Reaches the shipped tree as clickhouse -> polonius-the-crab ->
    # higher-kinded-types -> paste, so it appears in THIRD-PARTY.md. Re-check
    # when clickhouse drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro under clickhouse; compile-time only, no runtime or network surface; no upgrade path" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Exempts non-registry dependencies, which `spate-bench = { path = "bench" }`
# needs: it is versionless and cargo-deny reads a missing version as a wildcard.
# A `*` on a registry dependency, and a versionless path dependency under
# `[dependencies]` of a published crate, are still refused.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
