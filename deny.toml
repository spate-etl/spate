[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (author archived it) but has no safe replacement
    # in this position: it arrives under `clickhouse`
    # (clickhouse -> polonius-the-crab -> higher-kinded-types -> paste).
    #
    # Corrected 2026-07-22: an earlier revision of this note called that a *dev*
    # dependency. It is not — `cargo tree --edges normal -i paste` puts the whole
    # chain in the shipped tree, which is also why `paste` appears in
    # THIRD-PARTY.md. The argument for ignoring it never rested on that claim:
    # `paste` is a **proc-macro**, so it runs at compile time only and contributes
    # no runtime or network surface to the artifact. Re-check when clickhouse
    # ships a release that drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained transitive dev-dep of clickhouse; no upgrade path" },
    # quick-xml 0.40.1 (object_store's S3 list-response parser) carries two
    # DoS-class advisories (quadratic duplicate-attribute check; unbounded
    # namespace-declaration allocation). Patched in quick-xml >= 0.41, but
    # object_store 0.14.0 pins the 0.40 minor and no released object_store
    # depends on 0.41 yet. Exposure is bounded: the XML parsed is the
    # operator's own object store's list responses, not attacker-controlled
    # input, and the worst case is denial of service of the backfill job
    # itself. Remove both when object_store releases against quick-xml 0.41.
    { id = "RUSTSEC-2026-0194", reason = "DoS-class; XML source is the operator's own object store; fixed upstream, waiting on an object_store release" },
    { id = "RUSTSEC-2026-0195", reason = "DoS-class; XML source is the operator's own object store; fixed upstream, waiting on an object_store release" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
