[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# NOTE: serde_avro_fast (optional, behind etl-avro's `fast` feature) has
# conflicting license metadata (crates.io: LGPL-3.0-only, upstream repo:
# MPL-2.0). It must not be added as a dependency until verified; cargo-deny
# will fail the build if it arrives with LGPL metadata.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
