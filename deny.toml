[graph]
all-features = true

[advisories]
version = 2
# Evaluated by the advisories check, so a yank follows its blocking rule.
yanked = "deny"
# The default reports an unsound advisory only against a direct dependency of a
# workspace member.
unsound = "all"
ignore = [
    # astral-tokio-tar has no patched release, and testcontainers, a dev-dependency,
    # is its only path. Remove this entry in the change that moves testcontainers to
    # a release without the crate, so the id stops hiding a crate outside the graph.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained with no patched release, and reaches this tree only through testcontainers, a dev-dependency of the test suites" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CCADB root store data)
]

# libfuzzer-sys vendors LLVM's libFuzzer, so its expression is
# `(MIT OR Apache-2.0) AND NCSA` and the NCSA term has to be satisfied on its
# own. The exception is scoped to this crate.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Exempts non-registry dependencies, which `spate-bench = { path = "bench" }`
# needs: it is versionless and cargo-deny reads a missing version as a wildcard.
# A `*` on a registry dependency, and a versionless path dependency under
# `[dependencies]` of a published crate, are still refused.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
