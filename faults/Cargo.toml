[package]
name = "spate-faults"
description = "Multi-process fault runs for coordinated Spate workers (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
serde = { workspace = true }
serde_json = { workspace = true }
spate-coordination = { workspace = true, features = ["nats"] }
spate-core = { workspace = true }
spate-json = { workspace = true }
spate-s3 = { workspace = true, features = ["testing"] }
spate-test = { workspace = true }
spate-test-support = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
url = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
