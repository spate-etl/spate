[package]
name = "spate-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

# Every dependency is one inline table on one line. `scripts/release-version.sh
# --check` reads a `{` at end of line anywhere in a tracked `.toml` as an
# install snippet and fails.
[dependencies]
libfuzzer-sys = { workspace = true }
arbitrary = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
zstd = { workspace = true }
spate-avro = { workspace = true }
spate-clickhouse = { workspace = true }
spate-coordination = { workspace = true, features = ["testing"] }
spate-core = { workspace = true }
spate-json = { workspace = true }
spate-s3 = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[[bin]]
name = "avro_wire_confluent"
path = "fuzz_targets/avro_wire_confluent.rs"
test = false
doc = false
bench = false

