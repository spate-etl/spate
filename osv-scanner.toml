id = "RUSTSEC-2026-0391"
ignoreUntil = 2027-04-27
reason = "zstd 0.13.3 reaches this tree only through the codec features of spate-clickhouse's clickhouse dev-dependency, so no published crate builds it. clickhouse creates each decoder with `Decoder::new()` and compresses with the one-shot `zstd_safe::compress`, and never calls a `with_context` constructor."

