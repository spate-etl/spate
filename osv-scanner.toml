# Advisories OSV reports against `Cargo.lock` that this workspace cannot clear.
#
# An entry stops applying on its `ignoreUntil` date, and osv-scanner reports the
# advisory again from that day. The date is the review point.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
ignoreUntil = 2027-04-27
reason = "astral-tokio-tar 0.6.3 is unmaintained, and no version is patched. It reaches this tree only through testcontainers, a dev-dependency of the test suites, so no published crate ships it. Remove this entry in the change that moves testcontainers to a release without the crate."
