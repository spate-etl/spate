# Release automation.
#
# The loop is: release-plz watches `main`, opens a release pull request that
# bumps versions, and merging that pull request publishes and tags. Nothing
# releases without a human merging something.

[workspace]
# All crates move together. This needs no configuration: release-plz
# collects the next version of every package that inherits
# `[workspace.package] version`, takes the highest, and writes that back — and
# it preserves the `=` operator, so the exact internal pins in
# `[workspace.dependencies]` follow. `version_group` exists for workspaces that
# do not inherit; using it here would be worse than nothing, because it only
# applies to packages that themselves contain changes.

# The changelog is written by hand, one fragment per change under
# `changelog.d/`, and assembled by `./scripts/changelog.sh --build` at release.
#
# Two reasons, and only the second is about release-plz. The first is that the
# crates release in lockstep, so a per-crate changelog is actively misleading:
# a reader of spate-kafka's would see only kafka-scoped commits and miss the
# engine fix that shipped in the same version. One changelog at the root is the
# honest shape, and `changelog_path` is a `[[package]]` field that cannot be set
# for the workspace — so one root changelog is not a shape this tool can be
# configured into, only one it can be kept out of. The second is that pointing
# several packages at one `changelog_path` is the configuration release-plz is
# least happy with, so taking it out of the changelog path entirely removes a
# class of problem.
#
# It also suits the commit style here. The bodies argue; a generated list of
# subjects would read worse than the summary a person writes.
changelog_update = false

# A release happens when the release pull request is merged, not on every push
# to `main`. Without this, any commit that lands outside that flow publishes.
release_always = false

# Diffs the public API against the published baseline. Inert until 0.1.0 exists
# on crates.io, and the thing that makes the wide caret requirements in
# `[workspace.dependencies]` safe to keep once it does.
semver_check = true

pr_labels = ["release"]

# The default body renders an empty `<details><summary>Changelog</summary>`
# block here. That is not a bug in release-plz: with `changelog_update = false`
# every `release.changelog` is empty, and the default template's `{% set %}`
# capture still collects the loop's whitespace, which Tera reads as truthy — so
# the `{% if changes %}` guard that was meant to suppress the block does not.
#
# This is the same template with the changelog capture removed, and a pointer to
# where the release note actually lives put in its place. The version table and
# the cargo-semver-checks verdicts are the part worth keeping: the verdict is
# how a bump that is one step too high gets noticed before it ships.
pr_body = """
## 🤖 New release
{% for release in releases %}
* `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (⚠ API breaking changes){% elif release.semver_check == "compatible" %} (✓ API compatible changes){% endif %}
{%- endfor %}
{% for release in releases %}{% if release.breaking_changes %}
### ⚠ `{{ release.package }}` breaking changes

```text
{{ release.breaking_changes }}
```
{% endif %}{% endfor %}
The release note for this version is in
[CHANGELOG.md](https://github.com/spate-etl/spate/blob/main/CHANGELOG.md),
assembled from `changelog.d/` by `./scripts/changelog.sh --build`. If it is not
there yet it belongs on `main` **before this merges** — RELEASING.md has the
procedure.

Do not commit it to this branch: release-plz closes and replaces a release pull
request that gains a non-bot commit, so the entry would be lost the next time
anything lands on `main`.

---
This pull request was generated by [release-plz](https://github.com/release-plz/release-plz/).
"""

# Pinned rather than left to the default, because release.yml matches on it to
# decide whether a push to `main` is a release. The default varies with the
# workspace's shape — it is `chore: release` when packages carry different
# versions and `chore: release v{{ version }}` when they agree — and since
# these always agree, a change in that logic upstream would silently stop
# the publish job from recognising its own release. Setting it makes both sides
# of the match this repository's decision.
#
# The repository merges pull requests with the title as the squash subject, so
# this string is what lands on `main`.
pr_name = "chore: release v{{ version }}"

# One tag and one GitHub release per version, not a single of each. The defaults
# are per-package (`spate-core-v0.1.0`, …), which is right for a workspace whose
# crates version independently and pure noise for one that does not.
git_tag_enable = false
git_release_enable = false

[[package]]
name = "spate"
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# `{{ changelog }}` would be empty here — nothing generates one. Point at the
# written record instead.
git_release_body = """
[CHANGELOG.md](https://github.com/spate-etl/spate/blob/main/CHANGELOG.md) has what changed and why.

All crates release together at this version.
"""
