[package]
name = "spate-test-support"
description = "Test helpers shared across the Spate workspace (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `TestCa`, `native_certs` and `serve_tls`.
tls = [
    "dep:base64",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:tokio-rustls",
]
# `S3Store`.
s3 = ["dep:http", "dep:object_store", "dep:testcontainers", "dep:tokio"]
# `ElasticMq`.
elasticmq = ["dep:testcontainers"]

[dependencies]
base64 = { workspace = true, optional = true }
# `object_store` keeps the signer's `Method` private at its declared floor.
http = { workspace = true, optional = true }
object_store = { workspace = true, optional = true, features = ["aws"] }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true, features = ["blocking"] }
tokio = { workspace = true, optional = true, features = ["io-util", "net", "rt"] }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "containers"
required-features = ["elasticmq", "s3"]
