[package]
name = "spate-test-support"
description = "Test helpers shared across the Spate workspace (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `DynamoDbFaultProxy`.
dynamodb-proxy = ["dep:serde_json"]
# `TestCa`, `native_certs` and `serve_tls`.
tls = [
    "dep:base64",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:tokio-rustls",
]

[dependencies]
base64 = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "net", "rt"] }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
