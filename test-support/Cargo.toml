[package]
name = "spate-test-support"
description = "Test helpers shared across the Spate workspace (not published)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `TestCa`, `native_certs` and `serve_tls`.
tls = [
    "dep:base64",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:tokio-rustls",
]
# `KafkaBroker`, `SingleBroker` and `KafkaCluster`.
kafka = ["dep:testcontainers"]
# What a test does through a Kafka client: `create_topics`, `producer`,
# `transactional_producer` and `send`; `consumer`, `from_start`, `committed`,
# `committed_offsets` and `high_watermark`; and `KafkaCluster::await_brokers`
# and `partition_states`, which read the cluster's metadata.
kafka-client = ["kafka", "dep:rdkafka", "dep:tokio"]
# `S3Store`. A notifying store reaches the broker on `BROKER_FROM_INSIDE`.
s3 = ["container", "kafka", "dep:http", "dep:object_store", "dep:tokio"]
# `ElasticMq`.
elasticmq = ["container"]
# `ready` and `ready_async`, which wait for a started container's service.
container = ["dep:testcontainers", "dep:tokio"]
# The `events` corpus.
events = ["dep:serde", "dep:spate-bench"]
# `reported_executable`.
cargo = ["dep:serde_json"]

[dependencies]
base64 = { workspace = true, optional = true }
# `object_store` keeps the signer's `Method` private at its declared floor.
http = { workspace = true, optional = true }
object_store = { workspace = true, optional = true, features = ["aws"] }
rdkafka = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
spate-bench = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true, features = ["blocking"] }
tokio = { workspace = true, optional = true, features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }
rdkafka = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "containers"
required-features = ["elasticmq", "kafka-client", "s3"]

[[test]]
name = "events"
required-features = ["events"]
