# Advisories OSV reports against `package-lock.json` that the site cannot clear.
#
# An entry stops applying on its `ignoreUntil` date, and osv-scanner reports the
# advisory again from that day. The date is the review point.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-05-17
reason = "picomatch reaches this tree only through the Docusaurus build and dev server, by way of chokidar, micromatch, fast-glob, readdirp and jest-util. The patterns it compiles come from this repository and the Docusaurus config, never from a visitor, and the deployed site is static files. The advisory range covers 4.0.7, the newest release, so no upgrade clears it. Remove this entry once every picomatch in the lockfile is a patched release."
